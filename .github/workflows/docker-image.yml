name: Docker Image

on:
  push:
    branches: [develop]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: trecek/autoskillit

jobs:
  plan:
    name: Resolve publication
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
      tags: ${{ steps.plan.outputs.tags }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 2

      - name: Resolve publication
        id: plan
        run: |
          set -euo pipefail
          version_of() {
            python3 -c 'import sys, tomllib; print(tomllib.loads(sys.stdin.read())["project"]["version"])'
          }
          version=$(version_of < pyproject.toml)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            channel_tags="stable latest"
          elif [ "$(git show HEAD^:pyproject.toml | version_of)" != "$version" ]; then
            channel_tags="develop"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "publish=true"
            echo "version=$version"
            echo "tags<<EOF"
            for tag in "$version" "sha-${GITHUB_SHA::7}" $channel_tags; do
              echo "$IMAGE_NAME:$tag"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  publish:
    name: Build, push and verify the user image
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Export the archived build context
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/build-context"
          git archive "$GITHUB_SHA" | tar -x -C "$RUNNER_TEMP/build-context"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/build-context
          file: ${{ runner.temp }}/build-context/scripts/docker/Dockerfile
          target: user
          platforms: linux/amd64
          push: true
          tags: ${{ needs.plan.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.plan.outputs.version }}
          cache-from: type=gha,scope=docker-image-user
          cache-to: type=gha,scope=docker-image-user,mode=max

      - name: Verify the pushed image without logging in
        run: |
          docker logout
          scripts/docker/verify-image "$IMAGE_NAME:sha-${GITHUB_SHA::7}"
