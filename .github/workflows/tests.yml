name: Tests

on:
  push:
    branches: [main, stable]
  pull_request:
    branches: [main, develop, stable]
  merge_group:

permissions:
  contents: read

jobs:
  preflight:
    name: Preflight checks
    runs-on: ubuntu-latest
    outputs:
      os-matrix: ${{ steps.ci-policy.outputs.os-matrix }}
      test-filter-mode: ${{ steps.ci-policy.outputs.test-filter-mode }}
      test-base-revision: ${{ steps.ci-policy.outputs.test-base-revision }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Resolve CI target policy
        id: ci-policy
        run: python3 scripts/ci_target_policy.py >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.9.21"
          enable-cache: false

      - name: Verify lockfile is up to date
        run: uv lock --check

      - name: Lint with ruff
        run: uvx ruff check

      - name: Report tool versions
        run: |
          echo "uv: $(uv --version)"
          uv run python --version

  test:
    name: Test (${{ matrix.shard }}) on ${{ matrix.os }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.preflight.outputs.os-matrix) }}
        shard: [execution, recipe, general]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.9.21"

      - name: Install go-task
        uses: arduino/setup-task@24c5e13bce349197642746563945fcdf9355e8f4 # v2
        with:
          version: "3.43.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show environment
        run: |
          echo "OS: ${{ matrix.os }}"
          echo "uv: $(uv --version)"
          echo "task: $(task --version)"
          uv run python --version

      - name: Configure git auth for private deps
        run: git config --global url."https://${{ secrets.GH_USER }}:${{ secrets.GH_PAT }}@github.com/TalonT-Org/".insteadOf "https://github.com/TalonT-Org/"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install ripgrep
        shell: bash
        run: |
          if command -v rg >/dev/null 2>&1; then
            rg --version
            exit 0
          fi
          case "$RUNNER_OS" in
            Linux)
              sudo apt-get update
              sudo apt-get install --yes ripgrep
              ;;
            macOS)
              brew install ripgrep
              ;;
            *)
              echo "::error::Unsupported runner OS for ripgrep installation: $RUNNER_OS"
              exit 1
              ;;
          esac
          rg --version

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Generate recipe diagrams
        run: uv run autoskillit recipes render

      - name: Compute test paths
        id: test-paths
        run: |
          # Each declared shard owns its explicit set; ``general`` is the
          # complement. The exhaustive ``case`` below is the single source of
          # truth — adding a new shard requires a new arm here.
          SHARD_EXECUTION_DIRS="tests/execution tests/contracts tests/core tests/exploration tests/planner tests/pipeline tests/migration tests/integration"
          SHARD_RECIPE_DIRS="tests/recipe tests/docs tests/server"
          if find tests/ -maxdepth 1 -name 'test_*.py' -print0 | grep -qz ' '; then
            echo "::error::Test filenames with spaces are not supported by the shard path splitter"
            exit 1
          fi
          ROOT_FILES=$(find tests/ -maxdepth 1 -name 'test_*.py' | sort | tr '\n' ' ')
          ROOT_IGNORES=$(find tests/ -maxdepth 1 -name 'test_*.py' | sort | sed 's|^|--ignore=|' | tr '\n' ' ')
          case "${{ matrix.shard }}" in
            execution)
              echo "PYTEST_TEST_PATHS=${SHARD_EXECUTION_DIRS} ${ROOT_FILES}" >> "$GITHUB_ENV"
              ;;
            recipe)
              echo "PYTEST_TEST_PATHS=${SHARD_RECIPE_DIRS}" >> "$GITHUB_ENV"
              ;;
            general)
              EXEC_IGNORES=""
              for d in $SHARD_EXECUTION_DIRS; do
                EXEC_IGNORES="$EXEC_IGNORES --ignore=$d"
              done
              RECIPE_IGNORES=""
              for d in $SHARD_RECIPE_DIRS; do
                RECIPE_IGNORES="$RECIPE_IGNORES --ignore=$d"
              done
              echo "PYTEST_TEST_PATHS=tests/" >> "$GITHUB_ENV"
              echo "PYTEST_IGNORE_PATHS=${EXEC_IGNORES} ${RECIPE_IGNORES} ${ROOT_IGNORES}" >> "$GITHUB_ENV"
              ;;
            *)
              echo "::error::Unknown test shard: ${{ matrix.shard }}"
              exit 1
              ;;
          esac

      - name: Lint imports
        if: matrix.shard == 'execution'
        run: uv run lint-imports

      - name: Run tests
        env:
          AUTOSKILLIT_FILTER_STATS_FILE: ${{ github.workspace }}/.autoskillit/temp/filter-stats.json
          AUTOSKILLIT_FEATURES__EXPERIMENTAL_ENABLED: "true"
          AUTOSKILLIT_TEST_FILTER: ${{ needs.preflight.outputs.test-filter-mode }}
          AUTOSKILLIT_TEST_BASE_REF: ${{ needs.preflight.outputs.test-base-revision }}
        run: |
          mkdir -p .autoskillit/temp
          task test-check

      - name: Upload filter stats
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: filter-stats-${{ matrix.os }}-${{ matrix.shard }}
          path: .autoskillit/temp/filter-stats.json
          if-no-files-found: ignore
