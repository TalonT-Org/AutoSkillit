name: Tests

on:
  push:
    branches: [main, stable]
  pull_request:
    branches: [main, develop, stable]
  merge_group:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  preflight:
    name: Preflight checks
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    outputs:
      os-matrix: ${{ steps.ci-policy.outputs.os-matrix }}
      test-filter-mode: ${{ steps.ci-policy.outputs.test-filter-mode }}
      test-base-revision: ${{ steps.ci-policy.outputs.test-base-revision }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Resolve CI target policy
        id: ci-policy
        run: python3 scripts/ci_target_policy.py >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.9.21"
          enable-cache: false

      - name: Verify lockfile is up to date
        run: uv lock --check

      - name: Report tool versions
        run: |
          echo "uv: $(uv --version)"
          uv run python --version

  cache_metadata:
    name: Resolve uv cache identity
    runs-on: ubuntu-latest
    outputs:
      python_cache_tag: ${{ steps.cache-identity.outputs.python_cache_tag }}
      api_simulator_rev: ${{ steps.cache-identity.outputs.api_simulator_rev }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Resolve cache identity
        id: cache-identity
        shell: bash
        run: |
          python3 <<'PY' >> "$GITHUB_OUTPUT"
          import re
          import tomllib
          from pathlib import Path

          python_selector = Path(".python-version").read_text(encoding="utf-8").strip()
          if re.fullmatch(r"\d+\.\d+", python_selector) is None:
              raise SystemExit(f"invalid .python-version selector: {python_selector!r}")

          with Path("pyproject.toml").open("rb") as pyproject_file:
              project = tomllib.load(pyproject_file)
          revision = project["tool"]["uv"]["sources"]["api-simulator"]["rev"]
          if not isinstance(revision, str) or re.fullmatch(r"[0-9a-fA-F]{40}", revision) is None:
              raise SystemExit(f"invalid api-simulator revision: {revision!r}")

          print(f"python_cache_tag={python_selector.replace('.', '')}")
          print(f"api_simulator_rev={revision}")
          PY

  cache_prime:
    name: Prime uv cache
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: cache_metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.9.21"
          enable-cache: false

      - name: Resolve uv cache directory
        id: uv-cache-dir
        shell: bash
        run: |
          UV_CACHE_DIR="$(uv cache dir)"
          echo "UV_CACHE_DIR=$UV_CACHE_DIR" >> "$GITHUB_ENV"
          echo "path=$UV_CACHE_DIR" >> "$GITHUB_OUTPUT"

      - name: Restore uv cache
        id: uv-cache-restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.uv-cache-dir.outputs.path }}
          key: uv-${{ runner.os }}-py${{ needs.cache_metadata.outputs.python_cache_tag }}-${{ needs.cache_metadata.outputs.api_simulator_rev }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-py${{ needs.cache_metadata.outputs.python_cache_tag }}-${{ needs.cache_metadata.outputs.api_simulator_rev }}-

      - name: Configure git auth for private deps
        run: git config --global url."https://${{ secrets.GH_USER }}:${{ secrets.GH_PAT }}@github.com/TalonT-Org/".insteadOf "https://github.com/TalonT-Org/"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.98.1"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Prune uv cache
        run: uv cache prune --ci

      - name: Save uv cache
        if: steps.uv-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.uv-cache-dir.outputs.path }}
          key: ${{ steps.uv-cache-restore.outputs.cache-primary-key }}

  test:
    name: Test (${{ matrix.shard }}) on ${{ matrix.os }}
    if: github.event_name != 'schedule'
    needs: [preflight, cache_metadata]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.preflight.outputs.os-matrix) }}
        shard: [execution-channel-b, execution-top-level, execution, recipe, general]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.9.21"
          enable-cache: false

      - name: Resolve uv cache directory
        id: uv-cache-dir
        shell: bash
        run: |
          UV_CACHE_DIR="$(uv cache dir)"
          echo "UV_CACHE_DIR=$UV_CACHE_DIR" >> "$GITHUB_ENV"
          echo "path=$UV_CACHE_DIR" >> "$GITHUB_OUTPUT"

      - name: Restore uv cache
        id: uv-cache-restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.uv-cache-dir.outputs.path }}
          key: uv-${{ runner.os }}-py${{ needs.cache_metadata.outputs.python_cache_tag }}-${{ needs.cache_metadata.outputs.api_simulator_rev }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-py${{ needs.cache_metadata.outputs.python_cache_tag }}-${{ needs.cache_metadata.outputs.api_simulator_rev }}-

      - name: Install go-task
        uses: arduino/setup-task@24c5e13bce349197642746563945fcdf9355e8f4 # v2
        with:
          version: "3.43.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show environment
        run: |
          echo "OS: ${{ matrix.os }}"
          echo "uv: $(uv --version)"
          echo "task: $(task --version)"
          uv run python --version

      - name: Configure git auth for private deps
        run: git config --global url."https://${{ secrets.GH_USER }}:${{ secrets.GH_PAT }}@github.com/TalonT-Org/".insteadOf "https://github.com/TalonT-Org/"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.98.1"

      - name: Install ripgrep
        shell: bash
        env:
          RG_VERSION: "15.2.0"
        run: |
          # Fetched from ripgrep's GitHub Releases and verified against a pinned SHA256 on
          # every runner: apt (azure.archive.ubuntu.com) has stalled this step for 10+
          # minutes (issue #4697) and Homebrew cannot pin a version. RG_VERSION must equal
          # RIPGREP_VERSION in scripts/docker/Dockerfile.
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64)
              RG_TARGET="x86_64-unknown-linux-musl"
              RG_SHA256="33e15bcf1624b25cdd2a55813a47a2f95dbe126268203e76aa6a585d1e7b149c"
              CHECKSUM=(sha256sum)
              ;;
            macOS-ARM64)
              RG_TARGET="aarch64-apple-darwin"
              RG_SHA256="3750b2e93f37e0c692657da574d7019a101c0084da05a790c83fd335bad973e4"
              CHECKSUM=(shasum -a 256)
              ;;
            *)
              echo "::error::Unsupported runner for ripgrep installation: ${RUNNER_OS}-${RUNNER_ARCH}"
              exit 1
              ;;
          esac
          RG_DIR="ripgrep-${RG_VERSION}-${RG_TARGET}"
          curl -fsSL -o "${RG_DIR}.tar.gz" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_DIR}.tar.gz"
          echo "${RG_SHA256}  ${RG_DIR}.tar.gz" | "${CHECKSUM[@]}" -c -
          tar -xzf "${RG_DIR}.tar.gz" "${RG_DIR}/rg"
          RG_BIN_DIR="${RUNNER_TEMP}/ripgrep-${RG_VERSION}"
          mkdir -p "${RG_BIN_DIR}"
          install -m 0755 "${RG_DIR}/rg" "${RG_BIN_DIR}/rg"
          rm -rf "${RG_DIR}.tar.gz" "${RG_DIR}"
          echo "${RG_BIN_DIR}" >> "$GITHUB_PATH"
          "${RG_BIN_DIR}/rg" --version | grep -q "^ripgrep ${RG_VERSION}"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Generate recipe diagrams
        run: uv run autoskillit recipes render

      - name: Compute test paths
        id: test-paths
        run: |
          SHARD_EXECUTION_DIRS="tests/execution tests/contracts tests/core tests/exploration tests/planner tests/pipeline tests/migration tests/integration tests/smoke_utils"
          SHARD_RECIPE_DIRS="tests/recipe tests/docs tests/server"
          CHANNEL_B_FILE="tests/execution/test_process_channel_b.py"
          while IFS= read -r -d '' test_file; do
            if [[ "$test_file" =~ [[:space:]] || "$test_file" =~ [*?\[] ]]; then
              echo "::error::Unsafe test filename for the shard path splitter: $test_file"
              exit 1
            fi
          done < <(
            find tests/ -maxdepth 1 -type f -name 'test_*.py' -print0
            find tests/execution -maxdepth 1 -type f -name 'test_*.py' -print0
          )
          ROOT_FILES=$(find tests/ -maxdepth 1 -type f -name 'test_*.py' | sort | tr '\n' ' ')
          ROOT_IGNORES=$(find tests/ -maxdepth 1 -type f -name 'test_*.py' | sort | sed 's|^|--ignore=|' | tr '\n' ' ')
          DIRECT_EXECUTION_FILES=$(find tests/execution -maxdepth 1 -type f -name 'test_*.py' ! -path "$CHANNEL_B_FILE" | sort | tr '\n' ' ')
          DIRECT_EXECUTION_IGNORES=$(find tests/execution -maxdepth 1 -type f -name 'test_*.py' | sort | sed 's|^|--ignore=|' | tr '\n' ' ')
          case "${{ matrix.shard }}" in
            execution-channel-b)
              echo "PYTEST_TEST_PATHS=${CHANNEL_B_FILE}" >> "$GITHUB_ENV"
              ;;
            execution-top-level)
              echo "PYTEST_TEST_PATHS=${DIRECT_EXECUTION_FILES}" >> "$GITHUB_ENV"
              ;;
            execution)
              echo "PYTEST_TEST_PATHS=${SHARD_EXECUTION_DIRS} ${ROOT_FILES}" >> "$GITHUB_ENV"
              echo "PYTEST_IGNORE_PATHS=${DIRECT_EXECUTION_IGNORES}" >> "$GITHUB_ENV"
              ;;
            recipe)
              echo "PYTEST_TEST_PATHS=${SHARD_RECIPE_DIRS}" >> "$GITHUB_ENV"
              ;;
            general)
              EXEC_IGNORES=""
              for d in $SHARD_EXECUTION_DIRS; do
                EXEC_IGNORES="$EXEC_IGNORES --ignore=$d"
              done
              RECIPE_IGNORES=""
              for d in $SHARD_RECIPE_DIRS; do
                RECIPE_IGNORES="$RECIPE_IGNORES --ignore=$d"
              done
              echo "PYTEST_TEST_PATHS=tests/" >> "$GITHUB_ENV"
              echo "PYTEST_IGNORE_PATHS=${EXEC_IGNORES} ${RECIPE_IGNORES} ${ROOT_IGNORES}" >> "$GITHUB_ENV"
              ;;
            *)
              echo "::error::Unknown test shard: ${{ matrix.shard }}"
              exit 1
              ;;
          esac

      - name: Lint imports
        if: matrix.shard == 'execution'
        run: uv run lint-imports

      - name: Lint with ruff
        if: matrix.shard == 'execution'
        run: task lint

      - name: Type check
        if: matrix.shard == 'execution'
        run: task typecheck

      - name: Run tests
        env:
          AUTOSKILLIT_FILTER_STATS_FILE: ${{ github.workspace }}/.autoskillit/temp/filter-stats.json
          AUTOSKILLIT_FEATURES__EXPERIMENTAL_ENABLED: "true"
          AUTOSKILLIT_TEST_FILTER: ${{ needs.preflight.outputs.test-filter-mode }}
          AUTOSKILLIT_TEST_BASE_REF: ${{ needs.preflight.outputs.test-base-revision }}
        run: |
          mkdir -p .autoskillit/temp
          if [[ "${{ matrix.shard }}" == "execution-channel-b" ]]; then
            export AUTOSKILLIT_TEST_FILTER=none
          fi
          set +e
          task test-check 2>&1 | tee .autoskillit/temp/test-check.log
          TEST_CHECK_EXIT="${PIPESTATUS[0]}"
          set -e
          if [[ "$TEST_CHECK_EXIT" -ne 0 ]] \
            && [[ "$AUTOSKILLIT_TEST_FILTER" == "conservative" ]] \
            && rg -q '^PYTEST_EXIT_CODE=5$' .autoskillit/temp/test-check.log; then
            echo "No tests selected for this shard after conservative filtering"
            exit 0
          fi
          exit "$TEST_CHECK_EXIT"

      - name: Policy relaxation gate
        if: matrix.shard == 'general' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
        env:
          BASE_REVISION: ${{ needs.preflight.outputs.test-base-revision }}
        run: |
          base="${BASE_REVISION:?preflight must emit test-base-revision for PR and merge-group events}"
          git cat-file -e "${base}^{commit}" || {
            echo "::error::base revision ${base} is not reachable in this checkout (fetch-depth must stay 0)"
            exit 1
          }
          git merge-base --is-ancestor "${base}" HEAD || {
            echo "::error::preflight base revision ${base} must be an ancestor of HEAD"
            exit 1
          }
          if git cat-file -e "${base}:scripts/check_policy_relaxation.py" 2>/dev/null; then
            git show "${base}:scripts/check_policy_relaxation.py" > "${RUNNER_TEMP}/check_policy_relaxation.py"
            if git cat-file -e "${base}:scripts/_git_plumbing.py" 2>/dev/null; then
              git show "${base}:scripts/_git_plumbing.py" > "${RUNNER_TEMP}/_git_plumbing.py"
            fi
            uv run python "${RUNNER_TEMP}/check_policy_relaxation.py" --base "${base}" --repo-root "${GITHUB_WORKSPACE}"
          else
            echo "::notice::checker absent at ${base} (bootstrap); running the working-tree copy"
            uv run python scripts/check_policy_relaxation.py --base "${base}"
          fi

      - name: Cyclomatic complexity gate
        if: matrix.shard == 'general' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
        env:
          BASE_REVISION: ${{ needs.preflight.outputs.test-base-revision }}
        run: |
          base="${BASE_REVISION:?preflight must emit test-base-revision for PR and merge-group events}"
          git cat-file -e "${base}^{commit}" || {
            echo "::error::base revision ${base} is not reachable in this checkout (fetch-depth must stay 0)"
            exit 1
          }
          git merge-base --is-ancestor "${base}" HEAD || {
            echo "::error::preflight base revision ${base} must be an ancestor of HEAD"
            exit 1
          }
          if git cat-file -e "${base}:scripts/check_complexity.py" 2>/dev/null; then
            git show "${base}:scripts/check_complexity.py" > "${RUNNER_TEMP}/check_complexity.py"
            if git cat-file -e "${base}:scripts/_git_plumbing.py" 2>/dev/null; then
              git show "${base}:scripts/_git_plumbing.py" > "${RUNNER_TEMP}/_git_plumbing.py"
            fi
            uv run python "${RUNNER_TEMP}/check_complexity.py" --base "${base}" --repo-root "${GITHUB_WORKSPACE}"
          else
            echo "::notice::checker absent at ${base} (bootstrap); running the working-tree copy"
            uv run python scripts/check_complexity.py --base "${base}"
          fi

      - name: Upload filter stats
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: filter-stats-${{ matrix.os }}-${{ matrix.shard }}
          path: .autoskillit/temp/filter-stats.json
          if-no-files-found: ignore
