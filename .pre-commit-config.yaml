repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types: [python]

      - id: ruff
        name: ruff
        entry: ruff check --fix
        language: system
        types: [python]

      - id: mypy
        name: mypy
        entry: mypy src/ tests/_test_filter.py --ignore-missing-imports
        language: system
        pass_filenames: false

      - id: uv-lock-check
        name: uv lock --check
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false

      - id: no-generated-configs
        name: Block generated config files from being committed
        entry: "Machine-generated file — must not be committed. Run 'autoskillit install' to regenerate."
        language: fail
        files: '(src/autoskillit/hooks/hooks\.json|\.claude/settings\.json|src/autoskillit/recipes/contracts/)'

      - id: doc-counts
        name: doc count accuracy
        entry: python scripts/check_doc_counts.py
        language: system
        files: ^(docs/|README\.md|src/autoskillit/skills/|src/autoskillit/recipes/|src/autoskillit/core/_type_constants\.py)
        pass_filenames: false

      - id: check-version-consistency
        name: Check version consistency across artifacts
        language: system
        entry: python scripts/sync_versions.py --check
        files: '(pyproject\.toml|plugin\.json|recipes/.*\.yaml)$'
        pass_filenames: false

      - id: check-tool-annotations
        name: Check MCP tool readOnlyHint annotations
        language: system
        entry: python scripts/check_tool_annotations.py
        files: ^src/autoskillit/server/tools_
        pass_filenames: false

      - id: check-sub-claude-md
        name: Check sub-CLAUDE.md file table completeness
        language: system
        entry: python scripts/check_sub_claude_md.py
        files: ^(tests/|src/autoskillit/).*(\.py|CLAUDE\.md)$
        pass_filenames: false

      - id: check-contract-freshness
        name: Check contract card freshness
        language: system
        entry: uv run python3 scripts/check_contract_freshness.py
        files: ^src/autoskillit/recipes/(?!contracts/).*\.yaml$
        pass_filenames: false

      - id: check-pyi-stub-format
        name: Check __init__.pyi stub format
        language: system
        entry: python scripts/check_pyi_stub_format.py
        files: __init__\.pyi$
        pass_filenames: false

      - id: check-pyi-stub-symbols
        name: Check __init__.pyi stub symbol completeness
        language: system
        entry: python scripts/check_pyi_stub_symbols.py
        files: __init__\.pyi$
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
