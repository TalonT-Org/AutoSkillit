version: '3'

set: ['pipefail']

vars:
  PYTEST_TMPDIR: '{{if eq OS "linux"}}/dev/shm/pytest-tmp-{{else}}/tmp/pytest-tmp-{{end}}{{ substr 0 8 (sha256sum .ROOT_DIR) }}'
  PYTEST_CACHEDIR: '{{if eq OS "linux"}}/dev/shm/pytest-cache-{{else}}/tmp/pytest-cache-{{end}}{{ substr 0 8 (sha256sum .ROOT_DIR) }}'

tasks:
  _tmpdir-setup:
    internal: true
    desc: Wipe and recreate pytest tmpdir so each run starts clean (platform-aware)
    cmds:
      - rm -rf {{.PYTEST_TMPDIR}}
      - mkdir -p {{.PYTEST_TMPDIR}} {{.PYTEST_CACHEDIR}}

  test-all:
    desc: Run all tests with parallel workers
    deps: [install-worktree, _tmpdir-setup]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OMP_NUM_THREADS: "1"
      TMPDIR: "{{.PYTEST_TMPDIR}}"
      AUTOSKILLIT_FEATURES__EXPERIMENTAL_ENABLED: "true"
    cmds:
      - |
        mkdir -p temp
        TEST_OUTPUT="temp/test-$(date +%Y-%m-%d_%H%M%S).txt"
        echo "Running all tests with -n 4"
        echo "Output: $TEST_OUTPUT"

        if [[ -d ".venv" ]]; then
          .venv/bin/lint-imports
          PYTEST_CMD=".venv/bin/python -m pytest"
        else
          lint-imports
          PYTEST_CMD="pytest"
        fi

        set -o pipefail
        set +e
        $PYTEST_CMD ${PYTEST_TEST_PATHS:-tests/} -q --tb=short -n 4 --dist worksteal -m "not smoke and not canary" ${PYTEST_IGNORE_PATHS:-} --disable-warnings -o "addopts=" --basetemp={{.PYTEST_TMPDIR}} -o "cache_dir={{.PYTEST_CACHEDIR}}" 2>&1 | tee "$TEST_OUTPUT"
        PYTEST_EXIT=$?
        set +o pipefail
        set -e

        echo ""
        echo "Test output saved to: $TEST_OUTPUT"
        exit $PYTEST_EXIT

  test-check:
    desc: Run all tests and return unambiguous PASS/FAIL (for automation)
    deps: [install-worktree, _tmpdir-setup]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OMP_NUM_THREADS: "1"
      TMPDIR: "{{.PYTEST_TMPDIR}}"
      AUTOSKILLIT_FEATURES__EXPERIMENTAL_ENABLED: "true"
    cmds:
      - |
        mkdir -p temp
        TEST_OUTPUT="temp/test-$(date +%Y-%m-%d_%H%M%S).txt"

        if [[ -d ".venv" ]]; then
          PYTEST_CMD=".venv/bin/python -m pytest"
        else
          PYTEST_CMD="pytest"
        fi

        set -o pipefail
        set +e
        $PYTEST_CMD ${PYTEST_TEST_PATHS:-tests/} -q --tb=short -n 4 --dist worksteal -m "not smoke and not canary" ${PYTEST_IGNORE_PATHS:-} --disable-warnings -o "addopts=" --basetemp={{.PYTEST_TMPDIR}} -o "cache_dir={{.PYTEST_CACHEDIR}}" 2>&1 | tee "$TEST_OUTPUT"
        PYTEST_EXIT=$?
        set +o pipefail
        set -e

        echo ""
        echo "Test output saved to: $TEST_OUTPUT"

        if [ "$PYTEST_EXIT" -ne 0 ]; then
          echo ""
          echo "TEST_RESULT=FAIL"
          echo "PYTEST_EXIT_CODE=$PYTEST_EXIT"
          exit 1
        else
          echo ""
          echo "TEST_RESULT=PASS"
          exit 0
        fi

  test-filtered:
    desc: Run path-filtered tests (delegates to test-check with filter env passthrough)
    cmds:
      - |
        export AUTOSKILLIT_TEST_FILTER="${AUTOSKILLIT_TEST_FILTER:-conservative}"
        task test-check

  test-local:
    desc: Run aggressively filtered tests for local development
    cmds:
      - |
        export AUTOSKILLIT_TEST_FILTER="${AUTOSKILLIT_TEST_FILTER:-aggressive}"
        task test-check

  test-codex-config-parse:
    desc: Validate generated interactive config overrides with the installed Codex CLI
    cmds:
      - |
        PYTEST_TEST_PATHS="tests/execution/backends/test_codex_interactive.py" task test-all

  coverage-audit:
    desc: "Run pytest with coverage collection and compare against AST-derived function map"
    deps: [install-worktree, _tmpdir-setup]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OMP_NUM_THREADS: "1"
      TMPDIR: "{{.PYTEST_TMPDIR}}"
    cmds:
      - |
        mkdir -p temp

        if [[ -d ".venv" ]]; then
          PYTEST_CMD=".venv/bin/python -m pytest"
          PYTHON=".venv/bin/python"
        else
          PYTEST_CMD="pytest"
          PYTHON="python"
        fi

        set +e
        $PYTEST_CMD tests/ -q --tb=short \
          -n 4 --dist worksteal \
          -m "not smoke and not canary" \
          --disable-warnings \
          -o "addopts=" \
          --basetemp="{{.PYTEST_TMPDIR}}" \
          -o "cache_dir={{.PYTEST_CACHEDIR}}" \
          --cov=src/autoskillit \
          --cov-context=test \
          --cov-branch \
          --cov-report=term-missing:skip-covered \
          --cov-report=
        set -e

        echo ""
        echo "--- Coverage AST Comparison ---"
        $PYTHON scripts/compare-coverage-ast.py \
          --coverage-db .coverage \
          --output "temp/coverage-audit-$(date +%Y%m%d-%H%M%S).json"

        echo ""
        echo "--- Building test-source map ---"
        $PYTHON scripts/compare-coverage-ast.py \
          --mode build-test-source-map \
          --coverage-db .coverage \
          --output ".autoskillit/test-source-map.json"

  test-smoke:
    desc: Run smoke tests (requires ANTHROPIC_API_KEY)
    deps: [_tmpdir-setup]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OMP_NUM_THREADS: "1"
      SMOKE_TEST: "1"
      TMPDIR: "{{.PYTEST_TMPDIR}}"
    cmds:
      - |
        mkdir -p temp
        TEST_OUTPUT="temp/smoke-$(date +%Y-%m-%d_%H%M%S).txt"
        echo "Running smoke tests"
        echo "Output: $TEST_OUTPUT"

        if [[ -d ".venv" ]]; then
          PYTEST_CMD=".venv/bin/python -m pytest"
        else
          PYTEST_CMD="pytest"
        fi

        set -o pipefail
        set +e
        $PYTEST_CMD tests/server/test_smoke_pipeline.py -m smoke -v --tb=short -o "addopts=" --basetemp={{.PYTEST_TMPDIR}} -o "cache_dir={{.PYTEST_CACHEDIR}}" 2>&1 | tee "$TEST_OUTPUT"
        PYTEST_EXIT=$?
        set +o pipefail
        set -e

        echo ""
        echo "Smoke test output saved to: $TEST_OUTPUT"
        exit $PYTEST_EXIT

  test-smoke-research:
    desc: Run research recipe smoke tests (requires ANTHROPIC_API_KEY)
    deps: [_tmpdir-setup]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OMP_NUM_THREADS: "1"
      RESEARCH_SMOKE_TEST: "1"
      TMPDIR: "{{.PYTEST_TMPDIR}}"
    preconditions:
      - sh: test -n "$ANTHROPIC_API_KEY"
        msg: "ANTHROPIC_API_KEY must be set"
    cmds:
      - |
        mkdir -p temp
        TEST_OUTPUT="temp/smoke-research-$(date +%Y-%m-%d_%H%M%S).txt"
        echo "Running research smoke tests"
        echo "Output: $TEST_OUTPUT"

        if [[ -d ".venv" ]]; then
          PYTEST_CMD=".venv/bin/python -m pytest"
        else
          PYTEST_CMD="pytest"
        fi

        set -o pipefail
        set +e
        $PYTEST_CMD tests/server/test_research_smoke_pipeline.py -m smoke -v --tb=short -o "addopts=" --basetemp={{.PYTEST_TMPDIR}} -o "cache_dir={{.PYTEST_CACHEDIR}}" 2>&1 | tee "$TEST_OUTPUT"
        PYTEST_EXIT=$?
        set +o pipefail
        set -e

        echo ""
        echo "Research smoke test output saved to: $TEST_OUTPUT"
        exit $PYTEST_EXIT

  test-smoke-codex:
    desc: Run Codex CLI smoke tests (requires Codex authentication)
    deps: [_tmpdir-setup]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OMP_NUM_THREADS: "1"
      CODEX_SMOKE_TEST: "1"
      TMPDIR: "{{.PYTEST_TMPDIR}}"
    preconditions:
      - sh: test -n "$OPENAI_API_KEY" || test -n "$CODEX_API_KEY" || test -f "$HOME/.codex/auth.json"
        msg: "Codex authentication required: set OPENAI_API_KEY or CODEX_API_KEY, or run 'codex login'"
    cmds:
      - |
        mkdir -p .autoskillit/temp
        TEST_OUTPUT=".autoskillit/temp/smoke-codex-$(date +%Y-%m-%d_%H%M%S).txt"
        echo "Running Codex smoke tests"
        echo "Output: $TEST_OUTPUT"

        if [[ -d ".venv" ]]; then
          PYTEST_CMD=".venv/bin/python -m pytest"
        else
          PYTEST_CMD="pytest"
        fi

        set -o pipefail
        set +e
        $PYTEST_CMD tests/execution/test_smoke_codex.py tests/execution/backends/test_cli_conformance_probes.py tests/execution/backends/test_codex_recipe_delivery_conformance.py -m smoke -v --tb=short -o "addopts=" --basetemp={{.PYTEST_TMPDIR}} -o "cache_dir={{.PYTEST_CACHEDIR}}" 2>&1 | tee "$TEST_OUTPUT"
        PYTEST_EXIT=$?
        set +o pipefail
        set -e

        echo ""
        echo "Codex smoke test output saved to: $TEST_OUTPUT"
        exit $PYTEST_EXIT

  test-smoke-codex-explorer-gate:
    desc: Run the non-skippable Luna/max explorer child capability gate
    deps: [_tmpdir-setup]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OMP_NUM_THREADS: "1"
      CODEX_SMOKE_TEST: "1"
      TMPDIR: "{{.PYTEST_TMPDIR}}"
    preconditions:
      - sh: command -v codex >/dev/null 2>&1
        msg: "Codex CLI must be installed"
      - sh: test -n "$OPENAI_API_KEY" || test -n "$CODEX_API_KEY" || test -f "$HOME/.codex/auth.json"
        msg: "Codex authentication required: set OPENAI_API_KEY or CODEX_API_KEY, or run 'codex login'"
    cmds:
      - |
        mkdir -p .autoskillit/temp/conformance
        TEST_OUTPUT=".autoskillit/temp/explorer-gate-$(date +%Y-%m-%d_%H%M%S).txt"
        ATTESTATION_DIR=".autoskillit/temp/conformance/$(date +%Y-%m-%d_%H%M%S)-$$"
        mkdir -p "$ATTESTATION_DIR"

        if [[ -d ".venv" ]]; then
          PYTHON_CMD=".venv/bin/python"
        else
          PYTHON_CMD="python"
        fi
        PYTEST_CMD="$PYTHON_CMD -m pytest"

        set -o pipefail
        set +e
        AUTOSKILLIT_EXPLORER_ATTESTATION_DIR="$ATTESTATION_DIR" \
          $PYTEST_CMD tests/execution/backends/test_cli_conformance_probes.py \
          -m smoke -k generated_codex_child_luna_max_sandbox_conformance \
          -v --tb=short -o "addopts=" --basetemp={{.PYTEST_TMPDIR}} \
          -o "cache_dir={{.PYTEST_CACHEDIR}}" 2>&1 | tee "$TEST_OUTPUT"
        PYTEST_EXIT=$?
        set +o pipefail
        set -e

        if [[ $PYTEST_EXIT -eq 0 ]] && ! grep -Eq '(^| )1 passed' "$TEST_OUTPUT"; then
          echo "Explorer gate did not produce one non-skipped pass"
          PYTEST_EXIT=1
        fi
        if [[ $PYTEST_EXIT -eq 0 ]] && { [[ ! -s "$ATTESTATION_DIR/codex-explorer-conformance-v6.json" ]] || [[ ! -s "$ATTESTATION_DIR/codex-explorer-conformance-v6.json.sha256" ]]; }; then
          echo "Explorer gate did not publish its attestation and digest sidecar"
          PYTEST_EXIT=1
        fi
        if [[ $PYTEST_EXIT -eq 0 ]]; then
          "$PYTHON_CMD" -c '
        import subprocess
        import sys
        from pathlib import Path
        from autoskillit.execution.backends._explorer_conformance import (
            project_codex_luna_catalog,
            validate_published_explorer_release_readiness,
        )
        attestation = validate_published_explorer_release_readiness(Path(sys.argv[1]))
        cli_version = subprocess.run(
            ["codex", "--version"], capture_output=True, check=True, text=True
        ).stdout.strip()
        if cli_version != f"codex-cli {attestation.cli_version}":
            raise ValueError("published explorer attestation CLI version does not match Codex")
        catalog = subprocess.run(
            ["codex", "debug", "models", "--bundled"], capture_output=True, check=True
        ).stdout
        if attestation.model_catalog_digest != project_codex_luna_catalog(catalog).projected_sha256:
            raise ValueError("published explorer attestation catalog does not match Codex")
        ' "$ATTESTATION_DIR/codex-explorer-conformance-v6.json" || PYTEST_EXIT=1
        fi
        echo "Codex explorer gate output saved to: $TEST_OUTPUT"
        exit $PYTEST_EXIT

  test-smoke-codex-explorer-live-gate:
    desc: Run the uncached, authenticated production AutoSkillit MCP explorer gate
    deps: [_tmpdir-setup]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OMP_NUM_THREADS: "1"
      CODEX_SMOKE_TEST: "1"
      AUTOSKILLIT_EXPLORER_LIVE_GATE: "1"
      TMPDIR: "{{.PYTEST_TMPDIR}}"
    preconditions:
      - sh: command -v codex >/dev/null 2>&1
        msg: "Codex CLI must be installed"
      - sh: test -n "$OPENAI_API_KEY" || test -n "$CODEX_API_KEY" || test -f "$HOME/.codex/auth.json"
        msg: "Codex authentication required: set OPENAI_API_KEY or CODEX_API_KEY, or run 'codex login'"
    cmds:
      - |
        if [[ -d ".venv" ]]; then
          PYTHON_CMD=".venv/bin/python"
        else
          PYTHON_CMD="python"
        fi
        ARTIFACT_DIR=".autoskillit/temp/conformance/live-explorer-gate"
        EVIDENCE="$ARTIFACT_DIR/live-explorer-gate.json"
        TEST_OUTPUT="$ARTIFACT_DIR/pytest-output.txt"
        JUNIT_REPORT="$ARTIFACT_DIR/pytest-report.xml"
        mkdir -p "$ARTIFACT_DIR"
        rm -f "$EVIDENCE" "$TEST_OUTPUT" "$JUNIT_REPORT"
        export AUTOSKILLIT_EXPLORER_LIVE_GATE_ARTIFACT_DIR="$ARTIFACT_DIR"
        set +e
        $PYTHON_CMD -m pytest tests/execution/backends/test_explorer_live_gate.py \
          -q --tb=short -m smoke -p no:cacheprovider -o "addopts=" \
          --basetemp={{.PYTEST_TMPDIR}} -o "cache_dir={{.PYTEST_CACHEDIR}}" \
          --junitxml="$JUNIT_REPORT" >"$TEST_OUTPUT" 2>&1
        PYTEST_EXIT=$?
        set -e
        tail -c 16000 "$TEST_OUTPUT"
        if [[ $PYTEST_EXIT -ne 0 ]]; then
          echo "Live explorer gate failed; bounded output is saved to: $TEST_OUTPUT"
          exit $PYTEST_EXIT
        fi
        $PYTHON_CMD -c 'import sys, xml.etree.ElementTree as E; cases=list(E.parse(sys.argv[1]).getroot().iter("testcase")); skipped=sum(bool(case.findall("skipped")) for case in cases); bad=len(cases) != 1 or skipped; sys.exit(f"live explorer gate requires exactly one non-skipped test, got tests={len(cases)} skipped={skipped}" if bad else 0)' "$JUNIT_REPORT"
        if [[ ! -s "$EVIDENCE" ]]; then
          echo "Live explorer gate did not publish fresh evidence: $EVIDENCE"
          exit 1
        fi
        $PYTHON_CMD -c 'import json, sys; data=json.load(open(sys.argv[1], encoding="utf-8")); expected={"contract":"live-production-shared-explorer-principal-v2","principal_role":"shared-explorer-session","authenticated_resume":"denied"}; bad=any(data.get(key) != value for key, value in expected.items()); sys.exit(f"invalid live explorer evidence: {data!r}" if bad else 0)' "$EVIDENCE"

  test-smoke-claude-explorer-live-gate:
    desc: Run the Claude session-scoped explorer conformance gate
    deps: [_tmpdir-setup]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OMP_NUM_THREADS: "1"
      AUTOSKILLIT_CLAUDE_EXPLORER_LIVE_GATE: "1"
      TMPDIR: "{{.PYTEST_TMPDIR}}"
    cmds:
      - |
        if [[ -d ".venv" ]]; then
          PYTHON_CMD=".venv/bin/python"
        else
          PYTHON_CMD="python"
        fi
        set +e
        $PYTHON_CMD -m pytest tests/server/test_claude_explorer_live_gate.py \
          -q --tb=short -m smoke -p no:cacheprovider -o "addopts=" \
          --basetemp={{.PYTEST_TMPDIR}} -o "cache_dir={{.PYTEST_CACHEDIR}}" 2>&1
        PYTEST_EXIT=$?
        set -e
        exit $PYTEST_EXIT

  test-smoke-claude-startup:
    desc: Run the exact interactive Claude startup-readiness trace
    deps: [_tmpdir-setup]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OMP_NUM_THREADS: "1"
      CLAUDE_CODE_SMOKE_TEST: "1"
      CLAUDE_STARTUP_READINESS_SMOKE: "1"
      TMPDIR: "{{.PYTEST_TMPDIR}}"
    preconditions:
      - sh: command -v claude >/dev/null 2>&1
        msg: "Claude Code CLI must be installed"
      - sh: test -n "$ANTHROPIC_API_KEY" || test -n "$CLAUDE_CODE_OAUTH_TOKEN"
        msg: "Isolated Claude authentication required: set ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN"
    cmds:
      - |
        mkdir -p .autoskillit/temp
        TEST_OUTPUT=".autoskillit/temp/smoke-claude-startup-$(date +%Y-%m-%d_%H%M%S).txt"
        echo "Running Claude startup-readiness smoke tests"
        echo "Output: $TEST_OUTPUT"

        if [[ -d ".venv" ]]; then
          PYTEST_CMD=".venv/bin/python -m pytest"
        else
          PYTEST_CMD="pytest"
        fi

        set -o pipefail
        set +e
        $PYTEST_CMD tests/execution/backends/test_cli_conformance_probes.py \
          -m smoke -k "${CLAUDE_STARTUP_K:-claude_startup_readiness}" \
          -v --tb=short -o "addopts=" \
          --basetemp={{.PYTEST_TMPDIR}} -o "cache_dir={{.PYTEST_CACHEDIR}}" \
          2>&1 | tee "$TEST_OUTPUT"
        PYTEST_EXIT=$?
        set +o pipefail
        set -e

        echo ""
        echo "Claude startup-readiness output saved to: $TEST_OUTPUT"
        exit $PYTEST_EXIT

  test-smoke-output-budget-e2e:
    desc: Run the credentialed deep-investigate output-budget probe for selected backends
    deps: [_tmpdir-setup]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OMP_NUM_THREADS: "1"
      TMPDIR: "{{.PYTEST_TMPDIR}}"
    preconditions:
      - sh: test "$CODEX_SMOKE_TEST" = "1" || test "$CLAUDE_CODE_SMOKE_TEST" = "1"
        msg: "Set CODEX_SMOKE_TEST=1 or CLAUDE_CODE_SMOKE_TEST=1"
      - sh: test "$CODEX_SMOKE_TEST" != "1" || test -n "$OPENAI_API_KEY" || test -n "$CODEX_API_KEY" || test -f "$HOME/.codex/auth.json"
        msg: "Codex authentication required"
      - sh: test "$CLAUDE_CODE_SMOKE_TEST" != "1" || test -n "$ANTHROPIC_API_KEY" || test -n "$CLAUDE_CODE_OAUTH_TOKEN" || test -f "$HOME/.claude/.credentials.json"
        msg: "Claude authentication required"
    cmds:
      - |
        mkdir -p .autoskillit/temp
        BACKEND_LABEL="codex"
        if [ "$CLAUDE_CODE_SMOKE_TEST" = "1" ]; then
          BACKEND_LABEL="claude"
        fi
        if [ "$CODEX_SMOKE_TEST" = "1" ] && [ "$CLAUDE_CODE_SMOKE_TEST" = "1" ]; then
          BACKEND_LABEL="all"
        fi
        TEST_OUTPUT=".autoskillit/temp/smoke-output-budget-e2e-${BACKEND_LABEL}-$(date +%Y-%m-%d_%H%M%S).txt"
        echo "Running deep-investigate output-budget smoke tests"
        echo "Output: $TEST_OUTPUT"

        if [[ -d ".venv" ]]; then
          PYTEST_CMD=".venv/bin/python -m pytest"
        else
          PYTEST_CMD="pytest"
        fi

        set -o pipefail
        set +e
        $PYTEST_CMD tests/server/test_output_budget_e2e.py -m smoke -v --tb=short -o "addopts=" --basetemp={{.PYTEST_TMPDIR}} -o "cache_dir={{.PYTEST_CACHEDIR}}" 2>&1 | tee "$TEST_OUTPUT"
        PYTEST_EXIT=$?
        set +o pipefail
        set -e

        echo ""
        echo "Output-budget smoke test output saved to: $TEST_OUTPUT"
        exit $PYTEST_EXIT

  test-smoke-record:
    desc: Record smoke test scenario by running autoskillit order with recording enabled
    env:
      RECORD_SCENARIO: "1"
      RECORD_SCENARIO_DIR: '{{.RECORD_SCENARIO_DIR | default "tests/fixtures/scenarios/smoke-happy"}}'
      RECORD_SCENARIO_RECIPE: "smoke-test"
    cmds:
      - |
        mkdir -p "$RECORD_SCENARIO_DIR"
        echo "Recording smoke-test scenario"
        echo "  RECORD_SCENARIO_DIR=$RECORD_SCENARIO_DIR"
        echo ""
        autoskillit order smoke-test

  check-docs:
    desc: Verify documentation counts match source code
    cmds:
      - python scripts/check_doc_counts.py

  sync-versions:
    desc: Sync all version-bearing files from pyproject.toml
    cmds:
      - python scripts/sync_versions.py

  sync-hooks-hash:
    desc: "Regenerate src/autoskillit/hooks/registry.sha256 from the live HOOK_REGISTRY"
    cmds:
      - uv run python -c "from autoskillit.hook_registry import HOOK_REGISTRY_HASH, HOOKS_DIR; (HOOKS_DIR / 'registry.sha256').write_text(HOOK_REGISTRY_HASH + '\n')"

  refresh-codex-hook-fixture:
    desc: Regenerate the deterministic Codex hook-event snapshot
    cmds:
      - uv run pytest --update-fixtures -n0 tests/execution/backends/test_codex_deterministic_conformance.py -k test_update_fixtures_writes_snapshot

  regen-contracts:
    desc: Regenerate all bundled recipe contract cards
    status:
      - uv run python scripts/check_contract_freshness.py
    cmds:
      - uv run python scripts/regen_contracts.py

  compile-recipes:
    desc: Pre-compile bundled recipe YAML files to JSON
    deps: [regen-contracts]
    status:
      - uv run python scripts/compile_recipes.py --check
    cmds:
      - uv run python scripts/compile_recipes.py

  install-worktree:
    desc: Set up development environment (isolated venv in worktrees, direct install in main)
    deps: [compile-recipes]
    status:
      - test -x .venv/bin/python
      - uv sync --check --all-extras 2>/dev/null
    cmds:
      - |
        # Detect if we're in a git worktree (worktrees have .git as a file, not a directory)
        if [[ -f ".git" ]]; then
          echo "Worktree detected — creating isolated venv"
          uv venv --clear .venv
          uv sync --frozen --all-extras
        elif [[ -d ".venv" ]]; then
          echo "Main directory — installing into existing venv"
          uv sync --frozen --all-extras
        else
          echo "Main directory — creating venv and installing"
          uv venv --clear .venv
          uv sync --frozen --all-extras
        fi
        echo "Done: $(.venv/bin/python --version)"
        if command -v pre-commit >/dev/null 2>&1; then
          pre-commit install --install-hooks 2>/dev/null || true
        fi

  install-dev:
    desc: Install dev version of autoskillit from the develop branch
    cmds:
      - uv tool install --force "autoskillit[dev] @ git+https://github.com/TalonT-Org/AutoSkillit.git@develop"
      - "$(uv tool dir)/autoskillit/bin/autoskillit install"

  vendor-mermaid:
    desc: Download latest mermaid v11 UMD bundle to src/autoskillit/assets/mermaid/
    cmds:
      - mkdir -p src/autoskillit/assets/mermaid
      - |
        VERSION=$(curl -sfL https://unpkg.com/mermaid@11/package.json \
          | python3 -c "import sys, json; print(json.load(sys.stdin)['version'])")
        echo "Fetching mermaid ${VERSION}..."
        curl -sfL "https://unpkg.com/mermaid@${VERSION}/dist/mermaid.min.js" \
          -o src/autoskillit/assets/mermaid/mermaid.min.js
        echo "${VERSION}" > src/autoskillit/assets/mermaid/VERSION
        echo "Vendored mermaid ${VERSION} ($(wc -c < src/autoskillit/assets/mermaid/mermaid.min.js) bytes)"

  testmon-build:
    desc: Build .testmondata DB by running full suite with testmon (serial, no xdist)
    deps: [install-worktree, _tmpdir-setup]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OMP_NUM_THREADS: "1"
      TMPDIR: "{{.PYTEST_TMPDIR}}"
      AUTOSKILLIT_TEST_FILTER: "none"
    cmds:
      - |
        mkdir -p temp
        echo "Building .testmondata (serial run — this will take a while)"
        if [[ -d ".venv" ]]; then
          PYTEST_CMD=".venv/bin/python -m pytest"
        else
          PYTEST_CMD="pytest"
        fi

        set -o pipefail
        set +e
        $PYTEST_CMD tests/ -q --tb=short --testmon \
          -m "not smoke and not canary" \
          --disable-warnings -o "addopts=" \
          --basetemp={{.PYTEST_TMPDIR}} \
          -o "cache_dir={{.PYTEST_CACHEDIR}}" \
          2>&1 | tee "temp/testmon-build-$(date +%Y-%m-%d_%H%M%S).txt"
        PYTEST_EXIT=$?
        set +o pipefail
        set -e

        if [ -f ".testmondata" ]; then
          SIZE=$(du -h .testmondata | cut -f1)
          echo ""
          echo ".testmondata built successfully: $SIZE"
        else
          echo ""
          echo "WARNING: .testmondata was not created"
        fi
        exit $PYTEST_EXIT

  testmon-run:
    desc: Run tests incrementally with testmon selection (requires prior testmon-build)
    deps: [install-worktree, _tmpdir-setup]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OMP_NUM_THREADS: "1"
      TMPDIR: "{{.PYTEST_TMPDIR}}"
      AUTOSKILLIT_TEST_FILTER: "none"
    cmds:
      - |
        mkdir -p temp
        if [ ! -f ".testmondata" ]; then
          echo "ERROR: .testmondata not found. Run 'task testmon-build' first."
          exit 1
        fi

        if [[ -d ".venv" ]]; then
          PYTEST_CMD=".venv/bin/python -m pytest"
        else
          PYTEST_CMD="pytest"
        fi

        XDIST_FLAGS=""
        if [ "${TESTMON_XDIST:-0}" = "1" ]; then
          XDIST_FLAGS="-n 4"
          echo "Running testmon with xdist (-n 4)"
        else
          echo "Running testmon serial (set TESTMON_XDIST=1 for parallel)"
        fi

        set -o pipefail
        set +e
        $PYTEST_CMD tests/ -q --tb=short --testmon $XDIST_FLAGS \
          -m "not smoke and not canary" \
          --disable-warnings -o "addopts=" \
          --basetemp={{.PYTEST_TMPDIR}} \
          -o "cache_dir={{.PYTEST_CACHEDIR}}" \
          2>&1 | tee "temp/testmon-run-$(date +%Y-%m-%d_%H%M%S).txt"
        PYTEST_EXIT=$?
        set +o pipefail
        set -e

        exit $PYTEST_EXIT

  testmon-benchmark:
    desc: Compare testmon selection vs cascade selection for changed files
    deps: [install-worktree]
    cmds:
      - |
        if [ ! -f ".testmondata" ]; then
          echo "ERROR: .testmondata not found. Run 'task testmon-build' first."
          exit 1
        fi

        if [[ -d ".venv" ]]; then
          PYTHON=".venv/bin/python"
        else
          PYTHON="python"
        fi

        $PYTHON scripts/benchmark-testmon.py \
          --mode="${TESTMON_BENCH_MODE:-compare}" \
          ${TESTMON_CHANGED_FILES:+--changed-files="$TESTMON_CHANGED_FILES"}

  cleanup-shm:
    desc: "Clean stale /dev/shm pytest and headless session dirs (age-gated, safe for concurrent worktrees)"
    preconditions:
      - sh: '[ "$(uname -s)" = "Linux" ]'
        msg: "cleanup-shm requires Linux (/dev/shm)"
    cmds:
      - |
        echo "Cleaning stale /dev/shm directories..."

        # pytest-tmp dirs older than 2 hours
        PYTEST_COUNT=$(find /dev/shm -maxdepth 1 -name 'pytest-tmp-*' -mmin +120 -type d 2>/dev/null | wc -l)
        if [ "$PYTEST_COUNT" -gt 0 ]; then
          find /dev/shm -maxdepth 1 -name 'pytest-tmp-*' -mmin +120 -type d -exec rm -rf {} +
          echo "  Removed $PYTEST_COUNT stale pytest-tmp dirs (>2h old)"
        else
          echo "  No stale pytest-tmp dirs found"
        fi

        # pytest-cache dirs older than 2 hours
        CACHE_COUNT=$(find /dev/shm -maxdepth 1 -name 'pytest-cache-*' -mmin +120 -type d 2>/dev/null | wc -l)
        if [ "$CACHE_COUNT" -gt 0 ]; then
          find /dev/shm -maxdepth 1 -name 'pytest-cache-*' -mmin +120 -type d -exec rm -rf {} +
          echo "  Removed $CACHE_COUNT stale pytest-cache dirs (>2h old)"
        else
          echo "  No stale pytest-cache dirs found"
        fi

        # headless session dirs older than 4 hours
        HEADLESS_COUNT=$(find /dev/shm/autoskillit-sessions -maxdepth 1 -name 'headless-*' -mmin +240 -type d 2>/dev/null | wc -l)
        if [ "$HEADLESS_COUNT" -gt 0 ]; then
          find /dev/shm/autoskillit-sessions -maxdepth 1 -name 'headless-*' -mmin +240 -type d -exec rm -rf {} +
          echo "  Removed $HEADLESS_COUNT stale headless session dirs (>4h old)"
        else
          echo "  No stale headless session dirs found"
        fi

        echo "Done."

  drop-cache:
    desc: "Drop Linux page cache and compact memory for WSL2 memory reclaim (do NOT run during active I/O-heavy sessions)"
    preconditions:
      - sh: '[ "$(uname -s)" = "Linux" ]'
        msg: "drop-cache requires Linux (WSL2)"
    cmds:
      - |
        echo "Syncing filesystem and dropping page cache..."
        echo "WARNING: Do not run this while sessions are actively doing I/O-heavy work (tests, git operations)."
        echo ""

        BEFORE=$(awk '/MemAvailable/ {printf "%.0f", $2/1024}' /proc/meminfo 2>/dev/null || echo "?")
        echo "Available memory before: ${BEFORE} MB"

        sudo sh -c 'sync && echo 3 > /proc/sys/vm/drop_caches && if [ -f /proc/sys/vm/compact_memory ]; then echo 1 > /proc/sys/vm/compact_memory; fi' || {
          echo ""
          echo "ERROR: sudo failed — ensure passwordless sudo is configured, or run manually:"
          echo "  sudo sh -c 'sync && echo 3 > /proc/sys/vm/drop_caches && if [ -f /proc/sys/vm/compact_memory ]; then echo 1 > /proc/sys/vm/compact_memory; fi'"
          exit 1
        }

        AFTER=$(awk '/MemAvailable/ {printf "%.0f", $2/1024}' /proc/meminfo 2>/dev/null || echo "?")
        echo ""
        echo "Available memory after:  ${AFTER} MB"
        echo "Done. Page cache dropped and memory compacted."
