[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autoskillit"
version = "0.10.404"
description = "MCP server for orchestrating automated skill-driven workflows with Claude Code"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Talon Trecek", email = "talontrecek@gmail.com"},
]
keywords = ["claude", "claude-code", "automation", "ai", "mcp", "plugin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    "anyio>=4.6.0",
    "dynaconf>=3.2.13,<4.0",
    "fastmcp>=3.2.0,<4.0",
    "httpx>=0.28,<1.0",
    "networkx>=3.6,<4.0",
    "lazy-loader>=0.4",
    "markdown-it-py>=3.0",
    "packaging>=23.0",
    "pathspec>=1.0,<2.0",
    "orjson>=3.11",
    "psutil>=7.2.0",
    "pygments>=2.20.0",
    "pyjwt>=2.12.0",
    "pyyaml>=6.0",
    "cyclopts>=4.0",
    "regex>=2026.1",
    "structlog>=25.0,<26.0",
    "zstandard>=0.23",
    "uvloop>=0.21.0; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.0.0",  # asyncio_default_fixture_loop_scope requires >=1.0.0
    "pytest-httpx>=0.36",
    "pytest-xdist>=3.5.0",
    "pytest-cov>=7.0",
    "pytest-timeout>=2.3",
    "ruff>=0.15.0",
    "import-linter>=2.1",
    "packaging>=25.0",
    "pytest-testmon>=2.2.0",
    "api-simulator; sys_platform == 'linux'",
    "tree-sitter>=0.24",
    "tree-sitter-python>=0.23",
    "tree-sitter-language-pack>=0.10",
]

[project.urls]
Homepage = "https://github.com/TalonT-Org/AutoSkillit"
Repository = "https://github.com/TalonT-Org/AutoSkillit"
Documentation = "https://github.com/TalonT-Org/AutoSkillit/tree/stable/docs"
"Bug Tracker" = "https://github.com/TalonT-Org/AutoSkillit/issues"

[project.scripts]
autoskillit = "autoskillit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/autoskillit"]
artifacts = [
    "src/autoskillit/.claude-plugin/**",
    "src/autoskillit/.mcp.json",
    "src/autoskillit/agents/**",
    "src/autoskillit/migrations/**",
    "src/autoskillit/hooks/**",
    "src/autoskillit/config/defaults.yaml",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/autoskillit/**",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
empty_parameter_set_mark = "fail_at_collect"
addopts = []
timeout = 60
timeout_method = "signal"
markers = [
    "smoke: end-to-end smoke tests requiring Claude API access (deselect with: -m 'not smoke')",
    "integration: integration tests that spawn real subprocesses (deselect with: -m 'not integration')",
    "canary: development-time filter verification tests (deselect with: -m 'not canary')",
    "layer(name): source-layer marker for test file classification (core, config, pipeline, execution, workspace, recipe, migration, fleet, server, cli)",
    "small: pure unit test — no persistent I/O, no network, no subprocess (RAM-backed tmpfs via tmp_path IS allowed)",
    "medium: filesystem and subprocess allowed — no network, no external services",
    "large: full integration — everything allowed (default for unannotated tests)",
    "feature(name): marks tests requiring a specific feature gate to be enabled",
]

[tool.coverage.run]
parallel = true
source = ["src/autoskillit"]

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "TID251"]

[tool.ruff.lint.per-file-ignores]
"tests/execution/test_session_classification_e2e.py" = ["E402"]
"tests/execution/test_process_channel_b.py" = ["E501"]
"tests/test_test_filter_cascade.py" = ["E501"]
"tests/execution/test_quota_io.py" = ["E501"]
"tests/execution/test_merge_queue_ejection.py" = ["E501"]
"tests/execution/test_quota_binding.py" = ["E501"]
"tests/arch/test_layer_enforcement.py" = ["E501"]
"tests/execution/test_quota_sleep.py" = ["E501"]
"tests/execution/test_merge_queue_classifier.py" = ["E501"]
"tests/skills/test_vis_lens_methodology_norms.py" = ["E501"]
"tests/planner/test_manifests_builders.py" = ["E501"]
"tests/planner/test_merge_files.py" = ["E501"]
"tests/planner/test_planner_api.py" = ["E501"]
"tests/planner/test_planner_contracts.py" = ["E501"]
"tests/planner/test_planner_validation_gate.py" = ["E501"]
"tests/planner/test_validation_core.py" = ["E501"]
"tests/planner/test_validation_discovery.py" = ["E501"]
"tests/cli/test_cli_prompts.py" = ["E501"]
"tests/fleet/test_dispatch_failure_semantics.py" = ["E501"]
"tests/execution/test_session_log_fields.py" = ["E501"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"logging.getLogger" = {msg = "Use get_logger() from autoskillit._logging instead."}
"signal.signal" = {msg = "Use anyio.open_signal_receiver instead of signal.signal — see _serve_with_signal_guard in cli/app.py."}

[tool.importlinter]
root_packages = ["autoskillit"]
# Exclude imports made inside `if TYPE_CHECKING:` guards from all contracts.
# This is critical for execution/headless.py, which imports pipeline types only
# inside TYPE_CHECKING blocks to avoid circular imports at runtime.
exclude_type_checking_imports = true

# Contract IDs below use IL-NNN (three-digit serial numbers, e.g. IL-001).
# These are NOT import layer levels (IL-0 through IL-3).
# IL-002 = config's contract; IL-2 = the recipe/migration/fleet import layer.

# IL-001 | Lens: module-dependency | DS-001
# Rationale: IL-0 (core) is the foundation layer; it must have zero upward imports to
# remain independently testable and importable outside the autoskillit package.
[[tool.importlinter.contracts]]
name = "IL-0 core has no autoskillit upward imports"
type = "forbidden"
source_modules = ["autoskillit.core"]
forbidden_modules = [
    "autoskillit.config",
    "autoskillit.pipeline",
    "autoskillit.execution",
    "autoskillit.workspace",
    "autoskillit.recipe",
    "autoskillit.migration",
    "autoskillit.server",
    "autoskillit.cli",
    "autoskillit.report",
    "autoskillit.planner",
]

# IL-002 | Lens: module-dependency | DS-001
# Rationale: IL-1 config resolves settings from layered sources; allowing it to import
# pipeline/execution/recipe would create hidden initialization-time coupling that
# breaks independent layered testing.
[[tool.importlinter.contracts]]
name = "IL-1 config imports only IL-0"
type = "forbidden"
source_modules = ["autoskillit.config"]
forbidden_modules = [
    "autoskillit.pipeline",
    "autoskillit.execution",
    "autoskillit.workspace",
    "autoskillit.recipe",
    "autoskillit.migration",
    "autoskillit.server",
    "autoskillit.cli",
    "autoskillit.report",
    "autoskillit.planner",
]

# IL-003 | Lens: module-dependency | DS-001
# Rationale: pipeline/ holds cross-session gate and audit state; importing from IL-2
# (recipe, migration) would create initialization-order coupling and prevent IL-1
# packages from being tested in isolation without a full IL-2 import graph.
[[tool.importlinter.contracts]]
name = "IL-1 pipeline does not import IL-2 or IL-3"
type = "forbidden"
source_modules = ["autoskillit.pipeline"]
# EXCEPTION: autoskillit.config is intentionally omitted from the
# forbidden_modules list. pipeline.context.ToolContext owns
# AutomationConfig as the DI wiring point — see the docstrings on
# pipeline/context.py and pipeline/__init__.py. The coupling is safe
# because config/ depends only on IL-0 (enforced by IL-002), so no
# cycle is possible. This exception is asserted by
# tests/arch/test_import_linter_contracts.py
#     ::test_il003_pipeline_config_exception_documented.
forbidden_modules = [
    "autoskillit.execution",
    "autoskillit.workspace",
    "autoskillit.recipe",
    "autoskillit.migration",
    "autoskillit.server",
    "autoskillit.cli",
    "autoskillit.report",
    "autoskillit.planner",
]

# IL-004 | Lens: module-dependency | DS-001
# Rationale: execution/ manages subprocess lifecycle; it must not import config,
# pipeline, workspace, recipe, migration, server, or cli to remain a leaf IL-1 service
# that can be tested without spinning up the full autoskillit stack.
[[tool.importlinter.contracts]]
name = "IL-1 execution imports only IL-0"
type = "forbidden"
source_modules = ["autoskillit.execution"]
forbidden_modules = [
    "autoskillit.config",
    "autoskillit.pipeline",
    "autoskillit.workspace",
    "autoskillit.recipe",
    "autoskillit.migration",
    "autoskillit.server",
    "autoskillit.cli",
    "autoskillit.report",
    "autoskillit.planner",
]

# IL-005 | Lens: module-dependency | DS-001
# Rationale: workspace/ manages cloning and skill resolution; importing from config
# or pipeline would introduce a circular risk since config and pipeline both may
# depend on workspace for path resolution.
[[tool.importlinter.contracts]]
name = "IL-1 workspace imports only IL-0"
type = "forbidden"
source_modules = ["autoskillit.workspace"]
forbidden_modules = [
    "autoskillit.config",
    "autoskillit.pipeline",
    "autoskillit.execution",
    "autoskillit.recipe",
    "autoskillit.migration",
    "autoskillit.server",
    "autoskillit.cli",
    "autoskillit.report",
    "autoskillit.planner",
]

# IL-006 | Lens: module-dependency | DS-001
# Rationale: recipe/ is an IL-2 service that orchestrates validation over workspace
# artifacts; importing config, pipeline, execution, migration, server, or cli
# would conflate recipe semantics with runtime session management.
[[tool.importlinter.contracts]]
name = "IL-2 recipe imports only IL-0 and workspace"
type = "forbidden"
source_modules = ["autoskillit.recipe"]
forbidden_modules = [
    "autoskillit.config",
    "autoskillit.pipeline",
    "autoskillit.execution",
    "autoskillit.migration",
    "autoskillit.server",
    "autoskillit.cli",
    "autoskillit.report",
    "autoskillit.planner",
]
# EXCEPTION: rules_contracts uses a deferred function-body import of planner
# for skill-schema validation (REQ-COMP-009). planner/ does not import recipe/,
# so no cycle is introduced.
ignore_imports = [
    "autoskillit.recipe.rules.rules_contracts -> autoskillit.planner",
]

# IL-007 | Lens: module-dependency | DS-001
# Rationale: migration/ must not import config or pipeline to stay independently
# runnable as a schema-upgrade step without a live pipeline context.
[[tool.importlinter.contracts]]
name = "IL-2 migration does not import IL-3 or config"
type = "forbidden"
source_modules = ["autoskillit.migration"]
forbidden_modules = [
    "autoskillit.config",
    "autoskillit.pipeline",
    "autoskillit.server",
    "autoskillit.cli",
    "autoskillit.report",
]

# IL-008 | Lens: module-dependency | DS-001
# Rationale: The six IL-1 peers (config, pipeline, execution, workspace, report,
# planner) form an
# independent service tier. Lateral imports between them create hidden coupling
# that prevents each package from being tested and deployed in isolation. The
# independence contract makes this boundary machine-verifiable and surfaces any
# future regression immediately via lint-imports.
[[tool.importlinter.contracts]]
name = "IL-1 siblings are independent of each other"
type = "independence"
modules = [
    "autoskillit.config",
    "autoskillit.pipeline",
    "autoskillit.execution",
    "autoskillit.workspace",
    "autoskillit.report",
    "autoskillit.planner",
]
# EXCEPTION: autoskillit.pipeline.context may import autoskillit.config.
# pipeline.context.ToolContext owns AutomationConfig as the DI wiring point.
# config/ depends only on IL-0 (IL-002), so no cycle is introduced.
# This exception mirrors the one already documented in IL-003.
ignore_imports = [
    "autoskillit.pipeline.context -> autoskillit.config",
]

# IL-009 | Lens: module-dependency | DS-001
# Rationale: fleet is IL-2 — imports IL-0 (core) only; workspace allowed for path utilities
[[tool.importlinter.contracts]]
name = "IL-2 fleet does not import IL-3 or most IL-1 peers"
type = "forbidden"
source_modules = ["autoskillit.fleet"]
forbidden_modules = [
    # EXCEPTION: autoskillit.workspace is intentionally absent from this list.
    # fleet may import workspace solely for path-lookup utilities (e.g., worktree paths).
    # This is a deliberate, narrow allowance — do not expand workspace use in fleet
    # beyond path utilities without updating this contract and the rationale comment above.
    "autoskillit.config",
    "autoskillit.pipeline",
    "autoskillit.execution",
    "autoskillit.migration",
    "autoskillit.recipe",
    "autoskillit.server",
    "autoskillit.cli",
    "autoskillit.report",
]
ignore_imports = [
    # _dispatch_reaper calls kill_process_tree for orphan reaping; psutil is non-stdlib
    # so the reaper cannot live in core/. This mirrors the workspace path-utility exception.
    "autoskillit.fleet._dispatch_reaper -> autoskillit.execution",
    # _run_dispatch enforces config-authoritative ingredient injection at dispatch time.
    # apply_config_authoritative_overrides lives in config/ to share resolve_ingredient_defaults
    # without duplication. The import is deferred (function-body) and deliberate — it is the
    # narrowest place where both the recipe schema and config defaults are simultaneously
    # available. Do not expand fleet's config access beyond this single call site.
    "autoskillit.fleet._api -> autoskillit.config",
]

# IL-011 | _dag_ops: shared DAG primitives with no planner-internal imports
[[tool.importlinter.contracts]]
name = "IL-011 _dag_ops has no planner-internal imports"
type = "forbidden"
source_modules = ["autoskillit.planner._dag_ops"]
forbidden_modules = [
    "autoskillit.planner.consolidation",
    "autoskillit.planner.validation",
    "autoskillit.planner.compiler",
    "autoskillit.planner.manifests",
    "autoskillit.planner.merge",
    "autoskillit.planner.schema",
]

# IL-010 | Lens: module-dependency | DS-001
# Rationale: report/ is an IL-1 package that renders research bundles. It must only
# import from IL-0 (core) to remain a leaf service that can be tested without
# spinning up the full autoskillit stack.
[[tool.importlinter.contracts]]
name = "IL-1 report imports only IL-0"
type = "forbidden"
source_modules = ["autoskillit.report"]
forbidden_modules = [
    "autoskillit.config",
    "autoskillit.pipeline",
    "autoskillit.execution",
    "autoskillit.workspace",
    "autoskillit.recipe",
    "autoskillit.migration",
    "autoskillit.fleet",
    "autoskillit.server",
    "autoskillit.cli",
]

[tool.uv.sources]
api-simulator = { git = "https://github.com/TalonT-Org/api-simulator", rev = "8f711f958d4d93a8e53a3c3b51279fb420870f3a", subdirectory = "crates/api-simulator-py" }
