from_version: "0.10.1107"
to_version: "0.10.1108"
description: >
  execution/ decomposed into execution/{github_ops,evidence,runtime}/
  sub-packages (#4672).
changes:
  - id: execution-commands-relocated
    description: >
      autoskillit.execution.commands moved to
      autoskillit.execution.runtime.commands as part of #4672's decomposition
      of execution/ into execution/{github_ops,evidence,runtime}/ sub-packages.
      The single public name ClaudeHeadlessCmd is also re-exported by the
      execution/ gateway (autoskillit.execution) so most consumers need no
      change.
    instruction: |
      Direct imports of `autoskillit.execution.commands` (the module path
      that existed prior to this release) must be updated to
      `autoskillit.execution.runtime.commands`. Indirect consumers that
      import `from autoskillit.execution import ClaudeHeadlessCmd` (or any
      other name from the gateway) need no change — the execution/__init__.py
      gateway re-exports the full public surface at the legacy path.
