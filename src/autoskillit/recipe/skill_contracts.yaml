    - "verdict[ \\t]*=[ \\t]*(plan|false_positive)"
    pattern_examples:
    - "verdict = plan\nplan_path = /tmp/plan.md\nplan_parts = /tmp/plan.md\n%%ORDER_UP%%"
    - "verdict = false_positive\n%%ORDER_UP%%"
    write_behavior: conditional
    write_expected_when:
