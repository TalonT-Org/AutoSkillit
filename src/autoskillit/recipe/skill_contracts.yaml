version: 0.1.0
# Default semantics for 'required' when omitted from an input:
#   skills section          → required=false (skills are permissive)
#   callable_contracts section → required=true  (callables are strict)
# Best practice: always declare 'required' explicitly on every input.
skills:
  troubleshoot-experiment:
    inputs:
    - name: worktree_path
      type: string
      required: true
    - name: step_name
      type: string
      required: true
    outputs:
    - name: diagnosis_path
      type: file_path
    - name: failure_type
      type: string
    - name: is_fixable
      type: string
    - name: retry_delay
      type: integer
    expected_output_patterns:
    - "is_fixable[ \\t]*=[ \\t]*(true|false)"
    pattern_examples:
    - "diagnosis_path = /tmp/diagnosis.md\nfailure_type = stale_timeout\nis_fixable = true\n%%ORDER_UP%%"
    - "diagnosis_path = /tmp/diagnosis.md\nfailure_type = transient_api\nis_fixable = true\nretry_delay = 120\n%%ORDER_UP%%"
    write_behavior: always
  diagnose-ci:
    inputs:
    - name: branch
      type: string
      required: true
    - name: run_id
      type: string
      required: false
    - name: ci_failed_jobs
      type: string
      required: false
    outputs:
    - name: diagnosis_path
      type: file_path
    - name: failure_type
      type: string
      allowed_values: [test, lint, build, type_check, env, unknown, no_failure]
    - name: failure_subtype
      type: string
      allowed_values: [flaky, timing_race, deterministic, fixture, import, env, unknown, no_failure]
    - name: is_fixable
      type: string
    expected_output_patterns:
    - "diagnosis_path[ \\t]*=[ \\t]*/.+"
    - "failure_subtype[ \\t]*=[ \\t]*(flaky|timing_race|deterministic|fixture|import|env|unknown|no_failure)"
    pattern_examples:
    - "diagnosis_path = /tmp/diagnosis.md\nfailure_type = test\nfailure_subtype = deterministic\nis_fixable = true\n%%ORDER_UP%%"
    - "diagnosis_path = /tmp/diagnosis.md\nfailure_type = test\nfailure_subtype = flaky\nis_fixable = false\n%%ORDER_UP%%"
    - "diagnosis_path = /tmp/diagnosis.md\nfailure_type = test\nfailure_subtype = unknown\nis_fixable = false\n%%ORDER_UP%%"
    - "diagnosis_path = /tmp/diagnosis.md\nfailure_type = test\nfailure_subtype = timing_race\nis_fixable = true\n%%ORDER_UP%%"
    - "diagnosis_path = /tmp/diagnosis.md\nfailure_type = test\nfailure_subtype = fixture\nis_fixable = true\n%%ORDER_UP%%"
    - "diagnosis_path = /tmp/diagnosis.md\nfailure_type = test\nfailure_subtype = import\nis_fixable = true\n%%ORDER_UP%%"
    - "diagnosis_path = /tmp/diagnosis.md\nfailure_type = lint\nfailure_subtype = unknown\nis_fixable = true\n%%ORDER_UP%%"
    - "diagnosis_path = /tmp/diagnosis.md\nfailure_type = build\nfailure_subtype = unknown\nis_fixable = true\n%%ORDER_UP%%"
    - "diagnosis_path = /tmp/diagnosis.md\nfailure_type = type_check\nfailure_subtype = unknown\nis_fixable = true\n%%ORDER_UP%%"
    - "diagnosis_path = /tmp/diagnosis.md\nfailure_type = env\nfailure_subtype = env\nis_fixable = false\n%%ORDER_UP%%"
    - "diagnosis_path = /tmp/diagnosis.md\nfailure_type = unknown\nfailure_subtype = unknown\nis_fixable = false\n%%ORDER_UP%%"
    - "diagnosis_path = /tmp/diagnosis.md\nfailure_type = no_failure\nfailure_subtype = no_failure\nis_fixable = false\n%%ORDER_UP%%"
    write_behavior: always
  resolve-design-review:
    inputs:
    - name: evaluation_dashboard
      type: file_path
      required: true
    - name: experiment_plan
      type: file_path
      required: true
    outputs:
    - name: resolution
      type: string
      allowed_values: [revised, failed]
    - name: revision_guidance
      type: file_path
    expected_output_patterns:
    - "resolution[ \\t]*=[ \\t]*(revised|failed)"
    - "(?:revision_guidance[ \\t]*=[ \\t]*/.+|resolution[ \\t]*=[ \\t]*failed)"
    pattern_examples:
    - "resolution = revised\nrevision_guidance = /tmp/guidance.md\n%%ORDER_UP%%"
    - "resolution = failed\n%%ORDER_UP%%"
    write_behavior: always
  resolve-failures:
    inputs:
    - name: worktree_path
      type: directory_path
      required: true
    - name: plan_path
      type: file_path
      required: true
    - name: base_branch
      type: string
      required: true
    - name: diagnosis_path
      type: file_path
      required: false
    outputs:
    - name: verdict
      type: string
      allowed_values:
        - real_fix
        - already_green
        - flake_suspected
        - ci_only_failure
        - no_test_infrastructure
    - name: fixes_applied
      type: integer
    write_behavior: conditional
    write_expected_when:
    - "verdict[ \\t]*=[ \\t]*real_fix"
  resolve-merge-conflicts:
    inputs:
    - name: worktree_path
      type: directory_path
      required: true
    - name: plan_path
      type: file_path
      required: true
    - name: base_branch
      type: string
      required: true
    outputs:
    - name: worktree_path
      type: directory_path
    - name: branch_name
      type: string
    - name: conflict_report_path
      type: file_path
    - name: escalation_required
      type: string
    - name: escalation_reason
      type: string
    expected_output_patterns:
    - "worktree_path[ \\t]*=[ \\t]*/.+"
    - "%%ORDER_UP::[a-f0-9]+%%"
    pattern_examples:
    - "worktree_path = /tmp/worktrees/impl-foo-20260316\n%%ORDER_UP::a1b2c3d4%%"
    write_behavior: conditional
    write_expected_when:
    - "conflict_report_path[ \\t]*=[ \\t]*/.+"
    completion_required: true
  resolve-review:
    inputs:
    - name: feature_branch
      type: string
      required: true
    - name: base_branch
      type: string
      required: true
    - name: mode
      type: string
      required: false
    outputs:
    - name: verdict
      type: string
      allowed_values:
        - real_fix
        - already_green
        - flake_suspected
        - ci_only_failure
    - name: fixes_applied
      type: integer
    - name: deferred_observations_path
      type: string
      description: "Written when mode=local (accumulated critical/warning DISCUSS findings, excluding info-severity) or when mode=github (posted from prior local rounds)."
      required: false
    - name: reject_patterns_path
      type: string
      description: "Written in local mode (accumulating across rounds without timestamp) or github mode (timestamped, one-shot)."
      required: false
    write_behavior: conditional
    write_expected_when:
    - "verdict[ \\t]*=[ \\t]*real_fix"
  dry-walkthrough:
    inputs:
    - name: plan_path
      type: file_path
      required: true
    outputs: []
    write_behavior: always
  implement-worktree:
    inputs:
    - name: plan_path
      type: file_path
      required: true
    outputs:
    - name: worktree_path
      type: directory_path
    - name: branch_name
      type: string
    expected_output_patterns:
    - "worktree_path[ \\t]*=[ \\t]*/.+"
    - "%%ORDER_UP::[a-f0-9]+%%"
    pattern_examples:
    - "worktree_path = /tmp/worktrees/impl-foo-20260316\n%%ORDER_UP::a1b2c3d4%%"
    write_behavior: always
    completion_required: true
  implement-worktree-no-merge:
    inputs:
    - name: plan_path
      type: file_path
      required: true
    outputs:
    - name: worktree_path
      type: directory_path
    - name: branch_name
      type: string
    expected_output_patterns:
    - "worktree_path[ \\t]*=[ \\t]*/.+"
    - "%%ORDER_UP::[a-f0-9]+%%"
    pattern_examples:
    - "worktree_path = /tmp/worktrees/impl-foo-20260316\n%%ORDER_UP::a1b2c3d4%%"
    write_behavior: always
    completion_required: true
  investigate:
    inputs:
    - name: topic
      type: string
      required: true
    outputs:
    - name: investigation_path
      type: file_path
    expected_output_patterns:
    - "investigation_path[ \\t]*=[ \\t]*/.+"
    pattern_examples:
    - "investigation_path = /tmp/investigation.md\n%%ORDER_UP%%"
