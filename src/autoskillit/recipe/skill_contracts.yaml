      required: true
    outputs:
    - name: groups_path
      type: file_path
    - name: manifest_path
      type: file_path
    - name: group_files
      type: file_path_list
    expected_output_patterns:
    - "groups_path[ \\t]*=[ \\t]*/.+"
    pattern_examples:
    - "groups_path = /tmp/groups.json\n%%ORDER_UP%%"
