name: remediation
description: Investigate a bug, plan a fix, open a PR
summary: bootstrap_clone > (claim_and_resolve?) > (create_and_publish?) > investigate
  > rectify > (review-approach?) > dry-walkthrough > implement > test > merge (per
  plan part) > (audit-impl?) > (open_pr?) > push > cleanup
recipe_version: 1.0.0
requires_packs:
- github
- ci
- clone
- telemetry
kitchen_rules:
- NEVER use native Claude Code tools (Read, Grep, Glob, Edit, Write, Bash, Agent,
  WebFetch, WebSearch, NotebookEdit) from the orchestrator. All code changes and investigation
  happen through headless sessions via run_skill.
- "Route to on_failure when a step fails \u2014 the downstream skill (e.g., resolve-failures)\
  \ has diagnostic access that the orchestrator does not. Do not investigate or attempt\
  \ to fix failures directly."
- "SEQUENTIAL EXECUTION: complete full cycle per part before advancing. For each plan_part,\
  \ run the full cycle (dry_walkthrough \u2192 implement \u2192 test \u2192 merge)\
  \ before starting the next part."
- "By default (open_pr=true), a feature branch is created with a unique name derived\
  \ from inputs.run_name and context.issue_number (e.g. investigate/42) or a date\
  \ suffix (e.g. investigate/20260304) when no issue is available. All worktree merges\
  \ target the feature branch (context.merge_target), not base_branch directly. The\
  \ push step publishes the feature branch, then prepare_pr \u2192 run_arch_lenses\
  \ \u2192 compose_pr opens a PR to base_branch. When open_pr=false, merges target\
  \ base_branch directly and prepare_pr is skipped."
- When arch_lenses=true (and open_pr=true), prepare_pr routes through run_arch_lenses
  before compose_pr, adding architecture lens diagrams to the PR. By default arch_lenses
  is off and prepare_pr routes directly to compose_pr.
- "SOURCE ISOLATION: After bootstrap_clone returns, the source_dir is strictly off-limits.\
  \ Never run any command in source_dir \u2014 no git checkout, git fetch, git reset,\
  \ git pull, run_cmd, run_skill, or any other operation. All work \u2014 skill invocations,\
  \ git operations, file reads \u2014 happens exclusively in the clone (work_dir).\
  \ source_dir is used ONLY to read the remote URL inside push_to_remote."
ingredients:
  task:
    description: Bug, error, or question to investigate
    required: true
  source_dir:
    description: Source repository
    required: false
    default: ''
  run_name:
    description: Run name prefix
    default: remediation
  base_branch:
    description: Merge target
    default: ''
    authority: config
  audit_impl:
    description: Post-merge quality gate
    default: 'true'
  closure_authority_path:
    description: Absolute path to frozen requirements authority JSON for closure-mode
      audit
    default: ''
  closure_authority_hash:
    description: SHA-256 lowercase hex hash of the authority file content
    default: ''
  review_approach:
    description: Review solution approaches against the plan (runs after rectify/make-plan)
    default: 'false'
  investigate:
    description: Run the investigate step. "true" (or "auto", the default) always
      runs; "false" always skips. In fleet/batch dispatch, external orchestrators
      resolve "auto" to "false" when the issue body contains an investigation-complete
      marker. In direct orders, "auto" behaves like "true".
    default: auto
  open_pr:
    description: PR instead of direct merge
    default: 'true'
  arch_lenses:
    description: Generate architecture lens diagrams for the PR
    default: 'false'
  auto_merge:
    description: "Automatically merge the PR after required checks pass \u2014 via\
      \ merge queue when available, direct merge otherwise"
    default: 'true'
  review_max_retries:
    description: Maximum number of review-resolve retry cycles before proceeding to
      CI
    default: '3'
  local_review_rounds:
    description: Number of review-resolve cycles to run locally before switching to
      GitHub-backed review. 0 disables local mode entirely.
    type: integer
    default: '2'
    authority: config
  merge_fix_max_retries:
    description: Maximum number of merge-fix retry cycles before failing
    default: '3'
  audit_remediation_max_retries:
    description: "Maximum audit remediation budget (allowed remediation rounds = value\
      \ \u2212 1). Set to 3 for 2 remediation rounds."
    default: '3'
  audit_integrity_max_retries:
    description: Maximum retries after an audit semantic or infrastructure failure
    default: '2'
  test_fix_max_retries:
    default: '3'
    description: "Maximum pre-merge test \u2192 fix \u2192 test budget (allowed fix\
      \ rounds = value \u2212 1). Set to 3 for 2 fix rounds per remediation cycle."
    hidden: true
  merge_test_fix_max_retries:
    default: '3'
    description: "Maximum iterations of the merge-gate test \u2192 fix \u2192 test\
      \ cycle."
    hidden: true
  adversarial_review_level:
    description: Controls adversarial review depth in make-plan. "auto" estimates
      complexity and gates agents accordingly. "full" always runs all 3 agents. "none"
      skips adversarial review entirely.
    default: auto
    hidden: true
    authority: config
  issue_url:
    description: GitHub issue to close on merge
    required: false
  upfront_claimed:
    description: Set to 'true' when process-issues has already claimed this issue
      upfront. Allows claim_issue defense step to pass through without aborting.
    default: 'false'
    hidden: true
  run_mode:
    description: "Execution mode when processing multiple issues. Options: sequential\
      \ (default, one issue at a time) or parallel (all issues simultaneously with\
      \ wavefront step scheduling \u2014 fast steps for all pipelines before any slow\
      \ step)."
    default: sequential
    hidden: true
  max_parallel:
    description: Maximum number of issues to run in parallel within a single execution-map
      group. Groups exceeding this cap are split into sequential sub-groups. Passed
      to build-execution-map. Must be a positive integer (expressed as a string).
    default: '6'
    hidden: true
  pipeline_health:
    description: Run diagnostic analysis after pipeline completion
    default: 'false'
    hidden: true
  kitchen_id:
    description: Kitchen session identifier (auto-injected)
    default: ''
    hidden: true
  depth:
    description: Investigation depth mode
    default: standard
    hidden: true
  is_fleet_dispatch:
    description: Whether running as an L2 food truck dispatch (auto-injected)
    default: 'false'
    hidden: true
    authority: config
  dispatch_id:
    description: Fleet dispatch identifier (auto-injected, empty in non-fleet sessions)
    default: ''
    hidden: true
    authority: config
  diagnostics_log_dir:
    description: Resolved diagnostics log directory path (auto-injected)
    default: ''
    hidden: true
delivery_segments:
- name: R0
  steps:
  - clone
- name: R1
  steps:
  - claim_and_resolve
  - create_and_publish
  - investigate
  - bridge_investigation
- name: R2
  steps:
  - rectify
  - salvage_rectify_plan
  - bind_plan_set
  - check_replan_iteration
  - review_approach
  - dry_walkthrough
  - renew_before_retry
  - retry_walkthrough
  - renew_plan_set
- name: R3
  steps:
  - create_impl_worktree
  - implement
  - retry_worktree
  - check_changes
  - close_issue_no_changes
- name: R4
  steps:
  - test
  - check_merge_fix_loop
  - diagnose_merge_gate
- name: R5
  steps:
  - check_merge_rebase_loop
  - check_dirty_main_retry
  - check_ref_push_loop
  - ref_push
  - check_audit_remediation_loop
  - check_audit_integrity_retry
- name: R6
  steps:
  - reset_test_fix_counter
  - reset_merge_test_fix_counter
  - reset_merge_fix_counter
  - reset_ref_push_counter
  - reset_plan_set_replan_counter
  - reset_pre_remediation_merge_fix_counter
- name: R7
  steps:
  - check_ref_push_loop_pre_remediation
  - ref_push_pre_remediation
  - verify_ref_push_exhaustion
  - pre_remediation_merge
- name: R8
  steps:
  - inter_part_push_pre_remediation
  - commit_guard_pre_remediation
  - main_repo_guard_pre_remediation
  - check_merge_fix_loop_pre_remediation
  - diagnose_merge_gate_pre_remediation
  - merge_gate_assess_pre_remediation
  - merge_gate_test_pre_remediation
  - assess
  - check_test_fix_loop
  - merge_gate_assess
- name: R9
  steps:
  - merge_gate_test
  - check_merge_test_fix_loop
  - rebase_conflict_fix
  - audit_impl
  - merge_audit_cycle_path
- name: R10
  steps:
  - remediate
  - make_plan
  - salvage_plan
  - commit_guard
  - main_repo_guard
- name: R11
  steps:
  - merge
  - inter_part_push
  - next_or_done
  - check_has_commits
  - close_issue_already_done
- name: R12
  steps:
  - push
  - prepare_pr
  - run_arch_lenses
- name: R13
  steps:
  - compose_pr
  - guard_pr_url
  - extract_pr_number
  - capture_review_repository
  - init_review_loop_count
  - clear_review_annotation_context
  - annotate_pr_diff
- name: R14
  steps:
  - review_pr
  - resolve_review
- name: R15
  steps:
  - check_resolve_review_posted
  - pre_review_rebase
  - resolve_pre_review_conflicts
- name: R16
  steps:
  - re_push_review
  - check_review_posted
  - check_review_loop
  - pre_review_cleanup
- name: R17
  steps:
  - check_repo_ci_event
  - route_ci_applicable
  - check_pr_state
  - ci_watch
  - check_ci_timed_out_loop
- name: R18
  steps:
  - handle_no_ci_runs
  - check_ci_loop
  - check_active_trigger_loop
  - trigger_ci_actively
  - check_ci_already_passed
  - mark_issue_failed_no_ci
  - register_clone_no_ci
  - analyze_pipeline_health_no_ci
  - escalate_stop_no_ci
- name: R19
  steps:
  - check_repo_merge_state
  - route_queue_mode
  - enqueue_to_queue
  - verify_queue_enrollment
- name: R20
  steps:
  - wait_for_queue
  - reenroll_stalled_pr
  - check_stall_loop
  - check_eject_limit
- name: R21
  steps:
  - check_dropped_healthy_loop
  - check_dropped_ci_loop
- name: R22
  steps:
  - queue_ejected_fix
  - resolve_queue_merge_conflicts
  - re_push_queue_fix
  - classify_push_failure
  - check_dequeue_retry_loop
  - wait_dequeue_retry
  - ci_watch_post_queue_fix
- name: R23
  steps:
  - check_ci_post_queue_loop
  - reenter_merge_queue
  - reenter_merge_queue_cheap
- name: R24
  steps:
  - direct_merge
  - wait_for_direct_merge
  - direct_merge_conflict_fix
  - resolve_direct_merge_conflicts
  - re_push_direct_fix
  - redirect_merge
- name: R25
  steps:
  - immediate_merge
  - wait_for_immediate_merge
  - immediate_merge_conflict_fix
  - resolve_immediate_merge_conflicts
- name: R26
  steps:
  - re_push_immediate_fix
  - remerge_immediate
  - diagnose_ci
- name: R27
  steps:
  - resolve_ci
  - pre_resolve_rebase
  - resolve_pre_resolve_conflicts
  - check_ci_rebase_loop
  - check_flake_loop
- name: R28
  steps:
  - re_push
  - detect_ci_conflict
  - ci_conflict_fix
- name: R29
  steps:
  - register_clone_unconfirmed
  - analyze_pipeline_health_unconfirmed
  - done_unconfirmed
  - release_issue_success
  - patch_token_summary
  - release_audit_remediation_stuck
  - stop_audit_remediation_stuck
  - await_audit_decision
  - stop_await_audit_decision
  - release_issue_failure
  - register_clone_success
  - register_clone_failure
  - analyze_pipeline_health
  - analyze_pipeline_health_error
  - register_clone_no_changes
  - analyze_pipeline_health_no_changes
  - register_clone_already_done
  - analyze_pipeline_health_already_done
  - done
  - done_no_changes
  - done_already_done
  - escalate_stop
steps:
  clone:
    tool: bootstrap_clone
    with:
      source_dir: ${{ inputs.source_dir }}
      run_name: ${{ inputs.run_name }}
      base_branch: ${{ inputs.base_branch }}
      step_name: clone
    capture:
      work_dir: ${{ result.work_dir }}
      remote_url: ${{ result.remote_url }}
      merge_target: ${{ result.merge_target }}
    on_success: claim_and_resolve
    on_failure: escalate_stop
    note: 'Clones source_dir and captures merge_target in one turn. Returns work_dir,
      remote_url, and merge_target (set to base_branch as fallback; overridden by
      create_and_publish when open_pr=true). On failure, escalate_stop immediately
      (no clone to remove).

      '
  claim_and_resolve:
    tool: claim_and_resolve_issue
    optional: true
    skip_when_false: inputs.issue_url
    on_skip: create_and_publish
    with:
      step_name: claim_and_resolve
      issue_url: ${{ inputs.issue_url }}
      allow_reentry: ${{ inputs.upfront_claimed }}
    capture:
      issue_number: ${{ result.issue_number }}
      issue_title: ${{ result.issue_title }}
      issue_slug: ${{ result.issue_slug }}
      claimed: ${{ result.claimed }}
      investigation_complete: ${{ result.investigation_complete }}
    on_result:
    - when: ${{ result.claimed }} == true
      route: create_and_publish
    - route: register_clone_failure
    on_failure: register_clone_failure
    note: 'Fetch issue title and slug for branch naming while claiming. If another session owns the claim, register the clone before escalation.'
  create_and_publish:
    tool: create_and_publish_branch
    optional: true
    skip_when_false: inputs.open_pr
    on_skip: investigate
    with:
      issue_slug: ${{ context.issue_slug }}
      run_name: ${{ inputs.run_name }}
      issue_number: ${{ context.issue_number }}
      work_dir: ${{ context.work_dir }}
      remote_url: ${{ context.remote_url }}
      step_name: create_and_publish
    capture:
      merge_target: ${{ result.merge_target }}
    on_success: investigate
    on_failure: release_issue_failure
    note: 'Create and publish a unique feature branch; set merge_target and its remote ref for merge_worktree. open_pr=false skips this step and retains base_branch.'
  investigate:
    tool: run_skill
    optional: true
    skip_when_false: inputs.investigate
    on_skip: bridge_investigation
    model: ${{ 'opus[1m]' if inputs.depth == 'deep' else 'sonnet' }}
    with:
      skill_command: /autoskillit:investigate
      skill_inputs:
        topic: ${{ '--depth deep ' if inputs.depth == 'deep' else '' }}${{ inputs.task
          }} ${{ inputs.issue_url }}
      cwd: ${{ context.work_dir }}
      output_dir: '{{AUTOSKILLIT_TEMP}}/investigate'
      step_name: investigate
    capture:
      investigation_path: ${{ result.investigation_path }}
    on_success: bridge_investigation
    on_failure: release_issue_failure
    on_context_limit: release_issue_failure
    on_rate_limit: release_issue_failure
    note: >
      Keep skill_command fixed. Pass depth, task, and issue URL together through
      skill_inputs.topic; investigate parses the URL itself. Deep mode uses the
      declared step model, while its subagents remain sonnet.
  bridge_investigation:
    tool: run_python
    with:
      step_name: bridge_investigation
      callable: autoskillit.smoke_utils.extract_investigation
      investigation_path: ${{ context.investigation_path }}
      issue_number: ${{ context.issue_number }}
      output_dir: '{{AUTOSKILLIT_TEMP}}/investigate'
      work_dir: ${{ context.work_dir }}
    capture:
      effective_investigation_path:
        from: ${{ result.investigation_report }}
        type: path
    on_success: rectify
    on_failure: release_issue_failure
    note: 'Use the investigation report when present. If investigation was skipped, extract the issue body''s Investigation section and require its Recommendations heading.'
  rectify:
    tool: run_skill
    model: ''
    with:
      skill_command: /autoskillit:rectify
      skill_inputs:
        investigation_path: ${{ context.effective_investigation_path }}
      cwd: ${{ context.work_dir }}
      output_dir: '{{AUTOSKILLIT_TEMP}}/rectify'
      step_name: rectify
    capture:
      plan_path: ${{ result.plan_path }}
    capture_list:
      plan_parts: ${{ result.plan_parts }}
    retries: 0
    on_success: bind_plan_set
    on_failure: release_issue_failure
    on_rate_limit: release_issue_failure
    on_context_limit: salvage_rectify_plan
    note: 'Glob plan_dir for *_part_*.md or single plan file. Sort alphabetically
      into plan_parts[].

      '
  salvage_rectify_plan:
    tool: run_python
    with:
      step_name: salvage_rectify_plan
      callable: autoskillit.recipe._cmd_rpc.verify_plan_artifacts
      plan_parts: ${{ context.plan_parts }}
    capture:
      plan_path: ${{ result.plan_path }}
    capture_list:
      plan_parts: ${{ result.plan_parts }}
    retries: 0
    on_result:
    - when: ${{ result.verdict }} == salvaged
      route: bind_plan_set
    - route: release_issue_failure
    on_failure: release_issue_failure
    note: 'On rectify context limit, verify plan_parts artifacts on disk. Pass captured context.plan_parts verbatim; salvage continues, otherwise take rectify''s failure route.'
  bind_plan_set:
    tool: bind_plan_set
    with:
      plan_parts: ${{ context.plan_parts }}
      cwd: ${{ context.work_dir }}
      issue_url: ${{ inputs.issue_url }}
      seal: 'true'
      step_name: bind_plan_set
    capture:
      plan_set_authority_path: ${{ result.plan_set_authority_path }}
      plan_set_authority_digest: ${{ result.plan_set_authority_digest }}
      plan_set_parts: ${{ result.plan_set_parts }}
      plan_set_coverage_gaps: ${{ result.coverage_gaps }}
    on_result:
    - when: ${{ result.success }} == true
      route: review_approach
    - when: ${{ result.reason }} == coverage_failed
      route: check_replan_iteration
    - route: release_issue_failure
    on_failure: release_issue_failure
  check_replan_iteration:
    tool: run_python
    with:
      step_name: check_replan_iteration
      callable: autoskillit.smoke_utils.check_loop_iteration
      current_iteration: ${{ context.plan_set_replan_count }}
      max_iterations: '2'
    capture:
      plan_set_replan_count: ${{ result.next_iteration }}
    optional_context_refs:
    - plan_set_replan_count
    on_result:
    - when: ${{ result.max_exceeded }} == true
      route: release_issue_failure
    - route: make_plan
    on_failure: release_issue_failure
  review_approach:
    tool: run_skill
    model: ''
    with:
      skill_command: /autoskillit:review-approach
      skill_inputs:
        plan_path: ${{ context.plan_path }}
      cwd: ${{ context.work_dir }}
      step_name: review_approach
      output_dir: '{{AUTOSKILLIT_TEMP}}/review-approach/audit_${{ context.audit_remediation_count }}'
    capture:
      review_path: ${{ result.review_path }}
    retries: 1
    on_success: dry_walkthrough
    on_failure: release_issue_failure
    on_context_limit: dry_walkthrough
    on_rate_limit: dry_walkthrough
    skip_when_false: inputs.review_approach
    on_skip: dry_walkthrough
    optional_context_refs:
    - audit_remediation_count
    note: Only execute this step if review_approach input is 'true'. Otherwise skip
      directly to dry_walkthrough.
  dry_walkthrough:
    tool: run_skill
    model: ''
    with:
      skill_command: /autoskillit:dry-walkthrough
      skill_inputs:
        plan_path: ${{ context.plan_path }}
        issue_url: ${{ inputs.issue_url }}
        review_path: ${{ context.review_path }}
        audit_cycle_path: ${{ context.audit_cycle_path }}
        plan_disposition_path: ${{ context.plan_disposition_path }}
        plan_set_authority_path: ${{ context.plan_set_authority_path }}
      cwd: ${{ context.work_dir }}
      output_dir: '{{AUTOSKILLIT_TEMP}}'
      step_name: dry_walkthrough
    on_success: renew_plan_set
    on_failure: release_issue_failure
    retries: 3
    on_exhausted: release_issue_failure
    on_context_limit: renew_before_retry
    optional_context_refs:
    - review_path
    - audit_cycle_path
    - plan_disposition_path
    note: Dry walkthrough retries on failure. It never routes back to a previous step.
  renew_before_retry:
    tool: bind_plan_set
    with:
      plan_parts: ${{ context.plan_set_parts }}
      cwd: ${{ context.work_dir }}
      parent_authority_path: ${{ context.plan_set_authority_path }}
      seal: 'true'
      step_name: renew_before_retry
    capture:
      plan_set_authority_path: ${{ result.plan_set_authority_path }}
      plan_set_authority_digest: ${{ result.plan_set_authority_digest }}
      plan_set_parts: ${{ result.plan_set_parts }}
      plan_set_coverage_gaps: ${{ result.coverage_gaps }}
    on_result:
    - when: ${{ result.success }} == true
      route: retry_walkthrough
    - route: release_issue_failure
    on_failure: release_issue_failure
  retry_walkthrough:
    tool: run_skill
    model: ''
    with:
      skill_command: /autoskillit:dry-walkthrough
      skill_inputs:
        plan_path: ${{ context.plan_path }}
        issue_url: ${{ inputs.issue_url }}
        review_path: ${{ context.review_path }}
        audit_cycle_path: ${{ context.audit_cycle_path }}
        plan_disposition_path: ${{ context.plan_disposition_path }}
        plan_set_authority_path: ${{ context.plan_set_authority_path }}
      cwd: ${{ context.work_dir }}
      output_dir: '{{AUTOSKILLIT_TEMP}}'
      step_name: retry_walkthrough
    retries: 0
    on_success: renew_plan_set
    on_failure: release_issue_failure
    on_context_limit: release_issue_failure
    on_rate_limit: release_issue_failure
    optional_context_refs:
    - review_path
    - audit_cycle_path
    - plan_disposition_path
  renew_plan_set:
    tool: bind_plan_set
    with:
      plan_parts: ${{ context.plan_set_parts }}
      cwd: ${{ context.work_dir }}
      parent_authority_path: ${{ context.plan_set_authority_path }}
      seal: 'true'
      step_name: renew_plan_set
    capture:
      plan_set_authority_path: ${{ result.plan_set_authority_path }}
      plan_set_authority_digest: ${{ result.plan_set_authority_digest }}
      plan_set_parts: ${{ result.plan_set_parts }}
      plan_set_coverage_gaps: ${{ result.coverage_gaps }}
    on_result:
    - when: ${{ result.success }} == true
      route: create_impl_worktree
    - route: release_issue_failure
    on_failure: release_issue_failure
    note: "Bounded one-hop re-invoke of dry-walkthrough after a context-limit stumble\
      \ on the primary dry_walkthrough step. Never routes back to dry_walkthrough\
      \ \u2014 on_failure and on_context_limit both fall through to the original failure\
      \ destination."
  create_impl_worktree:
    tool: run_cmd
    with:
      cmd: bash {{AUTOSKILLIT_SCRIPTS}}/create_impl_worktree.sh "impl-${{ context.issue_number
        }}-$(date +%Y%m%d-%H%M%S)" "{{AUTOSKILLIT_TEMP}}"
      cwd: ${{ context.work_dir }}
      step_name: create_impl_worktree
    capture:
      worktree_path: ${{ result.worktree_path }}
      branch_name: ${{ result.branch_name }}
    on_success: implement
    on_failure: release_issue_failure
    note: Creates worktree at orchestrator level (unsandboxed) so .git/ metadata writes
      succeed regardless of backend sandbox constraints.
  implement:
    tool: run_skill
    model: ''
    stale_threshold: 2400
    with:
      skill_command: /autoskillit:implement-worktree-no-merge
      skill_inputs:
        plan_path: ${{ context.plan_path }}
        plan_set_authority_path: ${{ context.plan_set_authority_path }}
      cwd: ${{ context.worktree_path }}
      step_name: implement
      output_dir: .
    capture:
      implementation_ref: ${{ result.worktree_path }}
      worktree_path: ${{ result.worktree_path }}
      branch_name: ${{ result.branch_name }}
      has_implementation_progress: ${{ result.has_implementation_progress }}
    retries: 0
    on_context_limit: retry_worktree
    on_rate_limit: retry_worktree
    on_success: check_changes
    on_failure: release_issue_failure
  retry_worktree:
    tool: run_skill
    model: ''
    stale_threshold: 2400
    with:
      skill_command: /autoskillit:retry-worktree
      skill_inputs:
        plan_path: ${{ context.plan_path }}
        plan_set_authority_path: ${{ context.plan_set_authority_path }}
        worktree_path: ${{ context.worktree_path }}
      cwd: ${{ context.worktree_path }}
      step_name: retry_worktree
      output_dir: .
    capture:
      implementation_ref: ${{ result.worktree_path }}
      worktree_path: ${{ result.worktree_path }}
      branch_name: ${{ result.branch_name }}
      phases_implemented: ${{ result.phases_implemented }}
      has_implementation_progress: ${{ result.has_implementation_progress }}
      deviation_manifest_path:
        from: ${{ result.deviation_manifest_path }}
        type: optional_string
    on_result:
    - when: ${{ result.phases_implemented }} > 0
      route: check_changes
    - route: check_changes
    on_context_limit: check_changes
    on_rate_limit: check_changes
    on_exhausted: release_issue_failure
    on_failure: release_issue_failure
  check_changes:
    tool: run_python
    with:
      step_name: check_changes
      callable: autoskillit.smoke_utils.detect_zero_changes
      worktree_path: ${{ context.implementation_ref }}
      base_branch: ${{ inputs.base_branch }}
      write_evidence_override: ${{ context.has_implementation_progress }}
    capture:
      has_changes: ${{ result.has_changes }}
      commit_count: ${{ result.commit_count }}
    on_result:
    - when: ${{ result.has_changes }} == false
      route: close_issue_no_changes
    - route: test
    on_failure: release_issue_failure
  close_issue_no_changes:
    tool: release_issue
    optional: true
    skip_when_false: inputs.issue_url
    on_skip: register_clone_no_changes
    with:
      step_name: close_issue_no_changes
      issue_url: ${{ inputs.issue_url }}
      target_branch: ${{ inputs.base_branch }}
      close_issue: 'true'
    on_success: register_clone_no_changes
    on_failure: register_clone_no_changes
    note: 'With no implementation changes, stage on non-target branches or close on promotion target; staging takes precedence. Register the clone for cleanup.'
  test:
    tool: test_check
    with:
      step_name: test
      worktree_path: ${{ context.implementation_ref }}
    on_success: audit_impl
    on_failure: check_test_fix_loop
  check_merge_fix_loop:
    tool: run_python
    with:
      step_name: check_merge_fix_loop
      callable: autoskillit.smoke_utils.check_loop_iteration
      current_iteration: ${{ context.merge_fix_count }}
      max_iterations: ${{ inputs.merge_fix_max_retries }}
    capture:
      merge_fix_count: ${{ result.next_iteration }}
    on_result:
    - when: ${{ result.max_exceeded }} == true
      route: release_issue_failure
    - route: diagnose_merge_gate
    on_failure: release_issue_failure
    optional_context_refs:
    - merge_fix_count
    note: 'Merge-failure iteration guard (dirty_tree / test_gate / post_rebase_test_gate).
      Shares merge_fix_count with check_merge_rebase_loop and check_dirty_main_retry.

      '
  diagnose_merge_gate:
    tool: run_python
    with:
      step_name: diagnose_merge_gate
      callable: autoskillit.smoke_utils.diagnose_merge_gate
      test_stdout: ${{ context.merge_test_stdout }}
      test_stderr: ${{ context.merge_test_stderr }}
      output_dir: '{{AUTOSKILLIT_TEMP}}/diagnose-merge-gate'
      work_dir: ${{ context.work_dir }}
      failed_step: ${{ context.merge_failed_step }}
      timed_out: ${{ context.merge_timed_out }}
      outer_timeout_seconds: ${{ context.merge_outer_timeout_seconds }}
      raw_output_artifact_path: ${{ context.merge_raw_output_artifact_path }}
    capture:
      merge_gate_diagnosis_path: ${{ result.diagnosis_path }}
      merge_gate_ci_conclusion: ${{ result.ci_conclusion }}
    on_success: merge_gate_assess
    on_failure: merge_gate_assess
    optional_context_refs:
    - merge_test_stdout
    - merge_test_stderr
    - merge_failed_step
    - merge_timed_out
    - merge_outer_timeout_seconds
    - merge_raw_output_artifact_path
    note: 'Diagnose merge-gate test output for assess. Continue on diagnosis failure; use merge_gate_* keys to avoid CI diagnosis collisions.'
  check_merge_rebase_loop:
    tool: run_python
    with:
      step_name: check_merge_rebase_loop
      callable: autoskillit.smoke_utils.check_loop_iteration
      current_iteration: ${{ context.merge_fix_count }}
      max_iterations: ${{ inputs.merge_fix_max_retries }}
    capture:
      merge_fix_count: ${{ result.next_iteration }}
    on_result:
    - when: ${{ result.max_exceeded }} == true
      route: release_issue_failure
    - route: rebase_conflict_fix
    on_failure: release_issue_failure
    optional_context_refs:
    - merge_fix_count
    note: 'Merge-failure iteration guard for rebase conflicts. Shares merge_fix_count
      with check_merge_fix_loop and check_dirty_main_retry.

      '
  check_dirty_main_retry:
    tool: run_python
    with:
      step_name: check_dirty_main_retry
      callable: autoskillit.smoke_utils.check_loop_iteration
      current_iteration: ${{ context.merge_fix_count }}
      max_iterations: ${{ inputs.merge_fix_max_retries }}
    capture:
      merge_fix_count: ${{ result.next_iteration }}
    on_result:
    - when: ${{ result.max_exceeded }} == true
      route: release_issue_failure
    - route: audit_impl
    on_failure: release_issue_failure
    optional_context_refs:
    - merge_fix_count
    note: 'Merge-failure iteration guard for dirty_main_repo retries. Shares merge_fix_count
      with check_merge_fix_loop and check_merge_rebase_loop.

      '
  check_ref_push_loop:
    tool: run_python
    with:
      step_name: check_ref_push_loop
      callable: autoskillit.smoke_utils.check_loop_iteration
      current_iteration: ${{ context.ref_push_count }}
      max_iterations: '3'
    capture:
      ref_push_count: ${{ result.next_iteration }}
    on_result:
    - when: ${{ result.max_exceeded }} == true
      route: verify_ref_push_exhaustion
    - route: ref_push
    on_failure: release_issue_failure
    optional_context_refs:
    - ref_push_count
    note: 'Use ref_push_count separately from merge_fix_count; at most two pushes. Re-check ancestry on exhaustion before escalation.'
  ref_push:
    tool: push_to_remote
    with:
      step_name: ref_push
      clone_path: ${{ context.work_dir }}
      remote_url: ${{ context.remote_url }}
      branch: ${{ context.merge_target }}
      force: 'true'
    on_success: commit_guard
    on_failure: release_issue_failure
    note: "Pushes the feature branch to remote to resolve ref_coherence divergence.\
      \ After push, routes back to commit_guard \u2192 main_repo_guard \u2192 merge\
      \ to retry the merge with aligned local/remote SHAs.\n"
  check_audit_remediation_loop:
    tool: run_python
    with:
      step_name: check_audit_remediation_loop
      callable: autoskillit.smoke_utils.check_audit_remediation_outcome
      current_authority_path: ${{ context.audit_cycle_path_raw }}
      prior_authority_path: ${{ context.audit_cycle_path }}
      current_iteration: ${{ context.audit_remediation_count }}
      max_iterations: ${{ inputs.audit_remediation_max_retries }}
    capture:
      audit_remediation_count: ${{ result.next_iteration }}
      audit_unresolved_requirement_ids: ${{ result.unresolved_requirement_ids }}
    on_result:
    - when: ${{ result.outcome }} == PROGRESSING
      route: merge_audit_cycle_path
    - when: ${{ result.outcome }} == STUCK_REPEATING
      route: release_audit_remediation_stuck
    - when: ${{ result.outcome }} == EXHAUSTED
      route: release_issue_failure
    - when: ${{ result.outcome }} == AWAITING_DECISION
      route: await_audit_decision
    - when: ${{ result.outcome }} == INTEGRITY_FAULT
      route: check_audit_integrity_retry
    - route: check_audit_integrity_retry
    on_failure: check_audit_integrity_retry
    optional_context_refs:
    - audit_remediation_count
    - audit_cycle_path_raw
    - audit_cycle_path
    note: "Classifies the audit remediation cycle before continuing it. Separate counter\
      \ from merge_fix_count.\n"
  check_audit_integrity_retry:
    tool: run_python
    with:
      step_name: check_audit_integrity_retry
      callable: autoskillit.smoke_utils.check_loop_iteration
      current_iteration: ${{ context.audit_integrity_fault_count }}
      max_iterations: ${{ inputs.audit_integrity_max_retries }}
    capture:
      audit_integrity_fault_count: ${{ result.next_iteration }}
    on_result:
    - when: ${{ result.max_exceeded }} == true
      route: register_clone_failure
    - route: audit_impl
    on_failure: register_clone_failure
    optional_context_refs:
    - audit_integrity_fault_count
    note: Bounded retry path for audit semantic and infrastructure failures.
  reset_test_fix_counter:
    tool: run_python
    with:
      callable: autoskillit.smoke_utils.init_counter
      counter_value: ''
    capture:
      test_fix_loop_count: ${{ result.value }}
    on_success: reset_merge_test_fix_counter
    on_failure: reset_merge_test_fix_counter
    note: Resets test_fix_loop_count to 0 so each audit-remediation cycle gets a fresh
      pre-merge fix budget. Routes to pre_remediation_merge to preserve the worktree-merge
      step before starting a new remediation cycle.
  reset_merge_test_fix_counter:
    tool: run_python
    with:
      callable: autoskillit.smoke_utils.init_counter
      counter_value: ''
    capture:
      merge_test_fix_loop_count: ${{ result.value }}
    on_success: reset_merge_fix_counter
    on_failure: reset_merge_fix_counter
    note: Resets merge_test_fix_loop_count to 0 so each audit-remediation cycle gets
      a fresh merge-gate fix budget.
  reset_merge_fix_counter:
    tool: run_python
    with:
      callable: autoskillit.smoke_utils.init_counter
      counter_value: ''
    capture:
      merge_fix_count: ${{ result.value }}
    on_success: reset_ref_push_counter
    on_failure: reset_ref_push_counter
    note: Resets merge_fix_count to 0 so each audit-remediation cycle gets a fresh
      merge-fix budget (dirty-tree, rebase, dirty-main retries).
  reset_ref_push_counter:
    tool: run_python
    with:
      step_name: reset_ref_push_counter
      callable: autoskillit.smoke_utils.init_counter
      counter_value: ''
    capture:
      pre_remediation_ref_push_count: ${{ result.value }}
    on_success: reset_plan_set_replan_counter
    on_failure: reset_plan_set_replan_counter
    note: 'Reset the early ref-push budget each audit cycle. Final-merge ref_push_count survives because its GO path does not re-enter.'
  reset_plan_set_replan_counter:
    tool: run_python
    with:
      step_name: reset_plan_set_replan_counter
      callable: autoskillit.smoke_utils.init_counter
      counter_value: ''
    capture:
      plan_set_replan_count: ${{ result.value }}
    on_success: reset_pre_remediation_merge_fix_counter
    on_failure: reset_pre_remediation_merge_fix_counter
    note: Resets the coverage-replan budget for each audit-remediation cycle.
  reset_pre_remediation_merge_fix_counter:
    tool: run_python
    with:
      step_name: reset_pre_remediation_merge_fix_counter
      callable: autoskillit.smoke_utils.init_counter
      counter_value: ''
    capture:
      pre_remediation_merge_fix_count: ${{ result.value }}
    on_success: pre_remediation_merge
    on_failure: pre_remediation_merge
    note: 'Reset the early merge-gate budget once per audit cycle, never inside its recovery loop.'
  check_ref_push_loop_pre_remediation:
    tool: run_python
    with:
      step_name: check_ref_push_loop_pre_remediation
      callable: autoskillit.smoke_utils.check_loop_iteration
      current_iteration: ${{ context.pre_remediation_ref_push_count }}
      max_iterations: '3'
    capture:
      pre_remediation_ref_push_count: ${{ result.next_iteration }}
    on_result:
    - when: ${{ result.max_exceeded }} == true
      route: verify_ref_push_exhaustion
    - route: ref_push_pre_remediation
    on_failure: release_issue_failure
    optional_context_refs:
    - pre_remediation_ref_push_count
    note: 'Use a dedicated two-attempt pre-remediation push budget. Exhaustion re-checks remote ancestry before escalation; remaining budget pushes and retries the guarded merge.'
  ref_push_pre_remediation:
    tool: push_to_remote
    with:
      step_name: ref_push_pre_remediation
      clone_path: ${{ context.work_dir }}
      remote_url: ${{ context.remote_url }}
      branch: ${{ context.merge_target }}
      force: 'true'
    on_success: commit_guard_pre_remediation
    on_failure: release_issue_failure
    note: 'Pushes the feature branch when the remote ref is an ancestor of the local
      ref, then retries pre_remediation_merge through its commit guard.

      '
  verify_ref_push_exhaustion:
    tool: run_python
    with:
      step_name: verify_ref_push_exhaustion
      callable: autoskillit.smoke_utils.check_ref_state
      worktree_path: ${{ context.work_dir }}
      branch: ${{ context.merge_target }}
    on_result:
    - when: ${{ result.remote_ref_state }} == absent
      route: register_clone_unconfirmed
    - when: ${{ result.remote_is_ancestor }} == true
      route: register_clone_unconfirmed
    - route: release_issue_failure
    on_failure: release_issue_failure
    note: 'Re-check the exact remote ref before ref-push exhaustion. An absent ref or clean local fast-forward is recoverable and leaves the clone unconfirmed; genuine divergence fails.'
  pre_remediation_merge:
    tool: merge_worktree
    with:
      step_name: pre_remediation_merge
      worktree_path: ${{ context.implementation_ref }}
      base_branch: ${{ context.merge_target }}
    capture:
      cleanup_succeeded: ${{ result.cleanup_succeeded }}
      implementation_ref: ${{ result.worktree_path }}
      pre_remediation_merge_test_stdout: ${{ result.test_stdout }}
      pre_remediation_merge_test_stderr: ${{ result.test_stderr }}
      pre_remediation_merge_failed_step: ${{ result.failed_step }}
      pre_remediation_merge_timed_out:
        from: ${{ result.timed_out }}
        type: optional_string
      pre_remediation_merge_outer_timeout_seconds:
        from: ${{ result.outer_timeout_seconds }}
        type: optional_string
      pre_remediation_merge_raw_output_artifact_path:
        from: ${{ result.raw_output_artifact_path }}
        type: optional_string
    on_result:
    - when: result.failed_step == 'dirty_tree'
      route: commit_guard_pre_remediation
      recovery_waiver: 'Pre-remediation dirty trees are stray artifacts; commit them and retry the merge directly instead of diagnosing.'
    - when: result.failed_step == 'test_gate'
      route: check_merge_fix_loop_pre_remediation
    - when: result.failed_step == 'test_gate_contention'
      route: release_issue_failure
      recovery_waiver: 'Another process owns the worktree test lease; this invocation has no test outcome to diagnose. Stop with the worktree intact.'
    - when: result.failed_step == 'post_rebase_test_gate'
      route: check_merge_fix_loop_pre_remediation
    - when: result.failed_step == 'rebase'
      route: release_issue_failure
      recovery_waiver: 'Pre-remediation rebase conflicts stop with the worktree intact; conflict resolution before remediation is not policy.'
    - when: result.failed_step == 'dirty_main_repo'
      route: main_repo_guard_pre_remediation
    - when: result.failed_step == 'ref_coherence' and result.remote_is_ancestor ==
        true
      route: check_ref_push_loop_pre_remediation
    - when: result.failed_step == 'ref_coherence'
      route: release_issue_failure
    - when: result.failed_step == 'path_validation'
      route: remediate
    - when: result.error
      route: release_issue_failure
    - route: inter_part_push_pre_remediation
    on_failure: release_issue_failure
    note: 'Merge before remediation. Test-gate failures enter the bounded diagnose/fix/test loop. Dirty trees retry via commit guard; contention and rebase stop with the worktree intact. Their recovery_waiver reasons are checked by merge-failure-skill-domain-mismatch. Local-ahead refs use bounded push recovery; genuine divergence stops.'
  inter_part_push_pre_remediation:
    tool: push_to_remote
    with:
      step_name: inter_part_push_pre_remediation
      clone_path: ${{ context.work_dir }}
      remote_url: ${{ context.remote_url }}
      branch: ${{ context.merge_target }}
      force: 'true'
    on_success: remediate
    on_failure: remediate
    note: 'Sync the feature branch after the early merge; route to remediate even if push fails. The next merge''s ref_coherence route handles divergence.'
  commit_guard_pre_remediation:
    tool: run_python
    with:
      step_name: commit_guard_pre_remediation
      callable: autoskillit.recipe._cmd_rpc.commit_guard
      worktree_path: ${{ context.implementation_ref }}
      base_branch: ${{ inputs.base_branch }}
    on_result:
    - when: ${{ result.committed }} == 'regression_detected'
      route: release_issue_failure
    - route: pre_remediation_merge
    on_failure: pre_remediation_merge
  main_repo_guard_pre_remediation:
    tool: run_python
    with:
      step_name: main_repo_guard_pre_remediation
      callable: autoskillit.recipe._cmd_rpc.main_repo_guard
      clone_path: ${{ context.work_dir }}
    on_result:
    - when: ${{ result.cleaned }} == 'failed'
      route: release_issue_failure
    - route: pre_remediation_merge
    on_failure: pre_remediation_merge
  check_merge_fix_loop_pre_remediation:
    tool: run_python
    with:
      step_name: check_merge_fix_loop_pre_remediation
      callable: autoskillit.smoke_utils.check_loop_iteration
      current_iteration: ${{ context.pre_remediation_merge_fix_count }}
      max_iterations: ${{ inputs.merge_fix_max_retries }}
    capture:
      pre_remediation_merge_fix_count: ${{ result.next_iteration }}
    on_result:
    - when: ${{ result.max_exceeded }} == true
      route: release_issue_failure
    - route: diagnose_merge_gate_pre_remediation
    on_failure: release_issue_failure
    optional_context_refs:
    - pre_remediation_merge_fix_count
    note: 'Bound early test_gate and post_rebase_test_gate recovery with its own counter, reset once per audit cycle. Exhaustion releases the issue with the worktree intact.'
  diagnose_merge_gate_pre_remediation:
    tool: run_python
    with:
      step_name: diagnose_merge_gate_pre_remediation
      callable: autoskillit.smoke_utils.diagnose_merge_gate
      test_stdout: ${{ context.pre_remediation_merge_test_stdout }}
      test_stderr: ${{ context.pre_remediation_merge_test_stderr }}
      output_dir: '{{AUTOSKILLIT_TEMP}}/diagnose-merge-gate-pre-remediation'
      work_dir: ${{ context.work_dir }}
      failed_step: ${{ context.pre_remediation_merge_failed_step }}
      timed_out: ${{ context.pre_remediation_merge_timed_out }}
      outer_timeout_seconds: ${{ context.pre_remediation_merge_outer_timeout_seconds }}
      raw_output_artifact_path: ${{ context.pre_remediation_merge_raw_output_artifact_path }}
    capture:
      pre_remediation_merge_gate_diagnosis_path: ${{ result.diagnosis_path }}
      pre_remediation_merge_gate_ci_conclusion: ${{ result.ci_conclusion }}
    on_success: merge_gate_assess_pre_remediation
    on_failure: merge_gate_assess_pre_remediation
    optional_context_refs:
    - pre_remediation_merge_test_stdout
    - pre_remediation_merge_test_stderr
    - pre_remediation_merge_failed_step
    - pre_remediation_merge_timed_out
    - pre_remediation_merge_outer_timeout_seconds
    - pre_remediation_merge_raw_output_artifact_path
    note: 'Diagnoses the current pre_remediation_merge gate failure from that attempt''s own captures. Distinct output dir and context keys from diagnose_merge_gate so early and late merge diagnoses never overwrite each other.'
  merge_gate_assess_pre_remediation:
    tool: run_skill
    model: ''
    with:
      skill_command: /autoskillit:resolve-failures
      skill_inputs:
        base_branch: ${{ inputs.base_branch }}
        diagnosis_path: ${{ context.pre_remediation_merge_gate_diagnosis_path }}
        ci_conclusion: ${{ context.pre_remediation_merge_gate_ci_conclusion }}
        plan_path: ${{ context.plan_path }}
        worktree_path: ${{ context.implementation_ref }}
      cwd: ${{ context.implementation_ref }}
      step_name: merge_gate_assess_pre_remediation
      output_dir: .
    capture:
      verdict: ${{ result.verdict }}
      fixes_applied: ${{ result.fixes_applied }}
      deviation_manifest_path:
        from: ${{ result.deviation_manifest_path }}
        type: optional_string
    on_result:
    - when: ${{ result.verdict }} == 'real_fix'
      route: merge_gate_test_pre_remediation
    - when: ${{ result.verdict }} == 'already_green'
      route: merge_gate_test_pre_remediation
    - when: ${{ result.verdict }} == 'flake_suspected'
      route: merge_gate_test_pre_remediation
    - when: ${{ result.verdict }} == 'ci_only_failure'
      route: merge_gate_test_pre_remediation
    - when: ${{ result.verdict }} == 'no_test_infrastructure'
      route: release_issue_failure
    - route: release_issue_failure
    on_context_limit: merge_gate_test_pre_remediation
    on_rate_limit: merge_gate_test_pre_remediation
    on_failure: release_issue_failure
    on_exhausted: release_issue_failure
    optional_context_refs:
    - pre_remediation_merge_gate_ci_conclusion
    - pre_remediation_merge_gate_diagnosis_path
    note: 'Resolve failures in the retained implementation_ref worktree; every returned verdict is verified by merge_gate_test_pre_remediation before retrying merge.'
  merge_gate_test_pre_remediation:
    tool: test_check
    with:
      worktree_path: ${{ context.implementation_ref }}
      step_name: merge_gate_test_pre_remediation
    on_success: commit_guard_pre_remediation
    on_failure: check_merge_fix_loop_pre_remediation
  assess:
    tool: run_skill
    model: ''
    with:
      skill_command: /autoskillit:resolve-failures
      skill_inputs:
        base_branch: ${{ inputs.base_branch }}
        diagnosis_path: ${{ context.merge_gate_diagnosis_path }}
        ci_conclusion: ${{ context.merge_gate_ci_conclusion }}
        plan_path: ${{ context.plan_path }}
        worktree_path: ${{ context.worktree_path }}
      cwd: ${{ context.worktree_path }}
      step_name: assess
      output_dir: .
    capture:
      verdict: ${{ result.verdict }}
      fixes_applied: ${{ result.fixes_applied }}
      deviation_manifest_path:
        from: ${{ result.deviation_manifest_path }}
        type: optional_string
    on_result:
    - when: ${{ result.verdict }} == 'real_fix'
      route: test
    - when: ${{ result.verdict }} == 'already_green'
      route: test
    - when: ${{ result.verdict }} == 'flake_suspected'
      route: test
    - when: ${{ result.verdict }} == 'ci_only_failure'
      route: test
    - when: ${{ result.verdict }} == 'no_test_infrastructure'
      route: release_issue_failure
    - route: release_issue_failure
    on_context_limit: test
    on_rate_limit: test
    on_failure: release_issue_failure
    on_exhausted: release_issue_failure
    optional_context_refs:
    - merge_gate_ci_conclusion
    - merge_gate_diagnosis_path
  check_test_fix_loop:
    tool: run_python
    with:
      step_name: check_test_fix_loop
      callable: autoskillit.smoke_utils.check_loop_iteration
      current_iteration: ${{ context.test_fix_loop_count }}
      max_iterations: ${{ inputs.test_fix_max_retries }}
    capture:
      test_fix_loop_count: ${{ result.next_iteration }}
    on_result:
    - when: ${{ result.max_exceeded }} == true
      route: release_issue_failure
    - route: assess
    on_failure: release_issue_failure
    optional_context_refs:
    - test_fix_loop_count
    note: "Guards the pre-merge test \u2192 assess \u2192 test cycle. Caps at test_fix_max_retries\
      \ iterations (default 3). Counter increments after test failure, so the last\
      \ fix attempt always gets verified before the budget is exhausted."
  merge_gate_assess:
    tool: run_skill
    model: ''
    with:
      skill_command: /autoskillit:resolve-failures
      skill_inputs:
        base_branch: ${{ inputs.base_branch }}
        diagnosis_path: ${{ context.merge_gate_diagnosis_path }}
        ci_conclusion: ${{ context.merge_gate_ci_conclusion }}
        plan_path: ${{ context.plan_path }}
        worktree_path: ${{ context.worktree_path }}
      cwd: ${{ context.worktree_path }}
      step_name: merge_gate_assess
      output_dir: .
    capture:
      verdict: ${{ result.verdict }}
      fixes_applied: ${{ result.fixes_applied }}
      deviation_manifest_path:
        from: ${{ result.deviation_manifest_path }}
        type: optional_string
    on_result:
    - when: ${{ result.verdict }} == 'real_fix'
      route: merge_gate_test
    - when: ${{ result.verdict }} == 'already_green'
      route: merge_gate_test
    - when: ${{ result.verdict }} == 'flake_suspected'
      route: merge_gate_test
    - when: ${{ result.verdict }} == 'ci_only_failure'
      route: merge_gate_test
    - when: ${{ result.verdict }} == 'no_test_infrastructure'
      route: release_issue_failure
    - route: release_issue_failure
    on_context_limit: merge_gate_test
    on_rate_limit: merge_gate_test
    on_failure: release_issue_failure
    on_exhausted: release_issue_failure
    optional_context_refs:
    - merge_gate_ci_conclusion
    - merge_gate_diagnosis_path
    note: Merge-gate-path variant of assess. Uses a separate counter (merge_test_fix_loop_count)
      so merge-gate retries do not drain the pre-merge test fix budget.
  merge_gate_test:
    tool: test_check
    with:
      worktree_path: ${{ context.implementation_ref }}
      step_name: merge_gate_test
    on_success: audit_impl
    on_failure: check_merge_test_fix_loop
  check_merge_test_fix_loop:
    tool: run_python
    with:
      step_name: check_merge_test_fix_loop
      callable: autoskillit.smoke_utils.check_loop_iteration
      current_iteration: ${{ context.merge_test_fix_loop_count }}
      max_iterations: ${{ inputs.merge_test_fix_max_retries }}
    capture:
      merge_test_fix_loop_count: ${{ result.next_iteration }}
    on_result:
    - when: ${{ result.max_exceeded }} == true
      route: release_issue_failure
    - route: merge_gate_assess
    on_failure: release_issue_failure
    optional_context_refs:
    - merge_test_fix_loop_count
    note: Merge-gate test fix iteration guard. Uses merge_test_fix_loop_count (independent
      of test_fix_loop_count) to prevent merge-gate retries from consuming the pre-merge
      fix budget.
  rebase_conflict_fix:
    tool: run_skill
    model: ''
    with:
      skill_command: /autoskillit:resolve-merge-conflicts
      skill_inputs:
        plan_path: ${{ context.plan_path }}
        base_branch: ${{ inputs.base_branch }}
        worktree_path: ${{ context.worktree_path }}
      cwd: ${{ context.worktree_path }}
      step_name: rebase_conflict_fix
      output_dir: .
    capture:
      conflict_escalation_required: ${{ result.escalation_required }}
    on_result:
    - when: ${{ result.escalation_required }} == true
      route: release_issue_failure
    - route: test
    on_failure: release_issue_failure
    on_context_limit: release_issue_failure
    on_rate_limit: release_issue_failure
    retries: 1
    on_exhausted: release_issue_failure
  audit_impl:
    tool: run_skill
    model: ''
    with:
      skill_command: /autoskillit:audit-impl
      skill_inputs:
        all_plan_paths: ${{ context.plan_parts }}
        deviation_manifest_path: ${{ context.deviation_manifest_path }}
        branch_name: ${{ context.branch_name }}
        base_branch: ${{ inputs.base_branch }}
        prior_audit_cycle_path: ${{ context.audit_cycle_path }}
      cwd: ${{ context.work_dir }}
      step_name: audit_impl
      output_dir: '{{AUTOSKILLIT_TEMP}}/audit-impl'
      retry_after_audit_attempt_id: ${{ context.audit_attempt_id }}
      closure_authority_path: ${{ inputs.closure_authority_path }}
      closure_authority_hash: ${{ inputs.closure_authority_hash }}
      closure_plan_paths: ${{ context.plan_parts }}
      closure_base_sha: ${{ context.branch_name }}
      closure_diff_sha: ''
      closure_target_sha: ''
    capture:
      remediation_path: ${{ result.remediation_path }}
      audit_cycle_path_raw: ${{ result.audit_cycle_path }}
      audit_status: ${{ result.audit_status }}
      audit_verdict: ${{ result.audit_verdict }}
      audit_attempt_id: ${{ result.audit_attempt_id }}
    on_result:
    - when: ${{ result.audit_status }} == SEMANTIC_REJECTED
      route: check_audit_integrity_retry
    - when: ${{ result.audit_status }} == CONFLICT
      route: check_audit_integrity_retry
    - when: ${{ result.audit_status }} == STORAGE_FAILURE
      route: check_audit_integrity_retry
    - when: ${{ result.audit_status }} == QUARANTINED
      route: check_audit_integrity_retry
    - when: ${{ result.audit_status }} == NON_PUBLISHED_STANDALONE
      route: check_audit_integrity_retry
    - when: ${{ result.audit_status }} == PUBLISHED and ${{ result.audit_verdict }}
        == GO
      route: merge_audit_cycle_path
    - when: ${{ result.audit_status }} == EXACT_REPLAY and ${{ result.audit_verdict
        }} == GO
      route: merge_audit_cycle_path
    - when: ${{ result.audit_status }} == PUBLISHED and ${{ result.audit_verdict }}
        == NO GO
      route: check_audit_remediation_loop
    - when: ${{ result.audit_status }} == EXACT_REPLAY and ${{ result.audit_verdict
        }} == NO GO
      route: check_audit_remediation_loop
    - when: result.error
      route: check_audit_integrity_retry
    - route: check_audit_integrity_retry
    on_failure: check_audit_integrity_retry
    on_context_limit: salvage_plan
    on_rate_limit: check_audit_integrity_retry
    optional: true
    skip_when_false: inputs.audit_impl
    on_skip: commit_guard
    optional_context_refs:
    - deviation_manifest_path
    - audit_cycle_path
    - audit_attempt_id
    note: Only run if inputs.audit_impl = true. If inputs.audit_impl = false, skip
      directly to commit_guard.
  merge_audit_cycle_path:
    tool: run_python
    with:
      step_name: merge_audit_cycle_path
      callable: autoskillit.smoke_utils.merge_audit_cycle_path
      current_authority_path: ${{ context.audit_cycle_path_raw }}
      prior_authority_path: ${{ context.audit_cycle_path }}
    capture:
      audit_cycle_path: ${{ result.audit_cycle_path }}
    on_result:
    - when: ${{ context.audit_status }} == PUBLISHED and ${{ context.audit_verdict }} == GO
      route: commit_guard
    - when: ${{ context.audit_status }} == EXACT_REPLAY and ${{ context.audit_verdict }} == GO
      route: commit_guard
    - when: ${{ context.audit_status }} == PUBLISHED and ${{ context.audit_verdict }} == NO GO
      route: reset_test_fix_counter
    - when: ${{ context.audit_status }} == EXACT_REPLAY and ${{ context.audit_verdict }} == NO GO
      route: reset_test_fix_counter
    - route: check_audit_integrity_retry
    on_failure: check_audit_integrity_retry
    optional_context_refs:
    - audit_cycle_path_raw
    - audit_cycle_path
    note: Promotes published audit authority; this is the sole writer of audit_cycle_path.
  remediate:
    action: route
    with:
      audit_cycle_path: ${{ context.audit_cycle_path }}
    on_success: make_plan
  make_plan:
    tool: run_skill
    model: ''
    with:
      skill_command: /autoskillit:make-plan
      skill_inputs:
        adversarial_review_level: ${{ inputs.adversarial_review_level }}
        task: ${{ inputs.task }}
        issue_url: ${{ inputs.issue_url }}
        audit_cycle_path: ${{ context.audit_cycle_path }}
        plan_set_coverage_gaps: ${{ context.plan_set_coverage_gaps }}
      cwd: ${{ context.work_dir }}
      step_name: make_plan
      output_dir: .
    capture:
      plan_path: ${{ result.plan_path }}
      verdict: ${{ result.verdict }}
      plan_disposition_path: ${{ result.plan_disposition_path }}
    capture_list:
      plan_parts: ${{ result.plan_parts }}
    retries: 0
    on_result:
    - when: ${{ result.verdict }} == plan
      route: bind_plan_set
    on_failure: release_issue_failure
    on_rate_limit: release_issue_failure
    on_context_limit: salvage_plan
    note: Consumes the exact current NO GO audit_cycle_path and emits verdict=plan,
      plan_path, and plan_disposition_path. make-plan cannot close the audit lineage.
    optional_context_refs:
    - audit_cycle_path
    - plan_set_coverage_gaps
  salvage_plan:
    tool: run_python
    with:
      step_name: salvage_plan
      callable: autoskillit.recipe._cmd_rpc.verify_plan_artifacts
      plan_parts: ${{ context.plan_parts }}
      audit_cycle_path: ${{ context.audit_cycle_path }}
    capture:
      plan_path: ${{ result.plan_path }}
      plan_disposition_path: ${{ result.plan_disposition_path }}
    capture_list:
      plan_parts: ${{ result.plan_parts }}
    optional_context_refs:
    - audit_cycle_path
    retries: 0
    on_result:
    - when: ${{ result.verdict }} == salvaged
      route: bind_plan_set
    - route: release_issue_failure
    on_failure: release_issue_failure
    note: 'On make_plan context limit, verify plan_parts artifacts on disk. Pass captured context.plan_parts verbatim; salvage continues, otherwise take make_plan''s failure route.'
  commit_guard:
    tool: run_python
    with:
      step_name: commit_guard
      callable: autoskillit.recipe._cmd_rpc.commit_guard
      worktree_path: ${{ context.implementation_ref }}
      base_branch: ${{ inputs.base_branch }}
    on_result:
    - when: ${{ result.committed }} == 'regression_detected'
      route: release_issue_failure
    - route: main_repo_guard
    on_failure: main_repo_guard
    note: 'Commit stray worktree changes left by interrupted skills or hooks before merge, then run main_repo_guard.'
  main_repo_guard:
    tool: run_python
    with:
      step_name: main_repo_guard
      callable: autoskillit.recipe._cmd_rpc.main_repo_guard
      clone_path: ${{ context.work_dir }}
    on_result:
    - when: ${{ result.cleaned }} == 'failed'
      route: release_issue_failure
    - route: merge
    on_failure: merge
    note: 'Stash stray main-repo changes before merging; retry even on guard failure so merge detects persistent dirt.'
  merge:
    tool: merge_worktree
    with:
      step_name: merge
      worktree_path: ${{ context.implementation_ref }}
      base_branch: ${{ context.merge_target }}
    capture:
      cleanup_succeeded: ${{ result.cleanup_succeeded }}
      worktree_path: ${{ result.worktree_path }}
      merge_test_stdout: ${{ result.test_stdout }}
      merge_test_stderr: ${{ result.test_stderr }}
      merge_failed_step: ${{ result.failed_step }}
      merge_timed_out:
        from: ${{ result.timed_out }}
        type: optional_string
      merge_outer_timeout_seconds:
        from: ${{ result.outer_timeout_seconds }}
        type: optional_string
      merge_raw_output_artifact_path:
        from: ${{ result.raw_output_artifact_path }}
        type: optional_string
    on_result:
    - when: result.failed_step == 'dirty_tree'
      route: check_merge_fix_loop
    - when: result.failed_step == 'test_gate'
      route: check_merge_fix_loop
    - when: result.failed_step == 'test_gate_contention'
      route: check_merge_fix_loop
    - when: result.failed_step == 'post_rebase_test_gate'
      route: check_merge_fix_loop
    - when: result.failed_step == 'rebase'
      route: check_merge_rebase_loop
    - when: result.failed_step == 'dirty_main_repo'
      route: check_dirty_main_retry
    - when: result.failed_step == 'ref_coherence' and result.remote_is_ancestor ==
        true
      route: check_ref_push_loop
    - when: result.failed_step == 'ref_coherence'
      route: release_issue_failure
    - when: result.error
      route: release_issue_failure
    - route: inter_part_push
    on_failure: release_issue_failure
    note: 'After merge, route to inter_part_push to sync the remote branch, then next_or_done
      to process remaining parts before pushing. Local-ahead ref_coherence mismatches
      use bounded push recovery; genuine divergence or indeterminate ancestry escalates.

      '
  inter_part_push:
    tool: push_to_remote
    with:
      clone_path: ${{ context.work_dir }}
      remote_url: ${{ context.remote_url }}
      branch: ${{ context.merge_target }}
      force: 'true'
    on_success: next_or_done
    on_failure: next_or_done
    note: 'Sync the feature branch after each part merge. Push failure is nonfatal; the next merge handles ref_coherence divergence.'
  next_or_done:
    action: route
    on_result:
    - when: ${{ result.next }} == more_parts
      route: dry_walkthrough
    - route: check_has_commits
    note: 'Route more plan parts to dry_walkthrough. When all parts are complete, check for commits before push; this recipe already audited before the merge.'
  check_has_commits:
    tool: run_python
    with:
      step_name: check_has_commits
      callable: autoskillit.smoke_utils.check_commits_ahead
      cwd: ${{ context.work_dir }}
      base_branch: ${{ inputs.base_branch }}
    on_result:
    - when: ${{ result.has_commits }}
      route: push
    - route: close_issue_already_done
    on_failure: release_issue_failure
  close_issue_already_done:
    tool: run_python
    optional: true
    skip_when_false: inputs.issue_url
    on_skip: register_clone_already_done
    with:
      step_name: close_issue_already_done
      callable: autoskillit.smoke_utils.close_issue_already_done
      issue_url: ${{ inputs.issue_url }}
    on_success: register_clone_already_done
    on_failure: register_clone_already_done
    note: 'Zero commits ahead of base means the feature is already merged. Remove
      in-progress label, close issue with "already implemented" comment, and route
      to clone cleanup with distinct terminal.

      '
  push:
    tool: push_to_remote
    with:
      step_name: push
      clone_path: ${{ context.work_dir }}
      remote_url: ${{ context.remote_url }}
      branch: ${{ context.merge_target }}
      force: 'true'
    on_success: prepare_pr
    on_failure: release_issue_failure
    note: 'Push merge_target from the clone using its captured remote_url. open_pr=false targets base_branch and skips PR creation; push failure releases the issue.'
  prepare_pr:
    tool: run_skill
    model: ''
    retries: 1
    with:
      skill_command: /autoskillit:prepare-pr
      skill_inputs:
        arch_lenses: ${{ inputs.arch_lenses }}
        plan_paths: ${{ context.plan_parts }}
        closing_issue: ${{ context.issue_number }}
        base_branch: ${{ inputs.base_branch }}
        run_name: ${{ inputs.run_name }}
      cwd: ${{ context.work_dir }}
      output_dir: .
      step_name: prepare_pr
    capture:
      prep_path: ${{ result.prep_path }}
      selected_lenses: ${{ result.selected_lenses }}
      lens_context_paths: ${{ result.lens_context_paths }}
    on_result:
    - when: ${{ result.prep_path }} and ${{ inputs.arch_lenses }} == 'true'
      route: run_arch_lenses
    - when: ${{ result.prep_path }}
      route: compose_pr
    - route: release_issue_failure
    on_failure: release_issue_failure
    on_context_limit: release_issue_failure
    on_rate_limit: release_issue_failure
    on_exhausted: release_issue_failure
    optional: true
    skip_when_false: inputs.open_pr
    on_skip: release_issue_success
    optional_context_refs:
    - issue_number
    note: "Reads plan, runs git diff, classifies changed files, selects 1\u20133 arch-lens\
      \ slugs, writes one PR context file per lens, and writes a PR prep file. Does\
      \ NOT invoke arch-lens skills.\n"
  run_arch_lenses:
    tool: run_skill
    model: ''
    with:
      skill_command: /autoskillit:arch-lens-{slug}
      skill_inputs:
        context_path: '{context_path}'
      cwd: ${{ context.work_dir }}
      step_name: run_arch_lenses
    capture_list:
      all_diagram_paths: ${{ result.diagram_path }}
    retries: 0
    on_success: compose_pr
    on_failure: compose_pr
    on_context_limit: compose_pr
    on_rate_limit: compose_pr
    optional: true
    skip_when_false: inputs.open_pr
    on_skip: release_issue_success
    note: 'Pair selected_lenses with lens_context_paths in order. Run the selected arch-lens skills in parallel, capture each diagram_path, and continue to compose_pr when any lens fails.'
  compose_pr:
    tool: run_skill
    model: ''
    with:
      skill_command: /autoskillit:compose-pr
      skill_inputs:
        work_dir: ${{ context.work_dir }}
        closing_issue: ${{ context.issue_number }}
        all_diagram_paths: ${{ context.all_diagram_paths }}
        base_branch: ${{ inputs.base_branch }}
        prep_path: ${{ context.prep_path }}
      cwd: ${{ context.work_dir }}
      output_dir: '{{AUTOSKILLIT_TEMP}}/compose-pr'
      step_name: compose_pr
    capture:
      pr_url:
        from: ${{ result.pr_url }}
        type: optional_string
    on_result:
    - when: ${{ result.pr_url }}
      route: guard_pr_url
    - route: release_issue_failure
    on_failure: release_issue_failure
    on_context_limit: release_issue_failure
    on_rate_limit: release_issue_failure
    optional: true
    skip_when_false: inputs.open_pr
    on_skip: release_issue_success
    optional_context_refs:
    - all_diagram_paths
    - issue_number
    note: "Reads the PR prep file, validates arch-lens diagrams (must contain \u2605\
      \ or \u25CF), composes the PR body, and runs gh pr create. Degrades gracefully\
      \ if gh is unavailable (emits pr_url=).\n"
  guard_pr_url:
    action: route
    on_result:
    - when: ${{ context.pr_url }}
      route: extract_pr_number
    - route: release_issue_failure
    note: "Guard \u2014 skip PR extraction if pr_url is empty (graceful degradation\
      \ from compose_pr)."
  extract_pr_number:
    tool: run_cmd
    with:
      cmd: gh pr view '${{ context.merge_target }}' --json number -q .number
      cwd: ${{ context.work_dir }}
      step_name: extract_pr_number
    capture:
      pr_number: ${{ result.stdout | trim }}
    on_success: capture_review_repository
    on_failure: release_issue_failure
    optional: true
    skip_when_false: inputs.open_pr
    on_skip: release_issue_success
    note: 'Extracts the integer PR number from the feature branch opened by compose_pr.
      pr_number is required by the queue finale steps (enable_auto_merge, wait_for_queue).

      '
  capture_review_repository:
    tool: run_cmd
    with:
      cmd: gh repo view --json nameWithOwner -q '.nameWithOwner | ascii_downcase'
      cwd: ${{ context.work_dir }}
      step_name: capture_review_repository
    capture:
      review_repository: ${{ result.stdout | trim }}
    on_success: init_review_loop_count
    on_failure: release_issue_failure
  init_review_loop_count:
    tool: run_python
    with:
      callable: autoskillit.smoke_utils.init_counter
      counter_value: ${{ context.review_loop_count }}
      step_name: init_review_loop_count
    capture:
      review_loop_count: ${{ result.value }}
    on_success: clear_review_annotation_context
    on_failure: release_issue_failure
    optional_context_refs:
    - review_loop_count
  clear_review_annotation_context:
    tool: run_python
    with:
      callable: autoskillit.smoke_utils.clear_review_annotation_context
    capture:
      annotated_diff_path: ${{ result.annotated_diff_path }}
      hunk_ranges_path: ${{ result.hunk_ranges_path }}
      valid_lines_path: ${{ result.valid_lines_path }}
      anchor_authority_path: ${{ result.anchor_authority_path }}
      diff_metrics_path: ${{ result.diff_metrics_path }}
      review_mode: ${{ result.review_mode }}
      pr_head_sha: ${{ result.pr_head_sha }}
    on_success: annotate_pr_diff
    on_failure: annotate_pr_diff
    note: 'Invalidates every previously captured annotation path before the next publication
      attempt, so a failed retry cannot reuse an older authority.

      '
  annotate_pr_diff:
    tool: run_python
    with:
      step_name: annotate_pr_diff
      callable: autoskillit.smoke_utils.annotate_pr_diff
      pr_number: ${{ context.pr_number }}
      cwd: ${{ context.work_dir }}
      output_dir: '{{AUTOSKILLIT_TEMP}}/review-pr/iter_${{ context.review_loop_count
        }}'
      base_branch: ${{ inputs.base_branch }}
      local_review_rounds: ${{ inputs.local_review_rounds }}
      current_iteration: ${{ context.review_loop_count }}
      work_dir: ${{ context.work_dir }}
    capture:
      annotated_diff_path: ${{ result.annotated_diff_path }}
      hunk_ranges_path: ${{ result.hunk_ranges_path }}
      valid_lines_path: ${{ result.valid_lines_path }}
      anchor_authority_path: ${{ result.anchor_authority_path }}
      diff_metrics_path: ${{ result.diff_metrics_path }}
      review_mode: ${{ result.review_mode }}
      pr_head_sha: ${{ result.pr_head_sha }}
    on_success: review_pr
    on_failure: release_issue_failure
    optional: true
    skip_when_false: inputs.open_pr
    on_skip: release_issue_success
    optional_context_refs:
    - review_loop_count
    note: 'Pre-computes annotated diff with [LNNN] markers and hunk ranges JSON for
      review-pr. Routes to release_issue_failure on annotation failure.
      Missing authority permits no inline comments.

      '
  review_pr:
    tool: run_skill
    model: ''
    with:
      skill_command: /autoskillit:review-pr
      skill_inputs:
        feature_branch: "${{ context.merge_target }}"
        base_branch: "${{ inputs.base_branch }}"
        annotated_diff_path: "${{ context.annotated_diff_path }}"
        hunk_ranges_path: "${{ context.hunk_ranges_path }}"
        valid_lines_path: "${{ context.valid_lines_path }}"
        anchor_authority_path: "${{ context.anchor_authority_path }}"
        diff_metrics_path: "${{ context.diff_metrics_path }}"
        mode: "${{ context.review_mode }}"
        repository: "${{ context.review_repository }}"
        pr_number: "${{ context.pr_number }}"
        pr_head_sha: "${{ context.pr_head_sha }}"
        logical_iteration: "review-pr:${{ context.review_loop_count }}"
        receipt_path: "{{AUTOSKILLIT_TEMP}}/review-pr/iter_${{ context.review_loop_count }}/batch_review_response_${{ context.pr_number }}.json"
      cwd: ${{ context.work_dir }}
      step_name: review_pr
      output_dir: '{{AUTOSKILLIT_TEMP}}/review-pr/iter_${{ context.review_loop_count
        }}'
    capture:
      review_verdict: ${{ result.verdict }}
      review_operation_key: ${{ result.review_operation_key }}
      review_head_sha: ${{ result.review_head_sha }}
      review_post_state: ${{ result.review_post_state }}
      review_receipt_path: ${{ result.review_receipt_path }}
    pass_through: [review_post_state]
    on_result:
    - when: ${{ result.verdict }} == stale_snapshot
      route: check_review_loop
    - when: ${{ result.verdict }} == changes_requested
      route: resolve_review
    - when: ${{ result.verdict }} == approved_with_comments
      route: resolve_review
    - when: ${{ result.verdict }} == needs_human
      route: check_review_posted
    - when: ${{ result.verdict }} == approved
      route: check_review_posted
    - route: check_review_posted
    on_failure: release_issue_failure
    on_context_limit: release_issue_failure
    on_rate_limit: release_issue_failure
    optional: true
    skip_when_false: inputs.open_pr
    on_skip: release_issue_success
    optional_context_refs:
    - review_mode
    note: 'Review the feature PR. Changes requested or approved with comments enter resolve_review; other verdicts verify the posted effect. Failure or context limit releases the issue. Skip without a PR.'
  resolve_review:
    tool: run_skill
    model: ''
    with:
      skill_command: /autoskillit:resolve-review
      skill_inputs:
        base_branch: "${{ inputs.base_branch }}"
        feature_branch: "${{ context.merge_target }}"
        mode: "${{ context.review_mode }}"
        repository: "${{ context.review_repository }}"
        pr_number: "${{ context.pr_number }}"
        pr_head_sha: "${{ context.pr_head_sha }}"
        anchor_authority_path: "${{ context.anchor_authority_path }}"
        logical_iteration: "resolve-review:${{ context.review_loop_count }}"
        receipt_path: "{{AUTOSKILLIT_TEMP}}/resolve-review/iter_${{ context.review_loop_count }}/batch_review_response_${{ context.pr_number }}.json"
      cwd: ${{ context.work_dir }}
      output_dir: .
      step_name: resolve_review
    capture:
      verdict: ${{ result.verdict }}
      review_fixes_applied: ${{ result.fixes_applied }}
      resolve_review_operation_key: ${{ result.review_operation_key }}
      resolve_review_head_sha: ${{ result.review_head_sha }}
      resolve_review_post_state: ${{ result.review_post_state }}
      resolve_review_receipt_path: ${{ result.review_receipt_path }}
    pass_through: [review_post_state]
    retries: 2
    on_exhausted: release_issue_failure
    on_context_limit: release_issue_failure
    on_rate_limit: release_issue_failure
    on_result:
    - when: ${{ result.review_post_state }} == 'SUCCEEDED'
      route: check_resolve_review_posted
    - when: ${{ result.review_post_state }} == 'RECONCILED'
      route: check_resolve_review_posted
    - when: ${{ result.verdict }} == 'real_fix'
      route: pre_review_rebase
    - when: ${{ result.verdict }} == 'already_green'
      route: pre_review_rebase
    - when: ${{ result.verdict }} == 'flake_suspected'
      route: pre_review_rebase
    - when: ${{ result.verdict }} == 'ci_only_failure'
      route: pre_review_rebase
    - when: ${{ result.review_status }} == 'no_pr'
      route: release_issue_failure
    - when: ${{ result.review_status }} == 'processed'
      route: release_issue_failure
    - route: release_issue_failure
    on_failure: release_issue_failure
    note: 'With the feature branch checked out in the clone, fetch review comments, fix actionable critical/warning findings, and commit each via commit_files.'
    optional_context_refs:
    - review_mode
  check_resolve_review_posted:
    tool: verify_review_receipt
    with:
      cwd: ${{ context.work_dir }}
      receipt_path: ${{ context.resolve_review_receipt_path }}
      mode: github
      repository: ${{ context.review_repository }}
      pr_number: ${{ context.pr_number }}
      head_sha: ${{ context.pr_head_sha }}
      logical_iteration: resolve-review:${{ context.review_loop_count }}
      post_state: ${{ context.resolve_review_post_state }}
      step_name: check_resolve_review_posted
    on_result:
    - when: ${{ result.reviews_posted }} == 'true'
      route: pre_review_rebase
    - route: release_issue_failure
    on_failure: release_issue_failure
    optional_context_refs:
    - review_loop_count
  pre_review_rebase:
    tool: run_python
    with:
      step_name: pre_review_rebase
      callable: autoskillit.recipe._cmd_rpc.review_path_rebase
      args:
        work_dir: ${{ context.work_dir }}
        base_branch: ${{ inputs.base_branch }}
    on_result:
    - when: ${{ result.status }} == clean
      route: re_push_review
    - route: resolve_pre_review_conflicts
    on_failure: resolve_pre_review_conflicts
  resolve_pre_review_conflicts:
    tool: run_skill
    model: ''
    with:
      skill_command: /autoskillit:resolve-merge-conflicts
      skill_inputs:
        plan_path: ${{ context.plan_path }}
        base_branch: ${{ inputs.base_branch }}
        worktree_path: ${{ context.work_dir }}
      cwd: ${{ context.work_dir }}
      output_dir: .
      step_name: resolve_pre_review_conflicts
    capture:
      conflict_escalation_required: ${{ result.escalation_required }}
    on_result:
    - when: ${{ result.escalation_required }} == true
      route: release_issue_failure
    - route: re_push_review
    on_failure: release_issue_failure
    on_context_limit: release_issue_failure
    on_rate_limit: release_issue_failure
    retries: 1
    on_exhausted: release_issue_failure
  re_push_review:
    tool: push_to_remote
    with:
      step_name: re_push_review
      clone_path: ${{ context.work_dir }}
      remote_url: ${{ context.remote_url }}
      branch: ${{ context.merge_target }}
      force: 'true'
    on_success: check_review_posted
    on_failure: release_issue_failure
    note: 'Push committed review fixes, then verify the posted effect; failure releases the issue.'
  check_review_posted:
    tool: verify_review_receipt
    with:
      cwd: ${{ context.work_dir }}
      receipt_path: ${{ context.review_receipt_path }}
      mode: ${{ context.review_mode }}
      repository: ${{ context.review_repository }}
      pr_number: ${{ context.pr_number }}
      head_sha: ${{ context.pr_head_sha }}
      logical_iteration: review-pr:${{ context.review_loop_count }}
      post_state: ${{ context.review_post_state }}
      step_name: check_review_posted
    on_result:
    - when: ${{ result.reviews_posted }} == 'false'
      route: release_issue_failure
    - when: ${{ result.reviews_posted }} == 'true'
      route: check_review_loop
    - route: release_issue_failure
    on_failure: release_issue_failure
    optional_context_refs:
    - review_loop_count
    - review_mode
  check_review_loop:
    tool: run_python
    with:
      step_name: check_review_loop
      callable: autoskillit.smoke_utils.check_review_loop
      pr_number: ${{ context.pr_number }}
      current_iteration: ${{ context.review_loop_count }}
      max_iterations: ${{ inputs.review_max_retries }}
      previous_verdict: ${{ context.review_verdict }}
      local_review_rounds: ${{ inputs.local_review_rounds }}
    capture:
      review_loop_count: ${{ result.next_iteration }}
    on_result:
    - when: ${{ context.review_verdict }} == stale_snapshot and ${{ result.max_exceeded
        }} == true
      route: release_issue_failure
    - when: ${{ result.had_blocking }} == true and ${{ result.max_exceeded }} == false
      route: pre_review_cleanup
    - route: check_repo_ci_event
    on_failure: check_repo_ci_event
    optional_context_refs:
    - review_loop_count
    - review_verdict
    note: 'Repeat review only while had_blocking=true and budget remains. Approved-with-comments resolves once; needs_human proceeds without another review round.'
  pre_review_cleanup:
    tool: run_python
    with:
      callable: autoskillit.smoke_utils.pre_iteration_cleanup
      output_dir: '{{AUTOSKILLIT_TEMP}}/review-pr/iter_${{ context.review_loop_count
        }}'
      work_dir: ${{ context.work_dir }}
    on_success: clear_review_annotation_context
    on_failure: clear_review_annotation_context
    optional_context_refs:
    - review_loop_count
  check_repo_ci_event:
    tool: check_repo_merge_state
    with:
      branch: ${{ context.merge_target }}
      cwd: ${{ context.work_dir }}
      remote_url: ${{ context.remote_url }}
      step_name: check_repo_ci_event
      base_branch: ${{ inputs.base_branch }}
    capture:
      ci_event: ${{ result.ci_event }}
      ci_applicable: ${{ result.ci_applicable }}
    on_success: route_ci_applicable
    on_failure: ci_watch
    skip_when_false: inputs.open_pr
    on_skip: release_issue_success
    note: 'Derive ci_event against the feature branch, not base_branch. On failure, ci_watch proceeds with a match-any event.'
  route_ci_applicable:
    action: route
    on_result:
    - when: ${{ context.ci_applicable }} == false
      route: check_repo_merge_state
    - route: check_pr_state
    skip_when_false: inputs.open_pr
    on_skip: release_issue_success
    note: 'Skip CI waiting when neither push nor pull_request workflows match the feature/base branch pair.'
  check_pr_state:
    tool: check_pr_mergeable
    with:
      step_name: check_pr_state
      pr_number: ${{ context.pr_number }}
      cwd: ${{ context.work_dir }}
    on_result:
    - when: ${{ result.mergeable_status }} == 'CONFLICTING'
      route: ci_conflict_fix
    - route: ci_watch
    on_failure: ci_watch
    skip_when_false: inputs.open_pr
    on_skip: release_issue_success
    note: 'Check mergeability before CI polling. A conflicting PR enters conflict repair because it cannot produce a pull_request merge ref; other states continue to ci_watch.'
  ci_watch:
    tool: wait_for_ci
    with:
      step_name: ci_watch
      branch: ${{ context.merge_target }}
      event: ${{ context.ci_event }}
      timeout_seconds: 600
      cwd: ${{ context.work_dir }}
      remote_url: ${{ context.remote_url }}
      auto_trigger: true
    capture:
      ci_conclusion: ${{ result.conclusion }}
      ci_failed_jobs: ${{ result.failed_jobs }}
    on_result:
    - when: ${{ result.conclusion }} == 'success'
      route: check_repo_merge_state
    - when: ${{ result.conclusion }} == 'no_runs'
      route: handle_no_ci_runs
    - when: ${{ result.conclusion }} == 'timed_out'
      route: check_ci_timed_out_loop
    - route: detect_ci_conflict
    on_failure: detect_ci_conflict
    optional: true
    skip_when_false: inputs.open_pr
    on_skip: release_issue_success
    note: 'Wait for CI on the feature branch and capture its conclusion and failed jobs. Success checks merge state; missing runs trigger the no-CI path; timeout uses a bounded retry; failure classifies conflicts. Skipped when open_pr=false.'
  check_ci_timed_out_loop:
    tool: run_python
    with:
      step_name: check_ci_timed_out_loop
      callable: autoskillit.smoke_utils.check_loop_iteration
      current_iteration: ${{ context.ci_timed_out_loop_count }}
      max_iterations: '2'
    capture:
      ci_timed_out_loop_count: ${{ result.next_iteration }}
    on_result:
    - when: ${{ result.max_exceeded }} == true
      route: detect_ci_conflict
    - route: ci_watch
    on_failure: detect_ci_conflict
    optional_context_refs:
    - ci_timed_out_loop_count
    note: 'Caps the ci_watch re-poll loop at 2 iterations. After 2 timed_out results
      (1200s total), routes to detect_ci_conflict instead of spinning indefinitely.

      '
  handle_no_ci_runs:
    tool: check_repo_merge_state
    with:
      branch: ${{ context.merge_target }}
      cwd: ${{ context.work_dir }}
      remote_url: ${{ context.remote_url }}
      step_name: handle_no_ci_runs
      base_branch: ${{ inputs.base_branch }}
    capture:
      ci_event: ${{ result.ci_event }}
      ci_applicable: ${{ result.ci_applicable }}
    on_success: check_ci_loop
    on_failure: release_issue_failure
    retries: 1
    on_exhausted: release_issue_failure
    note: 'Re-derive ci_event from repository state, then retry ci_watch through its iteration guard.'
  check_ci_loop:
    tool: run_python
    with:
      callable: autoskillit.smoke_utils.check_loop_iteration
      current_iteration: ${{ context.ci_loop_count }}
      max_iterations: '2'
    capture:
      ci_loop_count: ${{ result.next_iteration }}
    on_result:
    - when: ${{ result.max_exceeded }} == true
      route: check_active_trigger_loop
    - route: ci_watch
    on_failure: check_ci_already_passed
    optional_context_refs:
    - ci_loop_count
    note: 'Allow one ci_watch retry after re-deriving ci_event. Then permit at most one active CI trigger before escalation.'
  check_active_trigger_loop:
    tool: run_python
    with:
      callable: autoskillit.smoke_utils.check_loop_iteration
      current_iteration: ${{ context.active_trigger_count }}
      max_iterations: '2'
    capture:
      active_trigger_count: ${{ result.next_iteration }}
    on_result:
    - when: ${{ result.max_exceeded }} == true
      route: check_ci_already_passed
    - route: trigger_ci_actively
    on_failure: check_ci_already_passed
    optional_context_refs:
    - active_trigger_count
    note: 'Bounds the trigger_ci_actively remediation to a single attempt. If ci_watch
      still returns no_runs after the active trigger, escalates to escalate_stop_no_ci
      rather than re-triggering indefinitely.

      '
  trigger_ci_actively:
    tool: run_cmd
    with:
      cmd: gh pr close ${{ context.pr_number }} && sleep 2 && gh pr reopen ${{ context.pr_number
        }}
      cwd: ${{ context.work_dir }}
      step_name: trigger_ci_actively
    on_success: ci_watch
    on_failure: check_ci_already_passed
    retries: 1
    on_exhausted: check_ci_already_passed
    note: 'Close and reopen the PR once to recreate the pull_request event and refs/pull/N/merge, then recheck CI; persistent no_runs escalates.'
  check_ci_already_passed:
    tool: wait_for_ci
    with:
      step_name: check_ci_already_passed
      branch: ${{ context.merge_target }}
      event: ${{ context.ci_event }}
      timeout_seconds: 30
      cwd: ${{ context.work_dir }}
      remote_url: ${{ context.remote_url }}
      auto_trigger: true
    skip_when_false: inputs.open_pr
    on_skip: release_issue_success
    on_result:
    - when: ${{ result.conclusion }} == success
      route: check_repo_merge_state
    - when: ${{ result.conclusion }} == failure
      route: detect_ci_conflict
    - when: ${{ result.conclusion }} == timed_out
      route: ci_watch
    - route: mark_issue_failed_no_ci
    on_failure: mark_issue_failed_no_ci
    note: 'Re-poll CI for 30 seconds before escalation. Success advances, failure repairs conflicts, timeout re-polls, and no_runs escalates.'
  mark_issue_failed_no_ci:
    tool: release_issue
    optional: true
    skip_when_false: inputs.issue_url
    on_skip: register_clone_no_ci
    with:
      issue_url: ${{ inputs.issue_url }}
      fail_label: fail
    on_success: register_clone_no_ci
    on_failure: register_clone_no_ci
  register_clone_no_ci:
    tool: register_clone_status
    with:
      clone_path: ${{ context.work_dir }}
      status: error
      step_name: register_clone_no_ci
    on_success: analyze_pipeline_health_no_ci
    on_failure: analyze_pipeline_health_no_ci
  analyze_pipeline_health_no_ci:
    tool: run_skill
    model: ''
    stale_threshold: 2400
    optional: true
    skip_when_false: inputs.pipeline_health
    on_skip: escalate_stop_no_ci
    with:
      skill_command: /autoskillit:analyze-pipeline-health
      skill_inputs:
        kitchen_id: ${{ inputs.kitchen_id }}
        dispatch_id: ${{ inputs.dispatch_id }}
        diagnostics_log_dir: ${{ inputs.diagnostics_log_dir }}
      cwd: ${{ context.work_dir }}
      step_name: analyze_pipeline_health
    on_success: escalate_stop_no_ci
    on_failure: escalate_stop_no_ci
    on_context_limit: escalate_stop_no_ci
    on_rate_limit: escalate_stop_no_ci
    note: 'Execute this diagnostic step. Failures are logged but do not alter pipeline
      routing.

      '
  escalate_stop_no_ci:
    action: stop
    message: >-
      CI safety net: statusCheckRollup returned no checks for the pull request.
      This typically means no workflow is configured for the branch pattern.
      Check workflow trigger configuration. CI never started. Emit the L3 failure
      sentinel using the exact available tool evidence.
  check_repo_merge_state:
    tool: check_repo_merge_state
    block: pre_queue_gate
    with:
      branch: ${{ inputs.base_branch }}
      cwd: ${{ context.work_dir }}
      remote_url: ${{ context.remote_url }}
      step_name: check_repo_merge_state
      base_branch: ${{ inputs.base_branch }}
    capture:
      queue_available: ${{ result.queue_available }}
      merge_group_trigger: ${{ result.merge_group_trigger }}
      auto_merge_available: ${{ result.auto_merge_available }}
      ci_event: ${{ result.ci_event }}
      ci_applicable: ${{ result.ci_applicable }}
    on_success: route_queue_mode
    on_failure: immediate_merge
    skip_when_false: inputs.open_pr
    on_skip: release_issue_success
    note: 'One GraphQL call captures queue, auto-merge, merge-group trigger, and CI event state. Failure falls back to immediate_merge; skip without a PR.'
  route_queue_mode:
    block: pre_queue_gate
    action: route
    on_result:
    - when: ${{ inputs.auto_merge }} != 'true'
      route: patch_token_summary
    - when: ${{ context.queue_available }} == true and ${{ context.merge_group_trigger
        }} == true
      route: enqueue_to_queue
    - when: ${{ context.auto_merge_available }} == true
      route: direct_merge
    - route: immediate_merge
    skip_when_false: inputs.open_pr
    on_skip: release_issue_success
  enqueue_to_queue:
    tool: enqueue_pr
    with:
      step_name: enqueue_to_queue
      pr_number: ${{ context.pr_number }}
      target_branch: ${{ inputs.base_branch }}
      cwd: ${{ context.work_dir }}
      auto_merge_available: ${{ context.auto_merge_available }}
    on_success: wait_for_queue
    on_failure: verify_queue_enrollment
    skip_when_false: inputs.open_pr
    on_skip: release_issue_success
    note: 'Enroll via the strategy selected by enqueue_pr. On failure, probe whether the PR merged or remained queued.'
  verify_queue_enrollment:
    tool: wait_for_merge_queue
    with:
      step_name: verify_queue_enrollment
      pr_number: ${{ context.pr_number }}
      target_branch: ${{ inputs.base_branch }}
      cwd: ${{ context.work_dir }}
      remote_url: ${{ context.remote_url }}
      auto_merge_available: ${{ context.auto_merge_available }}
      timeout_seconds: 60
      poll_interval: 10
      max_merge_group_drops: 1
    on_result:
    - when: ${{ result.pr_state }} == merged
      route: release_issue_success
    - when: ${{ result.pr_state }} == ejected_ci_failure
      route: diagnose_ci
    - when: ${{ result.pr_state }} == not_enrolled
      route: release_issue_failure
    - when: ${{ result.pr_state }} == dropped_healthy
      route: wait_for_queue
    - when: ${{ result.pr_state }} == dropped_merge_group_ci
      route: diagnose_ci
    - when: ${{ result.pr_state }} == ejected
      route: wait_for_queue
    - when: ${{ result.pr_state }} == stalled
      route: wait_for_queue
    - when: ${{ result.pr_state }} == timeout
      route: register_clone_unconfirmed
    - route: register_clone_unconfirmed
    on_failure: register_clone_unconfirmed
    note: 'Probe queue enrollment for 60 seconds after enqueue failure. A merge succeeds, CI ejection diagnoses CI, missing enrollment fails, and active states enter the full queue watch. Timeout or unknown state leaves the clone unconfirmed.'
  wait_for_queue:
    tool: wait_for_merge_queue
    with:
      step_name: wait_for_queue
      pr_number: ${{ context.pr_number }}
      target_branch: ${{ inputs.base_branch }}
      timeout_seconds: 900
      cwd: ${{ context.work_dir }}
      remote_url: ${{ context.remote_url }}
      auto_merge_available: ${{ context.auto_merge_available }}
      max_merge_group_drops: 1
    capture:
      queue_pr_state: ${{ result.pr_state }}
    on_result:
    - when: ${{ result.pr_state }} == merged
      route: release_issue_success
    - when: ${{ result.pr_state }} == ejected_ci_failure
      route: diagnose_ci
    - when: ${{ result.pr_state }} == dropped_merge_group_ci
      route: check_dropped_ci_loop
    - when: ${{ result.pr_state }} == not_enrolled
      route: release_issue_failure
    - when: ${{ result.pr_state }} == dropped_healthy
      route: check_dropped_healthy_loop
    - when: ${{ result.pr_state }} == ejected
      route: check_eject_limit
    - when: ${{ result.pr_state }} == stalled
      route: reenroll_stalled_pr
    - when: ${{ result.pr_state }} == timeout
      route: register_clone_unconfirmed
    - route: register_clone_unconfirmed
    on_failure: register_clone_unconfirmed
    skip_when_false: inputs.open_pr
    on_skip: release_issue_success
    note: 'Watch the queue for 15 minutes. A merge releases the issue successfully; CI ejection diagnoses CI, healthy ejection retries, and stalled enrollment re-enrolls. Missing enrollment fails. Timeout records an unconfirmed clone state.'
  reenroll_stalled_pr:
    tool: enqueue_pr
    with:
      step_name: reenroll_stalled_pr
      pr_number: ${{ context.pr_number }}
      target_branch: ${{ inputs.base_branch }}
      cwd: ${{ context.work_dir }}
      auto_merge_available: ${{ context.auto_merge_available }}
    on_success: check_stall_loop
    on_failure: release_issue_failure
    skip_when_false: inputs.open_pr
    on_skip: release_issue_success
  check_stall_loop:
    tool: run_python
    with:
      step_name: check_stall_loop
      callable: autoskillit.smoke_utils.check_loop_iteration
      current_iteration: ${{ context.stall_loop_count }}
      max_iterations: '3'
    capture:
      stall_loop_count: ${{ result.next_iteration }}
    on_result:
    - when: ${{ result.max_exceeded }} == true
      route: register_clone_unconfirmed
    - route: wait_for_queue
    on_failure: register_clone_unconfirmed
    optional_context_refs:
    - stall_loop_count
    note: 'Iteration guard for the wait_for_queue / reenroll_stalled_pr cycle. Caps
      stall re-enrollment at 3 attempts. On budget exhaustion, routes to register_clone_unconfirmed
      (merge outcome unconfirmed).

      '
  check_eject_limit:
    tool: run_python
    with:
      step_name: check_eject_limit
      callable: autoskillit.recipe._cmd_rpc.check_eject_limit
      counter_file: ${{ context.work_dir }}/{{AUTOSKILLIT_TEMP}}/eject_count
      max_ejects: '3'
    on_result:
    - when: ${{ result.status }} == EJECT_LIMIT_EXCEEDED
      route: release_issue_failure
    - route: queue_ejected_fix
    on_failure: release_issue_failure
    note: 'Circuit breaker for the queue ejection loop. Tracks ejection count in a
      file-based counter under {{AUTOSKILLIT_TEMP}}/. After 3 ejections, routes to
      release_issue_failure to prevent infinite re-enqueue cycles.

      '
  check_dropped_healthy_loop:
    tool: run_python
    with:
      step_name: check_dropped_healthy_loop
      callable: autoskillit.recipe._cmd_rpc.check_dropped_healthy_loop
      counter_file: ${{ context.work_dir }}/{{AUTOSKILLIT_TEMP}}/dropped_healthy_count
      max_drops: '2'
    on_result:
    - when: ${{ result.status }} == DROPPED_LIMIT_EXCEEDED
      route: release_issue_failure
    - route: reenter_merge_queue_cheap
    on_failure: release_issue_failure
    note: 'After two unexplained healthy-PR queue drops, release the issue. Confirmed merge-group CI failures use check_dropped_ci_loop instead.'
  check_dropped_ci_loop:
    tool: run_python
    with:
      step_name: check_dropped_ci_loop
      callable: autoskillit.recipe._cmd_rpc.check_dropped_ci_loop
      counter_file: ${{ context.work_dir }}/{{AUTOSKILLIT_TEMP}}/dropped_ci_count
      max_drops: '2'
    on_result:
    - when: ${{ result.status }} == DROPPED_CI_LIMIT_EXCEEDED
      route: diagnose_ci
    - route: reenter_merge_queue_cheap
    on_failure: diagnose_ci
    note: 'File-based counter: first merge-group CI drop re-enqueues via reenter_merge_queue_cheap; second consecutive drop diagnoses CI.'
  queue_ejected_fix:
    tool: run_python
    with:
      step_name: queue_ejected_fix
      callable: autoskillit.recipe._cmd_rpc.queue_ejected_fix
      args:
        work_dir: ${{ context.work_dir }}
        base_branch: ${{ inputs.base_branch }}
    on_result:
    - when: ${{ result.status }} == clean
      route: re_push_queue_fix
    - route: resolve_queue_merge_conflicts
    on_failure: resolve_queue_merge_conflicts
    skip_when_false: inputs.open_pr
    on_skip: release_issue_success
    note: 'Try a clean rebase before conflict-resolution skill; abort on conflict and route to goal-aware resolution.'
  resolve_queue_merge_conflicts:
    tool: run_skill
    model: ''
    with:
      skill_command: /autoskillit:resolve-merge-conflicts
      skill_inputs:
        plan_path: ${{ context.plan_path }}
        base_branch: ${{ inputs.base_branch }}
        worktree_path: ${{ context.work_dir }}
      cwd: ${{ context.work_dir }}
      output_dir: .
      step_name: resolve_queue_merge_conflicts
    capture:
      conflict_escalation_required: ${{ result.escalation_required }}
    on_result:
    - when: ${{ result.escalation_required }} == true
      route: diagnose_ci
    - route: re_push_queue_fix
    on_failure: diagnose_ci
    on_context_limit: diagnose_ci
    on_rate_limit: diagnose_ci
    retries: 1
    on_exhausted: diagnose_ci
    skip_when_false: inputs.open_pr
    on_skip: release_issue_success
    note: "Resolves rebase conflicts on the feature branch after queue ejection. Only\
      \ reached when the cheap rebase in queue_ejected_fix encountered conflicts.\
      \ escalation_required=true \u2192 release_issue_failure for human review.\n"
  re_push_queue_fix:
    tool: push_to_remote
    with:
      step_name: re_push_queue_fix
      clone_path: ${{ context.work_dir }}
      remote_url: ${{ context.remote_url }}
      branch: ${{ context.merge_target }}
      force: 'true'
    capture:
      push_error_type: ${{ result.error_type }}
    retries: 2
    on_exhausted: register_clone_unconfirmed
    on_success: ci_watch_post_queue_fix
    on_failure: classify_push_failure
    skip_when_false: inputs.open_pr
    on_skip: release_issue_success
  classify_push_failure:
    action: route
    on_result:
    - when: ${{ context.push_error_type }} == queued_branch
      route: check_dequeue_retry_loop
    - route: release_issue_failure
  check_dequeue_retry_loop:
    tool: run_python
    with:
      step_name: check_dequeue_retry_loop
      callable: autoskillit.smoke_utils.check_loop_iteration
      current_iteration: ${{ context.dequeue_retry_count }}
      max_iterations: '3'
    capture:
      dequeue_retry_count: ${{ result.next_iteration }}
    on_result:
    - when: ${{ result.max_exceeded }} == true
      route: register_clone_unconfirmed
    - route: wait_dequeue_retry
    on_failure: register_clone_unconfirmed
    optional_context_refs:
    - dequeue_retry_count
  wait_dequeue_retry:
    tool: wait_for_merge_queue
    with:
      step_name: wait_dequeue_retry
      pr_number: ${{ context.pr_number }}
      target_branch: ${{ inputs.base_branch }}
      cwd: ${{ context.work_dir }}
      auto_merge_available: ${{ context.auto_merge_available }}
      timeout_seconds: '60'
      max_merge_group_drops: '1'
    on_result:
    - when: ${{ result.pr_state }} == merged
      route: release_issue_success
    - when: ${{ result.pr_state }} == ejected_ci_failure
      route: register_clone_unconfirmed
    - when: ${{ result.pr_state }} == dropped_merge_group_ci
      route: register_clone_unconfirmed
    - when: ${{ result.pr_state }} == dropped_healthy
      route: register_clone_unconfirmed
    - when: ${{ result.pr_state }} == ejected
      route: re_push_queue_fix
    - when: ${{ result.pr_state }} == stalled
      route: register_clone_unconfirmed
    - when: ${{ result.pr_state }} == timeout
      route: register_clone_unconfirmed
    - route: register_clone_unconfirmed
    on_failure: register_clone_unconfirmed
    optional_context_refs:
    - push_error_type
  ci_watch_post_queue_fix:
    tool: wait_for_ci
    with:
      step_name: ci_watch_post_queue_fix
      branch: ${{ context.merge_target }}
      event: ${{ context.ci_event }}
      timeout_seconds: 600
      cwd: ${{ context.work_dir }}
      remote_url: ${{ context.remote_url }}
      auto_trigger: true
    capture:
      ci_conclusion: ${{ result.conclusion }}
      ci_failed_jobs: ${{ result.failed_jobs }}
    on_result:
    - when: ${{ result.conclusion }} == 'success'
      route: reenter_merge_queue
    - when: ${{ result.conclusion }} == 'no_runs'
      route: release_issue_failure
    - when: ${{ result.conclusion }} == 'timed_out'
      route: check_ci_post_queue_loop
    - route: detect_ci_conflict
    on_failure: detect_ci_conflict
    skip_when_false: inputs.open_pr
    on_skip: release_issue_success
    note: 'Check CI after queue-ejection repair: success re-enqueues, no_runs releases after auto-trigger recovery, timeout retries, failure checks conflicts.'
  check_ci_post_queue_loop:
    tool: run_python
    with:
      step_name: check_ci_post_queue_loop
      callable: autoskillit.smoke_utils.check_loop_iteration
      current_iteration: ${{ context.ci_post_queue_loop_count }}
      max_iterations: '2'
    capture:
      ci_post_queue_loop_count: ${{ result.next_iteration }}
    on_result:
    - when: ${{ result.max_exceeded }} == true
      route: release_issue_failure
    - route: ci_watch_post_queue_fix
    on_failure: release_issue_failure
    optional_context_refs:
    - ci_post_queue_loop_count
    skip_when_false: inputs.open_pr
    on_skip: release_issue_success
    note: 'Allow one CI timeout retry after queue repair; then release the issue.'
  reenter_merge_queue:
    tool: enqueue_pr
    with:
      step_name: reenter_merge_queue
      pr_number: ${{ context.pr_number }}
      target_branch: ${{ inputs.base_branch }}
      cwd: ${{ context.work_dir }}
      auto_merge_available: ${{ context.auto_merge_available }}
    on_success: wait_for_queue
    on_failure: release_issue_failure
    skip_when_false: inputs.open_pr
    on_skip: release_issue_success
    note: 'Re-submits the PR after conflict resolution. Routes back to wait_for_queue.
      If re-entry fails, release_issue_failure preserves the clone for debugging.

      '
  reenter_merge_queue_cheap:
    tool: enqueue_pr
    with:
      step_name: reenter_merge_queue_cheap
      pr_number: ${{ context.pr_number }}
      target_branch: ${{ inputs.base_branch }}
      cwd: ${{ context.work_dir }}
      auto_merge_available: ${{ context.auto_merge_available }}
    on_success: wait_for_queue
    on_failure: release_issue_failure
    skip_when_false: inputs.open_pr
    on_skip: release_issue_success
    note: 'Re-submits a healthy PR into the merge queue after auto_merge was cleared
      externally (DROPPED_HEALTHY state). No conflict-resolution CI wait needed. Routes
      back to wait_for_queue on success.

      '
  direct_merge:
    tool: run_cmd
    with:
      cmd: gh pr merge '${{ context.pr_number }}' --squash --auto
      cwd: ${{ context.work_dir }}
      step_name: direct_merge
    on_success: wait_for_direct_merge
    on_failure: release_issue_failure
    skip_when_false: inputs.open_pr
    on_skip: release_issue_success
    note: 'Enable native auto-merge outside the queue; failure releases the issue and reports an error.'
  wait_for_direct_merge:
    tool: run_python
    with:
      step_name: wait_for_direct_merge
      callable: autoskillit.recipe._cmd_rpc.wait_for_direct_merge
      pr_number: ${{ context.pr_number }}
      max_polls: '90'
      poll_interval: '10'
    on_result:
    - when: ${{ result.state }} == merged
      route: release_issue_success
    - when: ${{ result.state }} == closed
      route: direct_merge_conflict_fix
    - route: register_clone_unconfirmed
    on_failure: register_clone_unconfirmed
    skip_when_false: inputs.open_pr
    on_skip: release_issue_success
    note: "Polls GitHub PR state every 10 s for up to 15 minutes. merged \u2192 release_issue_success.\
      \ closed \u2192 conflict fix cycle. timeout \u2192 register_clone_unconfirmed\
      \ (releases claim; merge unconfirmed).\n"
  direct_merge_conflict_fix:
    tool: run_python
    with:
      step_name: direct_merge_conflict_fix
      callable: autoskillit.recipe._cmd_rpc.direct_merge_conflict_fix
      args:
        work_dir: ${{ context.work_dir }}
        base_branch: ${{ inputs.base_branch }}
    on_result:
    - when: ${{ result.status }} == clean
      route: re_push_direct_fix
    - route: resolve_direct_merge_conflicts
    on_failure: resolve_direct_merge_conflicts
    skip_when_false: inputs.open_pr
    on_skip: release_issue_success
    note: 'Attempts a cheap rebase before invoking the full conflict-resolution skill.
      On clean rebase, proceeds to re_push_direct_fix. On conflict, routes to resolve_direct_merge_conflicts
      for goal-aware resolution.

      '
  resolve_direct_merge_conflicts:
    tool: run_skill
    model: ''
    with:
      skill_command: /autoskillit:resolve-merge-conflicts
      skill_inputs:
        plan_path: ${{ context.plan_path }}
        base_branch: ${{ inputs.base_branch }}
        worktree_path: ${{ context.work_dir }}
      cwd: ${{ context.work_dir }}
      output_dir: .
      step_name: resolve_direct_merge_conflicts
    capture:
      conflict_escalation_required: ${{ result.escalation_required }}
    on_result:
    - when: ${{ result.escalation_required }} == true
      route: diagnose_ci
    - route: re_push_direct_fix
    on_failure: diagnose_ci
    on_context_limit: diagnose_ci
    on_rate_limit: diagnose_ci
    retries: 1
    on_exhausted: diagnose_ci
    skip_when_false: inputs.open_pr
    on_skip: release_issue_success
    note: "Resolves rebase conflicts after direct-merge rejection. Only reached when\
      \ the cheap rebase in direct_merge_conflict_fix encountered conflicts. escalation_required=true\
      \ \u2192 release_issue_failure for human review.\n"
  re_push_direct_fix:
    tool: push_to_remote
    with:
      step_name: re_push_direct_fix
      clone_path: ${{ context.work_dir }}
      remote_url: ${{ context.remote_url }}
      branch: ${{ context.merge_target }}
      force: 'true'
    on_success: redirect_merge
    on_failure: classify_push_failure
    skip_when_false: inputs.open_pr
    on_skip: release_issue_success
  redirect_merge:
    tool: run_cmd
    with:
      cmd: gh pr merge '${{ context.pr_number }}' --squash --auto
      cwd: ${{ context.work_dir }}
      step_name: redirect_merge
    on_success: wait_for_direct_merge
    on_failure: release_issue_failure
    skip_when_false: inputs.open_pr
    on_skip: release_issue_success
    note: 'Re-enables auto-merge after conflict resolution and re-push. Routes back
      to wait_for_direct_merge to poll for completion. On failure, release_issue_failure
      preserves the clone for debugging.

      '
  immediate_merge:
    tool: run_cmd
    with:
      cmd: gh pr merge '${{ context.pr_number }}' --squash
      cwd: ${{ context.work_dir }}
      step_name: immediate_merge
    on_success: wait_for_immediate_merge
    on_failure: release_issue_failure
    skip_when_false: inputs.open_pr
    on_skip: release_issue_success
    note: 'Use synchronous squash merge when auto-merge is unavailable. Failure releases the issue and reports the error.'
  wait_for_immediate_merge:
    tool: run_python
    with:
      step_name: wait_for_immediate_merge
      callable: autoskillit.recipe._cmd_rpc.wait_for_immediate_merge
      pr_number: ${{ context.pr_number }}
      max_polls: '30'
      poll_interval: '10'
    on_result:
    - when: ${{ result.state }} == merged
      route: release_issue_success
    - when: ${{ result.state }} == closed
      route: immediate_merge_conflict_fix
    - route: register_clone_unconfirmed
    on_failure: register_clone_unconfirmed
    skip_when_false: inputs.open_pr
    on_skip: release_issue_success
    note: 'Confirm synchronous squash merge for up to five minutes. Merged succeeds; closed repairs conflicts; timeout preserves an unconfirmed clone.'
  immediate_merge_conflict_fix:
    tool: run_python
    with:
      step_name: immediate_merge_conflict_fix
      callable: autoskillit.recipe._cmd_rpc.immediate_merge_conflict_fix
      args:
        work_dir: ${{ context.work_dir }}
        base_branch: ${{ inputs.base_branch }}
    on_result:
    - when: ${{ result.status }} == clean
      route: re_push_immediate_fix
    - route: resolve_immediate_merge_conflicts
    on_failure: resolve_immediate_merge_conflicts
    skip_when_false: inputs.open_pr
    on_skip: release_issue_success
    note: 'Attempts a cheap rebase before invoking the full conflict-resolution skill.
      On clean rebase, proceeds to re_push_immediate_fix. On conflict, routes to resolve_immediate_merge_conflicts
      for goal-aware resolution.

      '
  resolve_immediate_merge_conflicts:
    tool: run_skill
    model: ''
    with:
      skill_command: /autoskillit:resolve-merge-conflicts
      skill_inputs:
        plan_path: ${{ context.plan_path }}
        base_branch: ${{ inputs.base_branch }}
        worktree_path: ${{ context.work_dir }}
      cwd: ${{ context.work_dir }}
      output_dir: .
      step_name: resolve_immediate_merge_conflicts
    capture:
      conflict_escalation_required: ${{ result.escalation_required }}
    on_result:
    - when: ${{ result.escalation_required }} == true
      route: diagnose_ci
    - route: re_push_immediate_fix
    on_failure: diagnose_ci
    on_context_limit: diagnose_ci
    on_rate_limit: diagnose_ci
    retries: 1
    on_exhausted: diagnose_ci
    skip_when_false: inputs.open_pr
    on_skip: release_issue_success
    note: "Resolves rebase conflicts after immediate-merge rejection. Only reached\
      \ when the cheap rebase in immediate_merge_conflict_fix encountered conflicts.\
      \ escalation_required=true \u2192 release_issue_failure for human review.\n"
  re_push_immediate_fix:
    tool: push_to_remote
    with:
      step_name: re_push_immediate_fix
      clone_path: ${{ context.work_dir }}
      remote_url: ${{ context.remote_url }}
      branch: ${{ context.merge_target }}
      force: 'true'
    on_success: remerge_immediate
    on_failure: classify_push_failure
    skip_when_false: inputs.open_pr
    on_skip: release_issue_success
  remerge_immediate:
    tool: run_cmd
    with:
      cmd: gh pr merge '${{ context.pr_number }}' --squash
      cwd: ${{ context.work_dir }}
      step_name: remerge_immediate
    on_success: wait_for_immediate_merge
    on_failure: release_issue_failure
    skip_when_false: inputs.open_pr
    on_skip: release_issue_success
    note: 'Re-attempts plain squash merge after conflict resolution and re-push. Routes
      back to wait_for_immediate_merge to confirm completion. On failure, release_issue_failure
      preserves the clone for debugging.

      '
  diagnose_ci:
    tool: run_skill
    model: ''
    with:
      skill_command: /autoskillit:diagnose-ci
      skill_inputs:
        ci_failed_jobs: ${{ context.ci_failed_jobs }}
        event: ${{ context.ci_event }}
        branch: ${{ context.merge_target }}
      cwd: ${{ context.work_dir }}
      step_name: diagnose_ci
      output_dir: '{{AUTOSKILLIT_TEMP}}/diagnose-ci/rebase_${{ context.ci_rebase_count
        }}_flake_${{ context.ci_flake_count }}'
    capture:
      diagnosis_path: ${{ result.diagnosis_path }}
    on_success: resolve_ci
    on_failure: resolve_ci
    on_context_limit: resolve_ci
    on_rate_limit: resolve_ci
    optional: true
    optional_context_refs:
    - ci_event
    - ci_failed_jobs
    - ci_rebase_count
    - ci_flake_count
    skip_when_false: inputs.open_pr
    on_skip: release_issue_success
    note: 'Write CI-log diagnosis for resolve_ci. Continue to resolve_ci even if diagnosis fails; diagnosis_path is optional context.'
  resolve_ci:
    tool: run_skill
    model: ''
    with:
      skill_command: /autoskillit:resolve-failures
      skill_inputs:
        base_branch: ${{ inputs.base_branch }}
        diagnosis_path: ${{ context.diagnosis_path }}
        ci_failed_jobs: ${{ context.ci_failed_jobs }}
        ci_conclusion: ${{ context.ci_conclusion }}
        plan_path: ${{ context.plan_path }}
        worktree_path: ${{ context.work_dir }}
      cwd: ${{ context.work_dir }}
      output_dir: .
      step_name: resolve_ci
    capture:
      verdict: ${{ result.verdict }}
    retries: 2
    on_exhausted: release_issue_failure
    on_context_limit: release_issue_failure
    on_rate_limit: release_issue_failure
    on_result:
    - when: ${{ result.verdict }} == 'real_fix'
      route: re_push
    - when: ${{ result.verdict }} == 'already_green'
      route: pre_resolve_rebase
    - when: ${{ result.verdict }} == 'flake_suspected'
      route: check_flake_loop
    - when: ${{ result.verdict }} == 'ci_only_failure'
      route: check_flake_loop
    - when: ${{ result.verdict }} == 'no_test_infrastructure'
      route: release_issue_failure
    - route: release_issue_failure
    on_failure: release_issue_failure
    optional_context_refs:
    - ci_conclusion
    - ci_failed_jobs
    - diagnosis_path
    note: 'Resolve the failed CI jobs from ci_watch. Push a real fix, rebase and diagnose an already-green sibling fix, or use the bounded flake loop for suspected and CI-only failures. Exhaustion releases the issue as failed.'
  pre_resolve_rebase:
    tool: run_python
    with:
      callable: autoskillit.recipe._cmd_rpc.review_path_rebase
      args:
        work_dir: ${{ context.work_dir }}
        base_branch: ${{ inputs.base_branch }}
    on_result:
    - when: ${{ result.status }} == clean
      route: check_ci_rebase_loop
    - route: resolve_pre_resolve_conflicts
    on_failure: resolve_pre_resolve_conflicts
    note: 'When resolve_ci says already_green, pull integration changes into the feature branch before rediagnosing CI.'
  resolve_pre_resolve_conflicts:
    tool: run_skill
    model: ''
    with:
      skill_command: /autoskillit:resolve-merge-conflicts
      skill_inputs:
        plan_path: ${{ context.plan_path }}
        base_branch: ${{ inputs.base_branch }}
        worktree_path: ${{ context.work_dir }}
      cwd: ${{ context.work_dir }}
      output_dir: .
      step_name: resolve_pre_resolve_conflicts
    capture:
      conflict_escalation_required: ${{ result.escalation_required }}
    on_result:
    - when: ${{ result.escalation_required }} == true
      route: diagnose_ci
    - route: check_ci_rebase_loop
    on_failure: diagnose_ci
    on_context_limit: diagnose_ci
    on_rate_limit: diagnose_ci
    retries: 1
    on_exhausted: diagnose_ci
  check_ci_rebase_loop:
    tool: run_python
    with:
      step_name: check_ci_rebase_loop
      callable: autoskillit.smoke_utils.check_loop_iteration
      current_iteration: ${{ context.ci_rebase_count }}
      max_iterations: '3'
    capture:
      ci_rebase_count: ${{ result.next_iteration }}
    on_result:
    - when: ${{ result.max_exceeded }} == true
      route: release_issue_failure
    - route: diagnose_ci
    on_failure: release_issue_failure
    optional_context_refs:
    - ci_rebase_count
    note: "Guards the resolve_ci(already_green) \u2192 pre_resolve_rebase \u2192 diagnose_ci\
      \ cycle. Caps at 3 rebase-rediagnose iterations. If CI keeps reporting already_green\
      \ after 3 rebases, a structural issue requires human intervention.\n"
  check_flake_loop:
    tool: run_python
    with:
      step_name: check_flake_loop
      callable: autoskillit.smoke_utils.check_loop_iteration
      current_iteration: ${{ context.ci_flake_count }}
      max_iterations: '3'
    capture:
      ci_flake_count: ${{ result.next_iteration }}
    on_result:
    - when: ${{ result.max_exceeded }} == true
      route: release_issue_failure
    - route: re_push
    on_failure: release_issue_failure
    optional_context_refs:
    - ci_flake_count
    note: 'Use one shared ci_flake_count across every diagnose_ci caller. Three suspected-flake verdicts exhaust the retry budget and require human intervention.'
  re_push:
    tool: push_to_remote
    with:
      clone_path: ${{ context.work_dir }}
      remote_url: ${{ context.remote_url }}
      branch: ${{ context.merge_target }}
      force: 'true'
    on_success: check_repo_ci_event
    on_failure: classify_push_failure
    note: 'Pushes the CI-fixed feature branch back to the remote after resolve_ci
      succeeds. Routes to check_repo_ci_event to derive ci_event before ci_watch verifies
      the fix. On push failure, escalates via release_issue_failure.

      '
  detect_ci_conflict:
    tool: run_cmd
    with:
      cmd: 'REMOTE=$(git remote get-url upstream 2>/dev/null | grep -qv "^file://"
        && echo upstream || echo origin) &&

        git fetch "$REMOTE" ${{ inputs.base_branch }} &&

        ! git merge-base --is-ancestor "$REMOTE"/${{ inputs.base_branch }} HEAD

        '
      cwd: ${{ context.work_dir }}
      step_name: detect_ci_conflict
    on_success: ci_conflict_fix
    on_failure: diagnose_ci
    optional: true
    skip_when_false: inputs.open_pr
    on_skip: release_issue_success
    note: 'Only CI failures enter this stale-base check; check_pr_mergeable CONFLICTING goes directly to ci_conflict_fix. Exit 0 fixes conflicts; exit 1 (ancestor or fetch error) diagnoses CI.'
  ci_conflict_fix:
    tool: run_skill
    model: ''
    with:
      skill_command: /autoskillit:resolve-merge-conflicts
      skill_inputs:
        plan_path: ${{ context.plan_path }}
        base_branch: ${{ inputs.base_branch }}
        worktree_path: ${{ context.work_dir }}
      cwd: ${{ context.work_dir }}
      output_dir: .
      step_name: ci_conflict_fix
    capture:
      conflict_escalation_required: ${{ result.escalation_required }}
    on_result:
    - when: ${{ result.escalation_required }} == true
      route: diagnose_ci
    - route: re_push
    on_failure: diagnose_ci
    on_context_limit: diagnose_ci
    on_rate_limit: diagnose_ci
    retries: 1
    on_exhausted: diagnose_ci
    skip_when_false: inputs.open_pr
    on_skip: release_issue_success
    note: 'Rebase onto the integration head and re-push clean or resolved conflicts. Escalation, tool failure, context limit, and bounded retry exhaustion diagnose CI before issue failure.'
  register_clone_unconfirmed:
    tool: register_clone_status
    with:
      clone_path: ${{ context.work_dir }}
      status: unconfirmed
      step_name: register_clone_unconfirmed
    on_success: analyze_pipeline_health_unconfirmed
    on_failure: analyze_pipeline_health_unconfirmed
    note: 'Preserve the clone and in-progress issue label when a merge wait times out without confirmation.'
  analyze_pipeline_health_unconfirmed:
    tool: run_skill
    model: ''
    stale_threshold: 2400
    optional: true
    skip_when_false: inputs.pipeline_health
    on_skip: done_unconfirmed
    with:
      skill_command: /autoskillit:analyze-pipeline-health
      skill_inputs:
        kitchen_id: ${{ inputs.kitchen_id }}
        dispatch_id: ${{ inputs.dispatch_id }}
        diagnostics_log_dir: ${{ inputs.diagnostics_log_dir }}
      cwd: ${{ context.work_dir }}
      step_name: analyze_pipeline_health
    on_success: done_unconfirmed
    on_failure: done_unconfirmed
    on_context_limit: done_unconfirmed
    on_rate_limit: done_unconfirmed
    note: 'Execute this diagnostic step. Failures are logged but do not alter pipeline
      routing.

      '
  done_unconfirmed:
    action: stop
    message: 'Implementation pipeline finished but merge was not confirmed within
      the timeout window. The PR is still open and the clone has been preserved for
      inspection. The in-progress label remains on the issue. Human operator should
      verify merge status. Emit the L3 result sentinel JSON block now with success=true
      and reason="merge_unconfirmed". Example sentinel: {"success": true, "reason":
      "merge_unconfirmed"}'
  release_issue_success:
    tool: release_issue
    optional: true
    skip_when_false: inputs.issue_url
    on_skip: patch_token_summary
    with:
      issue_url: ${{ inputs.issue_url }}
      target_branch: ${{ inputs.base_branch }}
    on_success: patch_token_summary
    on_failure: patch_token_summary
    note: 'Applies staged label after successful PR merge; skipped when no issue_url.
      Pipeline routes to patch_token_summary on both success and failure.

      '
  patch_token_summary:
    tool: run_python
    optional: true
    skip_when_false: inputs.open_pr
    on_skip: register_clone_success
    with:
      callable: autoskillit.smoke_utils.patch_pr_token_summary
      timeout: 60
      pr_url: ${{ context.pr_url }}
      cwd: ${{ context.work_dir }}
    on_success: register_clone_success
    on_failure: register_clone_success
    note: 'Patches PR body with complete token summary; failures are logged but do
      not alter pipeline routing.

      '
  release_audit_remediation_stuck:
    tool: register_clone_status
    with:
      clone_path: ${{ context.work_dir }}
      status: error
      step_name: release_audit_remediation_stuck
    on_success: stop_audit_remediation_stuck
    on_failure: stop_audit_remediation_stuck
  stop_audit_remediation_stuck:
    action: stop
    message: 'Audit remediation stopped because the same unresolved findings repeated. Emit the L3 result sentinel JSON block now with success=false and reason="audit_remediation_stuck".'
  await_audit_decision:
    tool: register_clone_status
    with:
      clone_path: ${{ context.work_dir }}
      status: error
      step_name: await_audit_decision
    on_success: stop_await_audit_decision
    on_failure: stop_await_audit_decision
  stop_await_audit_decision:
    action: stop
    message: 'Audit remediation requires a human waiver or decision. The preceding gate output lists the unresolved requirement IDs. Emit the L3 result sentinel JSON block now with success=false and reason="awaiting_audit_decision".'
  release_issue_failure:
    tool: release_issue
    optional: true
    skip_when_false: inputs.issue_url
    on_skip: register_clone_failure
    with:
      issue_url: ${{ inputs.issue_url }}
      fail_label: fail
    on_success: register_clone_failure
    on_failure: register_clone_failure
  register_clone_success:
    tool: register_clone_status
    with:
      clone_path: ${{ context.work_dir }}
      status: success
      step_name: register_clone_success
    on_success: analyze_pipeline_health
    on_failure: analyze_pipeline_health
  register_clone_failure:
    tool: register_clone_status
    with:
      clone_path: ${{ context.work_dir }}
      status: error
      step_name: register_clone_failure
    on_success: analyze_pipeline_health_error
    on_failure: analyze_pipeline_health_error
  analyze_pipeline_health:
    tool: run_skill
    model: ''
    stale_threshold: 2400
    optional: true
    skip_when_false: inputs.pipeline_health
    on_skip: done
    with:
      skill_command: /autoskillit:analyze-pipeline-health
      skill_inputs:
        kitchen_id: ${{ inputs.kitchen_id }}
        dispatch_id: ${{ inputs.dispatch_id }}
        diagnostics_log_dir: ${{ inputs.diagnostics_log_dir }}
      cwd: ${{ context.work_dir }}
      step_name: analyze_pipeline_health
    on_success: done
    on_failure: done
    on_context_limit: done
    on_rate_limit: done
    note: 'Execute this diagnostic step. Failures are logged but do not alter pipeline
      routing. Both on_failure and on_context_limit route to the same terminal as
      on_success.

      '
  analyze_pipeline_health_error:
    tool: run_skill
    model: ''
    stale_threshold: 2400
    optional: true
    skip_when_false: inputs.pipeline_health
    on_skip: escalate_stop
    with:
      skill_command: /autoskillit:analyze-pipeline-health
      skill_inputs:
        kitchen_id: ${{ inputs.kitchen_id }}
        dispatch_id: ${{ inputs.dispatch_id }}
        diagnostics_log_dir: ${{ inputs.diagnostics_log_dir }}
      cwd: ${{ context.work_dir }}
      step_name: analyze_pipeline_health
    on_success: escalate_stop
    on_failure: escalate_stop
    on_context_limit: escalate_stop
    on_rate_limit: escalate_stop
    note: __RECIPE_NOTE_ANALYZE_PIPELINE_HEALTH_ERROR__
  register_clone_no_changes:
    tool: register_clone_status
    with:
      clone_path: ${{ context.work_dir }}
      status: success
      step_name: register_clone_no_changes
    on_success: analyze_pipeline_health_no_changes
    on_failure: analyze_pipeline_health_no_changes
  analyze_pipeline_health_no_changes:
    tool: run_skill
    model: ''
    stale_threshold: 2400
    optional: true
    skip_when_false: inputs.pipeline_health
    on_skip: done_no_changes
    with:
      skill_command: /autoskillit:analyze-pipeline-health
      skill_inputs:
        kitchen_id: ${{ inputs.kitchen_id }}
        dispatch_id: ${{ inputs.dispatch_id }}
        diagnostics_log_dir: ${{ inputs.diagnostics_log_dir }}
      cwd: ${{ context.work_dir }}
      step_name: analyze_pipeline_health
    on_success: done_no_changes
    on_failure: done_no_changes
    on_context_limit: done_no_changes
    on_rate_limit: done_no_changes
    note: 'Execute this diagnostic step. Failures are logged but do not alter pipeline
      routing.

      '
  register_clone_already_done:
    tool: register_clone_status
    with:
      clone_path: ${{ context.work_dir }}
      status: success
      step_name: register_clone_already_done
    on_success: analyze_pipeline_health_already_done
    on_failure: analyze_pipeline_health_already_done
  analyze_pipeline_health_already_done:
    tool: run_skill
    model: ''
    stale_threshold: 2400
    optional: true
    skip_when_false: inputs.pipeline_health
    on_skip: done_already_done
    with:
      skill_command: /autoskillit:analyze-pipeline-health
      skill_inputs:
        kitchen_id: ${{ inputs.kitchen_id }}
        dispatch_id: ${{ inputs.dispatch_id }}
        diagnostics_log_dir: ${{ inputs.diagnostics_log_dir }}
      cwd: ${{ context.work_dir }}
      step_name: analyze_pipeline_health
    on_success: done_already_done
    on_failure: done_already_done
    on_context_limit: done_already_done
    on_rate_limit: done_already_done
    note: 'Execute this diagnostic step. Failures are logged but do not alter pipeline
      routing.

      '
  done:
    action: stop
    message: 'Investigation complete. Fix implemented and PR opened. Emit the L3 result
      sentinel JSON block now with success=true. Example sentinel: {"success": true,
      "reason": "remediation_complete"}'
  done_no_changes:
    action: stop
    message: "Pipeline completed with zero changes \u2014 the implement step produced\
      \ no commits. Emit the L3 result sentinel JSON block now with success=true and\
      \ reason=\"no_changes\". Example sentinel: {\"success\": true, \"reason\": \"\
      no_changes\"}"
  done_already_done:
    action: stop
    message: "Pipeline completed \u2014 changes were already merged by a prior run.\
      \ Emit the L3 result sentinel JSON block now with success=true and reason=\"\
      already_done\". Example sentinel: {\"success\": true, \"reason\": \"already_done\"\
      }"
  escalate_stop:
    action: stop
    message: >-
      Pipeline failed. Emit the L3 failure sentinel from the original failed
      run_skill response and any supplementary diagnostic evidence. Do not replace
      observed evidence with a fixed example reason.
