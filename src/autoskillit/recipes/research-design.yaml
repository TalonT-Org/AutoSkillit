name: research-design
recipe_version: "1.0.0"
kind: food-truck
categories: [research-family]
requires_packs: [research, vis-lens]
description: >
  Scope a research question and plan the experiment
  question, plans an experiment, optionally reviews the design (bounded by
  check_design_review_loop, max 3 iterations), plans visualizations, then
  terminates with a cross-dispatch handoff sentinel containing the design
  artifacts. Dispatched as a food truck by campaign recipes that separate
  design from execution.
dispatch_only: true
summary: scope > plan > [review?] > dial > apply > synthesize > design_complete

ingredients:
  task:
    description: Research question or topic to investigate
    required: true
  source_dir:
    description: Path to the project root
    required: true
    authority: config
  base_branch:
    description: Branch to target for the research PR
    default: "main"
    authority: config
  review_design:
    description: >
      When 'true' (the default), run the review-design skill after plan_experiment
      to validate the experiment plan before execution. Emits a verdict: GO proceeds,
      REVISE loops back to plan_experiment with revision guidance (bounded by
      check_design_review_loop at 3 iterations), STOP triggers resolve_design_review
      for triage — addressable findings loop back, structural findings halt the
      pipeline. When 'false', skip directly to dial.
    default: "true"
  issue_url:
    description: >
      Optional URL to an existing GitHub issue describing the research goal.
      Provided as context to scope and plan_experiment.
    required: false
  min_breadth:
    description: >
      Minimum number of directions to select when scope reports 3 or more directions.
      Enforced by the select_directions step. Set to 0 to disable breadth enforcement.
    default: "2"

kitchen_rules:
- >
  NEVER use native Claude Code tools from the orchestrator: Read, Grep, Glob,
  Edit, Write, Bash, Agent, WebFetch, WebSearch, NotebookEdit are ALL forbidden.
  All work is delegated through run_skill, run_cmd, run_python.
- >
  This recipe is a food truck dispatched by a campaign. Emit the L3 sentinel
  JSON block exactly as instructed in the design_complete step message — no
  extra tool calls after reaching design_complete.

steps:
  scope:
    tool: run_skill
    model: ""
    with:
      skill_command: "/autoskillit:scope ${{ inputs.task }}"
      cwd: "${{ inputs.source_dir }}"
      step_name: scope
      output_dir: "{{AUTOSKILLIT_TEMP}}/scope"
    capture:
      scope_report: "${{ result.scope_report }}"
      scope_directions: "${{ result.scope_directions }}"
    on_success: select_directions
    on_failure: escalate_stop

  select_directions:
    tool: run_skill
    model: ""
    with:
      skill_command: "/autoskillit:select-directions ${{ context.scope_directions }} ${{ context.scope_report }} ${{ inputs.min_breadth }}"
      cwd: "${{ inputs.source_dir }}"
      step_name: select_directions
      output_dir: "{{AUTOSKILLIT_TEMP}}/select-directions"
    capture:
      selected_directions: "${{ result.selected_directions }}"
    on_success: plan_experiment
    on_failure: escalate_stop

  plan_experiment:
    tool: run_skill
    model: ""
    with:
      skill_command: "/autoskillit:plan-experiment ${{ context.scope_report }} ${{ context.selected_directions }} ${{ context.revision_guidance }}"
      cwd: "${{ inputs.source_dir }}"
      step_name: plan_experiment
      output_dir: "{{AUTOSKILLIT_TEMP}}/plan-experiment"
    optional_context_refs: [revision_guidance, selected_directions]
    capture:
      experiment_plan: "${{ result.experiment_plan }}"
    on_success: review_design
    on_failure: escalate_stop

  review_design:
    tool: run_skill
    model: ""
    with:
      skill_command: "/autoskillit:review-design ${{ context.experiment_plan }} ${{ context.scope_report }}"
      cwd: "${{ inputs.source_dir }}"
      step_name: review_design
      output_dir: "{{AUTOSKILLIT_TEMP}}/review-design"
    capture:
      verdict: "${{ result.verdict }}"
      experiment_type: "${{ result.experiment_type }}"
      evaluation_dashboard: "${{ result.evaluation_dashboard }}"
      revision_guidance: "${{ result.revision_guidance }}"
    pass_through: [experiment_type]
    skip_when_false: inputs.review_design
    retries: 2
    on_exhausted: dial
    on_context_limit: dial
    on_failure: dial
    on_result:
    - when: "${{ result.verdict }} == GO"
      route: dial
    - when: "${{ result.verdict }} == REVISE"
      route: revise_design
    - when: "${{ result.verdict }} == STOP"
      route: resolve_design_review
    - route: dial

  dial:
    tool: run_skill
    model: ""
    phoropter_family: vis-lens
    with:
      skill_command: "/autoskillit:select-vis-lenses ${{ inputs.source_dir }} ${{ context.experiment_plan }} ${{ context.scope_report }}"
      cwd: "${{ inputs.source_dir }}"
      step_name: dial
      output_dir: "{{AUTOSKILLIT_TEMP}}/dial"
    capture:
      selected_lenses: "${{ result.selected_lenses }}"
      lens_context_paths: "${{ result.lens_context_paths }}"
    on_success: apply
    on_failure: escalate_stop

  apply:
    tool: run_skill
    model: ""
    phoropter_family: vis-lens
    with:
      skill_command: "/autoskillit:vis-lens-{slug} {context_path} ${{ context.experiment_plan }}"
      cwd: "${{ inputs.source_dir }}"
      step_name: apply
      output_dir: "{{AUTOSKILLIT_TEMP}}/apply"
    capture_list:
      all_figure_spec_paths: "${{ result.figure_spec_path }}"
    optional_context_refs: [selected_lenses, lens_context_paths]
    retries: 0
    on_success: synthesize
    on_failure: synthesize

  synthesize:
    tool: run_skill
    model: ""
    phoropter_family: vis-lens
    with:
      skill_command: "/autoskillit:synthesize-vis-plan"
      cwd: "${{ inputs.source_dir }}"
      step_name: synthesize
      output_dir: "{{AUTOSKILLIT_TEMP}}/synthesize"
    capture:
      visualization_plan_path: "${{ result.visualization_plan_path }}"
      report_plan_path: "${{ result.report_plan_path }}"
      visualization_plan_trace_path: "${{ result.visualization_plan_trace_path }}"
    on_success: create_worktree
    on_failure: escalate_stop

  revise_design:
    action: route
    on_result:
    - route: check_design_review_loop

  check_design_review_loop:
    tool: run_python
    with:
      callable: "autoskillit.smoke_utils.check_loop_iteration"
      current_iteration: "${{ context.design_review_count }}"
      max_iterations: "3"
    capture:
      design_review_count: "${{ result.next_iteration }}"
    on_result:
    - when: "${{ result.max_exceeded }} == true"
      route: dial
    - route: plan_experiment
    on_failure: dial
    optional_context_refs:
    - design_review_count
    note: >
      Iteration guard for the review_design → revise_design → plan_experiment cycle.
      Caps design revision loops at 3 iterations. Both REVISE and
      STOP→resolve→revised paths flow through revise_design and hit this guard.
      On exhaustion, proceeds to dial with the best available design.

  resolve_design_review:
    tool: run_skill
    model: ""
    with:
      skill_command: "/autoskillit:resolve-design-review ${{ context.evaluation_dashboard }} ${{ context.experiment_plan }} ${{ context.revision_guidance }}"
      cwd: "${{ inputs.source_dir }}"
      step_name: resolve_design_review
      output_dir: "{{AUTOSKILLIT_TEMP}}/resolve-design-review"
    optional_context_refs: [evaluation_dashboard, experiment_plan, revision_guidance]
    capture:
      revision_guidance: "${{ result.revision_guidance }}"
    retries: 1
    on_failure: design_rejected
    on_context_limit: design_rejected
    on_result:
    - when: "${{ result.resolution }} == revised"
      route: revise_design
    - when: "${{ result.resolution }} == failed"
      route: design_rejected
    - route: design_rejected
    note: >
      Triages STOP-verdict findings from review_design. ADDRESSABLE/DISCUSS findings
      generate revision_guidance and loop back. Only all-STRUCTURAL findings halt at
      design_rejected.

  design_rejected:
    action: stop
    message: >
      Research pipeline halted: experiment design rejected (verdict=STOP, resolution=failed).
      All stop-trigger findings are structural — revision cannot address the identified flaws.
      Check {{AUTOSKILLIT_TEMP}}/resolve-design-review/ for the triage report and
      {{AUTOSKILLIT_TEMP}}/review-design/ for the evaluation dashboard.
      Emit the L3 result sentinel JSON block now with success=false.
      Example sentinel: {"success": false, "reason": "experiment design rejected"}

  create_worktree:
    tool: run_cmd
    with:
      cmd: "bash {{AUTOSKILLIT_SCRIPTS}}/create_worktree.sh \"${{ inputs.source_dir }}\" \"${{ inputs.task }}\" \"${{ context.experiment_plan }}\" \"${{ context.scope_report }}\" \"${{ context.evaluation_dashboard }}\" \"${{ context.visualization_plan_path }}\" \"${{ context.report_plan_path }}\" \"{{AUTOSKILLIT_TEMP}}\" \"${{ context.visualization_plan_trace_path }}\""
      cwd: "${{ inputs.source_dir }}"
      step_name: create_worktree
    capture:
      worktree_path: "${{ result.worktree_path }}"
      research_dir: "${{ result.research_dir }}"
      research_dir_rel: "${{ result.research_dir_rel }}"
    optional_context_refs: [evaluation_dashboard, visualization_plan_trace_path]
    on_success: design_complete
    on_failure: escalate_stop

  design_complete:
    action: stop
    message: >-
      Design phase complete. Emit the L3 result sentinel JSON block now.
      The sentinel must include the following fields from captured context:
      success=true, scope_report=<context.scope_report>,
      scope_directions=<context.scope_directions>,
      selected_directions=<context.selected_directions>,
      experiment_plan=<context.experiment_plan>,
      visualization_plan_path=<context.visualization_plan_path>,
      report_plan_path=<context.report_plan_path>,
      experiment_type=<context.experiment_type>,
      worktree_path=${{ context.worktree_path }},
      research_dir=${{ context.research_dir }},
      research_dir_rel=${{ context.research_dir_rel }}.
      Example sentinel:
      {"success": true, "scope_report": "<path>", "scope_directions": "<path>",
      "selected_directions": "<path>", "experiment_plan": "<path>",
      "visualization_plan_path": "<path>", "report_plan_path": "<path>",
      "experiment_type": "benchmark", "worktree_path": "<path>",
      "research_dir": "<path>", "research_dir_rel": "<rel>"}

  escalate_stop:
    action: stop
    message: >-
      Research pipeline failed — human intervention needed. Check the latest step output for details.
      Emit the L3 result sentinel JSON block now with success=false.
      Example sentinel: {"success": false, "reason": "research pipeline failed"}
