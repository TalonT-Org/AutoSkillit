name: research
recipe_version: 1.0.0
requires_packs:
- research
- exp-lens
- vis-lens
description: 'End-to-end technical research: scope, implement, report

  '
summary: scope > plan > [review?] > worktree > env-setup > decompose > phases > experiment > report > open-pr > [review? >
  resolve > [re-run?] > push] > archive
ingredients:
  task:
    description: Research question or topic to investigate
    required: true
  issue_url:
    description: 'Optional URL to an existing GitHub issue describing the research goal. Provided as context to scope and
      plan_experiment.

      '
    required: false
  source_dir:
    description: Path to the project root
    required: true
  base_branch:
    description: Branch to target for the research PR
    default: main
    authority: config
  review_design:
    description: 'When ''true'' (the default), run the review-design skill after plan_experiment to validate the experiment
      plan before execution. Emits a verdict: GO proceeds, REVISE loops back to plan_experiment with revision guidance (bounded
      by check_design_review_loop at 3 iterations), STOP triggers resolve_design_review for triage — addressable findings
      loop back, structural findings halt the pipeline. When ''false'', skip directly to create_worktree.

      '
    default: 'true'
  review_research_pr:
    description: 'When ''true'', run the review-research-pr skill after the research PR is opened. Posts inline review comments
      on research quality dimensions (methodology, reproducibility, report-quality, etc.) and emits a verdict. Defaults to
      ''false'' — the research PR is for human review.

      '
    default: 'false'
  audit_claims:
    required: false
    default: 'false'
    description: 'When ''true'', run audit-claims after review_research_pr to verify citation integrity and claim backing
      in the research report. Emits a verdict that routes to resolve-claims-review when changes are needed.

      '
  output_mode:
    required: false
    default: local
    description: 'Where research outputs land. ''local'' (default) produces a self-contained report.html bundle under {source_dir}/research-bundles/{date-slug}/
      with no GitHub interaction. ''pr'' opens a GitHub PR alongside the HTML bundle and runs the full review/archival flow.

      '
  test_check_enabled:
    description: 'When ''true'' (the default), run test_check after report generation. Set to ''false'' for de novo worktrees
      without test infrastructure.

      '
    default: 'true'
  audit_impl:
    description: 'When ''true'' (the default), run audit-impl after phase iteration to verify all decomposed phases have corresponding
      implementation commits. Catches silent group abandonment when context_limit fires mid-iteration.

      '
    default: 'true'
  closure_authority_path:
    description: Absolute path to frozen requirements authority JSON for closure-mode audit
    default: ''
  closure_authority_hash:
    description: SHA-256 lowercase hex hash of the authority file content
    default: ''
  min_breadth:
    description: 'Minimum number of directions to select when scope reports 3 or more directions. Enforced by the select_directions
      step. Set to 0 to disable breadth enforcement.

      '
    default: '2'
kitchen_rules:
- 'NEVER use native Claude Code tools from the orchestrator: Read, Grep, Glob, Edit, Write, Bash, Agent, WebFetch, WebSearch,
  NotebookEdit are ALL forbidden. All work is delegated through run_skill, run_cmd, run_python.

  '
- Do NOT auto-merge. The research PR is for human review only.
- The research/ folder is the target for all permanent output.
- Inconclusive results are valid findings, not failures.
- Route to on_failure when a step fails — do not investigate directly.
- 'DESIGN REVIEW LOOP: review_design validates the plan and may route back to plan_experiment with revision guidance. Bounded
  by check_design_review_loop (max 3 iterations). On exhaustion or failure, proceed to execution with the best available plan
  — do not stop. Exception: a STOP verdict triggers resolve_design_review, which triages each stop-trigger finding as ADDRESSABLE/STRUCTURAL/DISCUSS.
  If any are ADDRESSABLE or DISCUSS, revision guidance is generated and the plan loops back for revision (via revise_design).
  If all are STRUCTURAL, the pipeline halts at design_rejected (truly terminal — revision cannot address the flaws).

  '
- 'PHASE ITERATION: decompose_phases always runs. The agent maintains a phase queue from group_files. For each phase, run
  plan_phase then implement_phase. When all phases complete (or on context exhaustion), route to audit_impl for implementation
  completeness verification before advancing to run_experiment.

  '
- 'PERMANENT ARTIFACTS: create_worktree commits the experiment plan to research/ and supporting artifacts (scope report, design
  evaluation) to research/artifacts/. These are permanent records in the PR.

  '
- 'ARCHIVAL PHASE: After all review and re-validation cycles complete, the pipeline extracts research/ into a clean artifact
  PR, tags the full experiment branch under archive/research/, and closes the original PR. Every archival step degrades gracefully
  — failures route to research_complete without blocking the pipeline.

  '
- 'LOCAL MODE OUTPUT: In local mode, the finalized bundle (report.html, report.md, artifacts.tar.gz) is exported to {source_dir}/research-bundles/{date-slug}/.
  This directory is created only when output_mode=local and is not committed to git.

  '
steps:
  scope:
    tool: run_skill
    model: ''
    with:
      skill_command: /autoskillit:scope
      skill_inputs:
        research_question: ${{ inputs.task }}
      cwd: ${{ inputs.source_dir }}
      step_name: scope
      output_dir: '{{AUTOSKILLIT_TEMP}}/scope'
    capture:
      scope_report: ${{ result.scope_report }}
      scope_directions: ${{ result.scope_directions }}
    on_success: select_directions
    on_failure: escalate_stop
  select_directions:
    tool: run_skill
    model: ''
    with:
      skill_command: /autoskillit:select-directions
      skill_inputs:
        min_breadth: ${{ inputs.min_breadth }}
        scope_directions_path: ${{ context.scope_directions }}
        scope_report_path: ${{ context.scope_report }}
      cwd: ${{ inputs.source_dir }}
      step_name: select_directions
      output_dir: '{{AUTOSKILLIT_TEMP}}/select-directions'
    capture:
      selected_directions: ${{ result.selected_directions }}
    on_success: plan_experiment
    on_failure: escalate_stop
  plan_experiment:
    tool: run_skill
    model: ''
    with:
      skill_command: /autoskillit:plan-experiment
      skill_inputs:
        scope_directions_path: ${{ context.selected_directions }}
        revision_guidance: ${{ context.revision_guidance }}
        scope_report_path: ${{ context.scope_report }}
      cwd: ${{ inputs.source_dir }}
      step_name: plan_experiment
      output_dir: '{{AUTOSKILLIT_TEMP}}/plan-experiment'
    optional_context_refs:
    - revision_guidance
    - selected_directions
    capture:
      experiment_plan: ${{ result.experiment_plan }}
    on_success: dial
    on_failure: escalate_stop
  dial:
    tool: run_skill
    model: ''
    phoropter_family: review-design
    with:
      skill_command: /autoskillit:classify-experiment-type
      skill_inputs:
        scope_report_path: ${{ context.scope_report }}
        experiment_plan_path: ${{ context.experiment_plan }}
      cwd: ${{ inputs.source_dir }}
      step_name: dial
      output_dir: '{{AUTOSKILLIT_TEMP}}/classify-experiment-type/iter_${{ context.design_review_count }}'
    capture:
      experiment_type: ${{ result.experiment_type }}
      dimensions_manifest_path: ${{ result.dimensions_manifest_path }}
      classification_timestamp: ${{ result.classification_timestamp }}
      is_silent_type: ${{ result.is_silent_type }}
    pass_through:
    - experiment_type
    - classification_timestamp
    - is_silent_type
    optional_context_refs:
    - design_review_count
    skip_when_false: inputs.review_design
    on_skip: create_worktree
    retries: 2
    on_exhausted: create_worktree
    on_context_limit: create_worktree
    on_failure: create_worktree
    on_success: silent_type_gate
  silent_type_gate:
    action: route
    phoropter_family: review-design
    on_result:
    - when: ${{ context.is_silent_type }} == true
      route: synthesize
    - when: ${{ context.is_silent_type }} == false
      route: check_design_review_loop
  apply:
    tool: run_skill
    model: ''
    phoropter_family: review-design
    with:
      skill_command: /autoskillit:apply-review-dimensions
      skill_inputs:
        scope_report_path: ${{ context.scope_report }}
        dimensions_manifest_path: ${{ context.dimensions_manifest_path }}
        experiment_type: ${{ context.experiment_type }}
        experiment_plan_path: ${{ context.experiment_plan }}
        classification_timestamp: ${{ context.classification_timestamp }}
      cwd: ${{ inputs.source_dir }}
      step_name: apply
      output_dir: '{{AUTOSKILLIT_TEMP}}/apply-review-dimensions/iter_${{ context.design_review_count }}'
    optional_context_refs:
    - design_review_count
    capture:
      findings_manifest_path: ${{ result.findings_manifest_path }}
      evaluation_dashboard: ${{ result.evaluation_dashboard_path }}
    on_failure: create_worktree
    on_exhausted: create_worktree
    on_context_limit: create_worktree
    on_result:
    - when: ${{ result.verdict }} == REVISE
      route: revise_design
    - route: synthesize
  synthesize:
    tool: run_python
    phoropter_family: review-design
    with:
      callable: autoskillit.smoke_utils.aggregate_review_verdict
      findings_manifest_path: ${{ context.findings_manifest_path }}
      dimensions_manifest_path: ${{ context.dimensions_manifest_path }}
      experiment_type: ${{ context.experiment_type }}
      output_dir: '{{AUTOSKILLIT_TEMP}}/aggregate-review-verdict'
      work_dir: ${{ inputs.source_dir }}
    capture:
      verdict: ${{ result.verdict }}
      revision_guidance: ${{ result.revision_guidance_path }}
      evaluation_dashboard: ${{ result.evaluation_dashboard_path }}
    on_failure: create_worktree
    on_result:
    - when: ${{ result.verdict }} == GO
      route: vis_dial
    - when: ${{ result.verdict }} == REVISE
      route: revise_design
    - when: ${{ result.verdict }} == STOP
      route: resolve_design_review
    - route: create_worktree
  vis_dial:
    tool: run_skill
    model: ''
    phoropter_family: vis-lens
    with:
      skill_command: /autoskillit:select-vis-lenses
      skill_inputs:
        source_dir: ${{ inputs.source_dir }}
        scope_report_path: ${{ context.scope_report }}
        experiment_plan_path: ${{ context.experiment_plan }}
      cwd: ${{ inputs.source_dir }}
      step_name: vis_dial
      output_dir: '{{AUTOSKILLIT_TEMP}}/select-vis-lenses'
    capture:
      selected_lenses: ${{ result.selected_lenses }}
      lens_context_paths: ${{ result.lens_context_paths }}
      disambiguation_rule_applied: ${{ result.disambiguation_rule_applied }}
      tier_c_lens: ${{ result.tier_c_lens }}
      methodology_tradition: ${{ result.methodology_tradition }}
    on_success: vis_apply
    on_failure: escalate_stop
  vis_apply:
    tool: run_skill
    model: ''
    phoropter_family: vis-lens
    with:
      skill_command: /autoskillit:vis-lens-{slug}
      skill_inputs:
        context_path: '{context_path}'
      cwd: ${{ inputs.source_dir }}
      step_name: vis_apply
      output_dir: '{{AUTOSKILLIT_TEMP}}/run-vis-lenses'
    capture_list:
      vis_lens_output_paths: ${{ result.diagram_path }}
    retries: 0
    on_success: vis_synthesize
    on_failure: escalate_stop
    note: "LENS ITERATION: context.selected_lenses contains comma-separated vis-lens slugs (e.g. \"always-on,chart-select\"\
      ). context.lens_context_paths contains the corresponding comma-separated context file paths (same order as slugs). For\
      \ each lens slug, run:\n  /autoskillit:vis-lens-{slug} {matching_context_path}\nRun all selected lenses in parallel\
      \ (all run_skill calls in a single message). Accumulate each diagram_path value into context.vis_lens_output_paths via\
      \ capture_list. If a lens fails, continue with remaining lenses.\n"
  vis_synthesize:
    tool: run_skill
    model: ''
    phoropter_family: vis-lens
    with:
      skill_command: /autoskillit:synthesize-vis-plan
      skill_inputs:
        methodology_tradition: ${{ context.methodology_tradition }}
        disambiguation_rule_applied: ${{ context.disambiguation_rule_applied }}
        experiment_plan_path: ${{ context.experiment_plan }}
        tier_c_lens: ${{ context.tier_c_lens }}
        source_dir: ${{ inputs.source_dir }}
        capture_dir: '{{AUTOSKILLIT_TEMP}}/run-vis-lenses'
      cwd: ${{ inputs.source_dir }}
      step_name: vis_synthesize
      output_dir: '{{AUTOSKILLIT_TEMP}}/synthesize-vis-plan'
    capture:
      visualization_plan_path: ${{ result.visualization_plan_path }}
      report_plan_path: ${{ result.report_plan_path }}
      visualization_plan_trace_path: ${{ result.visualization_plan_trace_path }}
    on_success: create_worktree
    on_failure: escalate_stop
  revise_design:
    action: route
    on_result:
    - route: dial
  check_design_review_loop:
    tool: run_python
    with:
      callable: autoskillit.smoke_utils.check_loop_iteration
      current_iteration: ${{ context.design_review_count }}
      max_iterations: '3'
    capture:
      design_review_count: ${{ result.next_iteration }}
    on_result:
    - when: ${{ result.max_exceeded }} == true
      route: create_worktree
    - route: apply
    on_failure: create_worktree
    optional_context_refs:
    - design_review_count
    note: 'Iteration guard for the dial → apply → synthesize REVISE → revise_design → check_design_review_loop → apply cycle.
      Re-entry reclassifies the revised plan before selecting dimensions. Caps design revision loops at 3 iterations.
      On exhaustion, proceeds to create_worktree with the best available design.

      '
  resolve_design_review:
    tool: run_skill
    model: ''
    with:
      skill_command: /autoskillit:resolve-design-review
      skill_inputs:
        revision_guidance: ${{ context.revision_guidance }}
        evaluation_dashboard: ${{ context.evaluation_dashboard }}
        experiment_plan: ${{ context.experiment_plan }}
      cwd: ${{ inputs.source_dir }}
      step_name: resolve_design_review
      output_dir: '{{AUTOSKILLIT_TEMP}}/resolve-design-review/iter_${{ context.design_review_count }}'
    optional_context_refs:
    - revision_guidance
    capture:
      revision_guidance: ${{ result.revision_guidance }}
    retries: 1
    on_failure: design_rejected
    on_context_limit: design_rejected
    on_result:
    - when: ${{ result.resolution }} == revised
      route: revise_design
    - when: ${{ result.resolution }} == failed
      route: design_rejected
    - route: design_rejected
    note: 'Triages STOP-verdict findings from review_design. ADDRESSABLE/DISCUSS findings generate revision_guidance and loop
      back. Only all-STRUCTURAL findings halt at design_rejected.

      '
  design_rejected:
    action: stop
    message: 'Research pipeline halted: experiment design rejected (verdict=STOP, resolution=failed). All stop-trigger findings
      are structural — revision cannot address the identified flaws. Check {{AUTOSKILLIT_TEMP}}/resolve-design-review/ for
      the triage report and {{AUTOSKILLIT_TEMP}}/review-design/ for the evaluation dashboard. Emit the L3 result sentinel
      JSON block now with success=false. Example sentinel: {"success": false, "reason": "experiment design rejected"}

      '
  create_worktree:
    tool: run_cmd
    with:
      cmd: bash {{AUTOSKILLIT_SCRIPTS}}/create_worktree.sh '${{ inputs.source_dir }}' '${{ inputs.task }}' '${{ context.experiment_plan
        }}' '${{ context.scope_report }}' '${{ context.evaluation_dashboard }}' '${{ context.visualization_plan_path }}' '${{
        context.report_plan_path }}' '{{AUTOSKILLIT_TEMP}}' '${{ context.visualization_plan_trace_path }}'
      cwd: ${{ inputs.source_dir }}
      step_name: create_worktree
    capture:
      worktree_path: ${{ result.worktree_path }}
      research_dir: ${{ result.research_dir }}
    on_success: stage_data
    on_failure: escalate_stop
    note: 'Creates the shared worktree and commits the experiment plan and scope report to research/ as permanent artifacts.
      All phases and experiment implementation share this worktree. Auto-initializes a git repo with an empty seed commit
      when the source directory has no .git directory.

      '
  stage_data:
    tool: run_skill
    model: ''
    with:
      skill_command: /autoskillit:stage-data
      skill_inputs:
        experiment_plan: ${{ context.experiment_plan }}
      cwd: ${{ context.worktree_path }}
      step_name: stage_data
      output_dir: '{{AUTOSKILLIT_TEMP}}/stage-data'
    capture:
      verdict: ${{ result.verdict }}
      resource_report: ${{ result.resource_report }}
    on_result:
      field: verdict
      routes:
        PASS: download_data
        WARN: download_data
        FAIL: escalate_stop
    on_failure: escalate_stop
    note: 'Pre-flight resource gate. Reads the experiment plan''s data_manifest, checks available disk space and network connectivity
      for external/gitignored data entries, and creates the required directory structure in the worktree. PASS and WARN proceed
      to download_data. FAIL escalates immediately with a detailed resource feasibility report rather than wasting compute
      on doomed downloads.

      '
  download_data:
    tool: run_skill
    model: ''
    stale_threshold: 14400
    idle_output_timeout: 0
    retries: 1
    on_exhausted: escalate_stop
    with:
      skill_command: /autoskillit:download-data
      skill_inputs:
        experiment_plan: ${{ context.experiment_plan }}
      cwd: ${{ context.worktree_path }}
      step_name: download_data
      output_dir: '{{AUTOSKILLIT_TEMP}}/download-data'
    capture:
      verdict: ${{ result.verdict }}
      download_report: ${{ result.download_report }}
    on_result:
      field: verdict
      routes:
        PASS: setup_environment
        WARN: setup_environment
        FAIL: escalate_stop
    on_failure: escalate_stop
    note: 'Downloads external and gitignored datasets declared in the experiment plan''s data_manifest. Executes acquisition
      commands sequentially into the directories pre-created by stage_data. Uses a 4-hour stale threshold to accommodate multi-GB
      downloads. PASS and WARN proceed to setup_environment. FAIL escalates immediately — partial downloads are not recoverable
      without re-running the full step.

      '
  setup_environment:
    tool: run_skill
    model: ''
    with:
      skill_command: /autoskillit:setup-environment
      skill_inputs:
        worktree_path: ${{ context.worktree_path }}
        experiment_plan: ${{ context.experiment_plan }}
      cwd: ${{ context.worktree_path }}
      step_name: setup_environment
      output_dir: '{{AUTOSKILLIT_TEMP}}/setup-environment'
    capture:
      verdict: ${{ result.verdict }}
    on_result:
      field: verdict
      routes:
        PASS: decompose_phases
        WARN: decompose_phases
        FAIL: escalate_stop
    on_failure: escalate_stop
    stale_threshold: 600
    retries: 1
    on_exhausted: escalate_stop
    note: 'Pre-flight environment gate. Reads the experiment plan to determine the required environment type (standard, Docker,
      or micromamba-host). Probes Docker availability, builds the image if possible, falls back to host micromamba if Docker
      is unavailable and deps are pure conda-forge Python. PASS (none or docker) and WARN (micromamba-host) proceed to decompose_phases.
      FAIL (unavailable) escalates immediately.

      '
  decompose_phases:
    tool: run_skill
    model: ''
    with:
      skill_command: /autoskillit:make-groups
      skill_inputs:
        source_doc: ${{ context.experiment_plan }}
      cwd: ${{ context.worktree_path }}
      step_name: decompose
      output_dir: '{{AUTOSKILLIT_TEMP}}/make-groups'
    capture:
      group_files: ${{ result.group_files }}
    on_success: capture_impl_base
    on_failure: escalate_stop
    note: 'Decomposes the experiment plan into sequenced phases. Each phase becomes an independently plannable implementation
      unit. Typical decomposition: infrastructure/logging -> data generators -> plotting/analysis scripts -> experiment implementation.
      ITERATION: The agent maintains a phase queue from group_files. For each phase, run plan_phase then implement_phase before
      advancing.

      '
  capture_impl_base:
    tool: run_cmd
    with:
      cmd: git rev-parse HEAD
      cwd: ${{ context.worktree_path }}
      step_name: capture_impl_base
    capture:
      impl_base_sha: ${{ result.stdout | trim }}
    on_success: plan_phase
    on_failure: escalate_stop
    note: 'Captures the worktree HEAD SHA before phase implementation begins. Used by audit_impl to diff pre-implementation
      state against post-implementation state, detecting phases that produced no commits.

      '
  plan_phase:
    tool: run_skill
    model: ''
    with:
      skill_command: /autoskillit:make-plan
      skill_inputs:
        task: ${{ context.group_files }}
        audit_cycle_path: ${{ context.audit_cycle_path }}
      cwd: ${{ context.worktree_path }}
      step_name: plan_phase
      output_dir: .
    capture:
      phase_plan_path: ${{ result.plan_path }}
      verdict: ${{ result.verdict }}
      plan_disposition_path: ${{ result.plan_disposition_path }}
    capture_list:
      plan_parts: ${{ result.plan_parts }}
    retries: 0
    on_result:
    - when: ${{ result.verdict }} == plan
      route: implement_phase
    on_failure: escalate_stop
    on_context_limit: salvage_plan_phase
    note: 'Plans the current setup phase. Set skill_inputs.task to the FIRST REMAINING phase file path from context.group_files
      — do NOT pass the entire list, and do NOT read the file; pass the path directly via skill_inputs.task (not via skill_command,
      which stays the fixed literal /autoskillit:make-plan). Glob plan_dir for *_part_*.md or single plan file. ITERATION: After
      each implement_phase cycle, advance to the next entry in context.group_files for the following plan_phase iteration,
      updating skill_inputs.task accordingly. On audit remediation re-entry, skill_inputs.audit_cycle_path carries the exact
      current audit_cycle_path; the skill emits its matching plan_disposition_path; verdict=plan is the only success.

      '
    optional_context_refs:
    - audit_cycle_path
  salvage_plan_phase:
    tool: run_python
    with:
      callable: autoskillit.recipe._cmd_rpc.verify_plan_artifacts
      plan_parts: ${{ context.plan_parts }}
      audit_cycle_path: ${{ context.audit_cycle_path }}
    capture:
      phase_plan_path: ${{ result.plan_path }}
      plan_disposition_path: ${{ result.plan_disposition_path }}
    capture_list:
      plan_parts: ${{ result.plan_parts }}
    optional_context_refs:
    - audit_cycle_path
    retries: 0
    on_result:
    - when: ${{ result.verdict }} == salvaged
      route: implement_phase
    - route: escalate_stop
    on_failure: escalate_stop
    note: 'Deterministic salvage for plan_phase context-limit stumbles: verifies captured plan_parts artifacts exist on disk.
      salvaged routes onward as if plan_phase succeeded; unsalvageable falls through to plan_phase''s original on_failure
      destination. Substitute the captured ${{ context.plan_parts }} value into the plan_parts argument verbatim, unmodified
      — do not reformat, quote, or re-derive it; the callable''s input grammar absorbs rendering variance.

      '
  implement_phase:
    tool: run_skill
    model: ''
    stale_threshold: 2400
    idle_output_timeout: 0
    with:
      skill_command: /autoskillit:implement-experiment
      skill_inputs:
        plan_path: ${{ context.phase_plan_path }}
      cwd: ${{ context.worktree_path }}
      step_name: implement_phase
      output_dir: .
    capture:
      worktree_path: ${{ result.worktree_path }}
    retries: 0
    on_success: next_phase_or_experiment
    on_failure: check_implement_fix_loop
    on_exhausted: audit_impl
    on_context_limit: audit_impl
    note: 'Implements the current phase plan in an isolated worktree via implement-experiment. Context exhaustion routes to
      audit_impl for implementation completeness verification before proceeding to run_experiment. Failures route to troubleshoot
      for classification before re-planning or escalation.

      '
  troubleshoot_implement_failure:
    tool: run_skill
    model: ''
    stale_threshold: 2400
    idle_output_timeout: 0
    with:
      skill_command: /autoskillit:troubleshoot-experiment
      skill_inputs:
        worktree_path: ${{ context.worktree_path }}
        step_name: implement_phase
      cwd: ${{ inputs.source_dir }}
      step_name: troubleshoot_implement_failure
      output_dir: '{{AUTOSKILLIT_TEMP}}/troubleshoot-experiment/implement_${{ context.implement_fix_count }}'
    optional_context_refs:
    - implement_fix_count
    capture:
      is_fixable: ${{ result.is_fixable }}
      retry_delay: ${{ result.retry_delay }}
    on_success: route_implement_failure
    on_failure: escalate_stop
  route_implement_failure:
    action: route
    on_result:
    - when: ${{ context.is_fixable }} == true
      route: route_implement_retry_delay
    - route: escalate_stop
  check_implement_fix_loop:
    tool: run_python
    with:
      callable: autoskillit.smoke_utils.check_loop_iteration
      current_iteration: ${{ context.implement_fix_count }}
      max_iterations: '3'
    capture:
      implement_fix_count: ${{ result.next_iteration }}
    on_result:
    - when: ${{ result.max_exceeded }} == true
      route: audit_impl
    - route: troubleshoot_implement_failure
    on_failure: audit_impl
    optional_context_refs:
    - implement_fix_count
    - retry_delay
    note: 'Iteration guard for implement_phase → troubleshoot → plan_phase cycle. Caps fix-and-retry loops at 3 iterations.
      On exhaustion, routes to audit_impl to verify implementation completeness before run_experiment.

      '
  route_implement_retry_delay:
    action: route
    on_result:
    - when: ${{ context.retry_delay }}
      route: implement_retry_delay
    - route: plan_phase
  implement_retry_delay:
    tool: run_cmd
    with:
      cmd: sleep ${{ context.retry_delay }}
      cwd: ${{ inputs.source_dir }}
      step_name: implement_retry_delay
    on_success: plan_phase
    on_failure: plan_phase
    optional_context_refs:
    - retry_delay
    note: 'Backoff delay for transient API errors. Sleeps for the number of seconds specified by troubleshoot-experiment (typically
      120s) before re-entering the plan_phase retry cycle.

      '
  next_phase_or_experiment:
    action: route
    on_result:
    - when: ${{ result.next }} == more_phases
      route: check_phase_loop
    - route: audit_impl
    note: 'Routing step. The agent evaluates remaining phases: 1. If more phases remain in group_files -> route to check_phase_loop.
      2. If all phases complete -> route to audit_impl for completeness verification.

      '
  check_phase_loop:
    tool: run_python
    with:
      callable: autoskillit.smoke_utils.check_loop_iteration
      current_iteration: ${{ context.phase_loop_count }}
      max_iterations: '15'
    capture:
      phase_loop_count: ${{ result.next_iteration }}
    on_result:
    - when: ${{ result.max_exceeded }} == true
      route: audit_impl
    - route: cleanup_phase_worktree
    on_failure: audit_impl
    optional_context_refs:
    - phase_loop_count
    note: 'Guards the plan_phase → implement_phase → next_phase_or_experiment cycle. The loop is data-bounded by the finite
      group_files list; this provides a structural bound. 15 iterations allows complex multi-phase setups.

      '
  cleanup_phase_worktree:
    tool: run_cmd
    with:
      cmd: git worktree remove --force "${{ context.worktree_path }}"
      step_name: cleanup_phase_worktree
    on_success: plan_phase
    on_failure: plan_phase
    note: 'Removes the previous phase worktree before implement_phase creates a new one. Each phase gets its own timestamped
      worktree via implement-experiment; this prevents orphaning the old worktree when the loop re-enters.

      '
  audit_impl:
    tool: run_skill
    model: ''
    with:
      skill_command: /autoskillit:audit-impl
      skill_inputs:
        all_plan_paths: ${{ context.group_files }}
        branch_name: ${{ context.impl_base_sha }}
        base_branch: ${{ inputs.base_branch }}
        prior_audit_cycle_path: ${{ context.audit_cycle_path }}
      cwd: ${{ context.worktree_path }}
      step_name: audit_impl
      output_dir: '{{AUTOSKILLIT_TEMP}}/audit-impl'
      retry_after_audit_attempt_id: ${{ context.audit_attempt_id }}
      closure_authority_path: ${{ inputs.closure_authority_path }}
      closure_authority_hash: ${{ inputs.closure_authority_hash }}
      closure_plan_paths: ${{ context.group_files }}
      closure_base_sha: ${{ context.impl_base_sha }}
      closure_diff_sha: ''
      closure_target_sha: ''
    capture:
      remediation_path: ${{ result.remediation_path }}
      audit_cycle_path: ${{ result.audit_cycle_path }}
      audit_status: ${{ result.audit_status }}
      audit_verdict: ${{ result.audit_verdict }}
      audit_attempt_id: ${{ result.audit_attempt_id }}
    on_result:
    - when: ${{ result.audit_status }} == SEMANTIC_REJECTED
      route: remediate
    - when: ${{ result.audit_status }} == CONFLICT
      route: escalate_stop
    - when: ${{ result.audit_status }} == STORAGE_FAILURE
      route: escalate_stop
    - when: ${{ result.audit_status }} == QUARANTINED
      route: escalate_stop
    - when: ${{ result.audit_status }} == NON_PUBLISHED_STANDALONE
      route: escalate_stop
    - when: ${{ result.audit_status }} == PUBLISHED and ${{ result.audit_verdict }} == GO
      route: run_experiment
    - when: ${{ result.audit_status }} == EXACT_REPLAY and ${{ result.audit_verdict }} == GO
      route: run_experiment
    - when: ${{ result.audit_status }} == PUBLISHED and ${{ result.audit_verdict }} == NO GO
      route: remediate
    - when: ${{ result.audit_status }} == EXACT_REPLAY and ${{ result.audit_verdict }} == NO GO
      route: remediate
    - when: result.error
      route: escalate_stop
    - route: escalate_stop
    on_failure: escalate_stop
    on_context_limit: escalate_stop
    skip_when_false: inputs.audit_impl
    on_skip: run_experiment
    optional_context_refs:
    - audit_cycle_path
    - audit_attempt_id
    note: 'Post-implementation quality gate. Diffs impl_base_sha..HEAD and verifies all decomposed phases from group_files
      have corresponding implementation commits. Catches silent group abandonment when on_context_limit fires mid-iteration
      — reports exactly which phases were completed vs. skipped. On GO, proceeds to run_experiment. On error, escalates immediately.
      On NO GO, routes to remediate which re-enters plan_phase via check_audit_retry_loop (max 2 cycles). If false (inputs.audit_impl=false),
      skip directly to run_experiment.

      '
  remediate:
    action: route
    with:
      audit_cycle_path: ${{ context.audit_cycle_path }}
    on_success: check_audit_retry_loop
    note: 'Carries the exact current NO GO authority into the retry. The successor audit consumes it as prior_audit_cycle_path
      and GO replaces it.

      '
  check_audit_retry_loop:
    tool: run_python
    with:
      callable: autoskillit.smoke_utils.check_loop_iteration
      current_iteration: ${{ context.audit_retry_count }}
      max_iterations: '2'
    capture:
      audit_retry_count: ${{ result.next_iteration }}
    on_result:
    - when: ${{ result.max_exceeded }} == true
      route: escalate_stop
    - route: pre_remediation_cleanup
    on_failure: escalate_stop
    optional_context_refs:
    - audit_retry_count
    note: 'Guards the audit_impl → remediate → plan_phase remediation cycle. Allows up to 2 remediation attempts before escalating.
      This prevents unbounded re-planning when audit_impl repeatedly returns NO GO.

      '
  pre_remediation_cleanup:
    tool: run_cmd
    with:
      cmd: git worktree remove --force "${{ context.worktree_path }}"
      step_name: pre_remediation_cleanup
    on_success: plan_phase
    on_failure: plan_phase
    note: 'Removes the old worktree before the remediation cycle creates a new one via implement_phase. on_failure routes
      to plan_phase regardless — if the worktree is already gone (e.g., context_limit cleanup), the new worktree created by
      the next implement_phase will work correctly.

      '
  run_experiment:
    tool: run_skill
    model: ''
    stale_threshold: 2400
    idle_output_timeout: 0
    with:
      skill_command: /autoskillit:run-experiment
      skill_inputs:
        worktree_path: ${{ context.worktree_path }}
      cwd: ${{ context.worktree_path }}
      step_name: run_experiment
      output_dir: .
    capture:
      experiment_results: ${{ result.results_path }}
      experiment_verdict: ${{ result.verdict }}
      blocked_hypotheses: ${{ result.blocked_hypotheses }}
      group_manifest: ${{ result.group_manifest }}
    retries: 2
    on_result:
    - when: ${{ result.verdict }} == CONCLUSIVE
      route: generate_report
    - when: ${{ result.verdict }} == BLOCKED
      route: escalate_stop
    - when: ${{ result.verdict }} == INCONCLUSIVE
      route: ensure_results
    on_failure: check_run_fix_loop
    on_exhausted: ensure_results
  troubleshoot_run_failure:
    tool: run_skill
    model: ''
    stale_threshold: 2400
    idle_output_timeout: 0
    with:
      skill_command: /autoskillit:troubleshoot-experiment
      skill_inputs:
        worktree_path: ${{ context.worktree_path }}
        step_name: run_experiment
      cwd: ${{ inputs.source_dir }}
      step_name: troubleshoot_run_failure
      output_dir: '{{AUTOSKILLIT_TEMP}}/troubleshoot-experiment/run_${{ context.run_fix_count }}'
    optional_context_refs:
    - run_fix_count
    capture:
      run_is_fixable: ${{ result.is_fixable }}
      run_retry_delay: ${{ result.retry_delay }}
    on_success: route_run_failure
    on_failure: escalate_stop
  route_run_failure:
    action: route
    on_result:
    - when: ${{ context.run_is_fixable }} == true
      route: adjust_experiment
    - route: escalate_stop
  adjust_experiment:
    tool: run_skill
    model: ''
    stale_threshold: 2400
    idle_output_timeout: 0
    with:
      skill_command: /autoskillit:run-experiment
      skill_inputs:
        worktree_path: ${{ context.worktree_path }}
        adjust: true
      cwd: ${{ context.worktree_path }}
      step_name: adjust
      output_dir: .
    capture:
      experiment_results: ${{ result.results_path }}
      experiment_verdict: ${{ result.verdict }}
      blocked_hypotheses: ${{ result.blocked_hypotheses }}
      group_manifest: ${{ result.group_manifest }}
    on_result:
    - when: ${{ result.verdict }} == CONCLUSIVE
      route: route_run_retry_delay
    - when: ${{ result.verdict }} == INCONCLUSIVE
      route: route_run_retry_delay
    - when: ${{ result.verdict }} == BLOCKED
      route: escalate_stop
    on_failure: ensure_results
    on_context_limit: escalate_stop
  check_run_fix_loop:
    tool: run_python
    with:
      callable: autoskillit.smoke_utils.check_loop_iteration
      current_iteration: ${{ context.run_fix_count }}
      max_iterations: '3'
    capture:
      run_fix_count: ${{ result.next_iteration }}
    on_result:
    - when: ${{ result.max_exceeded }} == true
      route: ensure_results
    - route: troubleshoot_run_failure
    on_failure: ensure_results
    optional_context_refs:
    - run_fix_count
    - run_retry_delay
    note: 'Iteration guard for run_experiment → troubleshoot → adjust_experiment cycle. Caps experiment fix loops at 3 iterations.
      On exhaustion, proceeds to ensure_results to salvage whatever data exists.

      '
  route_run_retry_delay:
    action: route
    on_result:
    - when: ${{ context.run_retry_delay }}
      route: run_retry_delay
    - route: run_experiment
  run_retry_delay:
    tool: run_cmd
    with:
      cmd: sleep ${{ context.run_retry_delay }}
      cwd: ${{ inputs.source_dir }}
      step_name: run_retry_delay
    on_success: run_experiment
    on_failure: run_experiment
    optional_context_refs:
    - run_retry_delay
    note: 'Backoff delay for transient API errors before re-entering the run_experiment retry cycle.

      '
  ensure_results:
    tool: run_python
    with:
      callable: autoskillit.recipe._cmd_rpc.ensure_results
      experiment_results: ${{ context.experiment_results }}
      worktree_path: ${{ context.worktree_path }}
      temp_subdir: '{{AUTOSKILLIT_TEMP}}'
    capture:
      experiment_results: ${{ result.experiment_results }}
    on_success: generate_report_inconclusive
    on_failure: escalate_stop
    note: 'Ensures context.experiment_results is a valid file path before calling generate_report_inconclusive. Creates a
      minimal placeholder results file when run-experiment never produced output (retries exhausted or adjust failed).

      '
  generate_report:
    tool: run_skill
    model: ''
    optional_context_refs:
    - classification_timestamp
    - disambiguation_rule_applied
    - experiment_type
    - methodology_tradition
    - tier_c_lens
    with:
      skill_command: /autoskillit:generate-report
      skill_inputs:
        worktree_path: ${{ context.worktree_path }}
        results_path: ${{ context.experiment_results }}
        output_mode: ${{ inputs.output_mode }}
        issue_url: ${{ inputs.issue_url }}
        experiment_type: ${{ context.experiment_type }}
        methodology_traditions: ${{ context.methodology_tradition }}
        design_review_verdict: ${{ context.verdict }}
        disambiguation_rule_applied: ${{ context.disambiguation_rule_applied }}
        tier_c_lens: ${{ context.tier_c_lens }}
        classification_timestamp: ${{ context.classification_timestamp }}
        group_manifest: ${{ context.group_manifest }}
      cwd: ${{ context.worktree_path }}
      step_name: generate_report
      output_dir: '{{AUTOSKILLIT_TEMP}}/generate-report'
    capture:
      report_path: ${{ result.report_path }}
    on_success: test
    on_failure: escalate_stop
    on_context_limit: escalate_stop
    note: Writes a conclusive research report to research/ in the worktree.
  generate_report_inconclusive:
    tool: run_skill
    model: ''
    optional_context_refs:
    - classification_timestamp
    - disambiguation_rule_applied
    - experiment_type
    - group_manifest
    - methodology_tradition
    - tier_c_lens
    with:
      skill_command: /autoskillit:generate-report
      skill_inputs:
        worktree_path: ${{ context.worktree_path }}
        results_path: ${{ context.experiment_results }}
        inconclusive: true
        output_mode: ${{ inputs.output_mode }}
        issue_url: ${{ inputs.issue_url }}
        experiment_type: ${{ context.experiment_type }}
        methodology_traditions: ${{ context.methodology_tradition }}
        design_review_verdict: ${{ context.verdict }}
        disambiguation_rule_applied: ${{ context.disambiguation_rule_applied }}
        tier_c_lens: ${{ context.tier_c_lens }}
        classification_timestamp: ${{ context.classification_timestamp }}
        group_manifest: ${{ context.group_manifest }}
      cwd: ${{ context.worktree_path }}
      step_name: generate_report
      output_dir: '{{AUTOSKILLIT_TEMP}}/generate-report'
    capture:
      report_path: ${{ result.report_path }}
    on_success: test
    on_failure: escalate_stop
    on_context_limit: escalate_stop
    note: 'Writes an inconclusive research report. Experiments could not prove or disprove the hypothesis. This is a valid
      outcome.

      '
  test:
    tool: test_check
    with:
      worktree_path: ${{ context.worktree_path }}
    skip_when_false: inputs.test_check_enabled
    on_skip: push_branch
    on_success: push_branch
    on_failure: fix_tests
  fix_tests:
    tool: run_skill
    model: ''
    with:
      skill_command: /autoskillit:resolve-failures
      skill_inputs:
        plan_path: ${{ context.experiment_plan }}
        base_branch: ${{ inputs.base_branch }}
        worktree_path: ${{ context.worktree_path }}
      cwd: ${{ inputs.source_dir }}
      step_name: fix
      output_dir: .
    capture:
      verdict: ${{ result.verdict }}
      fixes_applied: ${{ result.fixes_applied }}
    on_result:
    - when: ${{ result.verdict }} == 'real_fix'
      route: retest
    - when: ${{ result.verdict }} == 'already_green'
      route: retest
    - when: ${{ result.verdict }} == 'flake_suspected'
      route: retest
    - when: ${{ result.verdict }} == 'ci_only_failure'
      route: retest
    - when: ${{ result.verdict }} == 'no_test_infrastructure'
      route: escalate_stop
    - route: escalate_stop
    on_failure: escalate_stop
    on_context_limit: escalate_stop
  retest:
    tool: test_check
    with:
      worktree_path: ${{ context.worktree_path }}
    on_success: push_branch
    on_failure: escalate_stop
  push_branch:
    tool: run_cmd
    with:
      cmd: bash {{AUTOSKILLIT_SCRIPTS}}/push_branch.sh '${{ inputs.output_mode }}' '${{ context.worktree_path }}'
      cwd: ${{ context.worktree_path }}
      step_name: push_branch
    on_success: prepare_research_pr
    on_failure: escalate_stop
  prepare_research_pr:
    tool: run_skill
    model: ''
    with:
      skill_command: /autoskillit:prepare-research-pr
      skill_inputs:
        base_branch: ${{ inputs.base_branch }}
        worktree_path: ${{ context.worktree_path }}
        report_path: ${{ context.report_path }}
        experiment_plan_path: ${{ context.experiment_plan }}
      cwd: ${{ context.worktree_path }}
      step_name: prepare_research_pr
      output_dir: .
    capture:
      prep_path: ${{ result.prep_path }}
      selected_lenses: ${{ result.selected_lenses }}
      lens_context_paths: ${{ result.lens_context_paths }}
    on_success: initialize_diagram_paths
    on_failure: escalate_stop
  initialize_diagram_paths:
    tool: run_cmd
    with:
      cmd: ':'
      cwd: ${{ context.worktree_path }}
      step_name: initialize_diagram_paths
    capture:
      all_diagram_paths: ${{ result.stdout | trim }}
    on_success: run_experiment_lenses
    on_failure: escalate_stop
  run_experiment_lenses:
    tool: run_skill
    model: ''
    with:
      skill_command: /autoskillit:exp-lens-{slug}
      skill_inputs:
        context_path: '{context_path}'
        experiment_plan_path: ${{ context.experiment_plan }}
      cwd: ${{ context.worktree_path }}
      step_name: run_experiment_lenses
    capture_list:
      all_diagram_paths: ${{ result.diagram_path }}
    retries: 0
    on_success: stage_bundle
    on_failure: stage_bundle
    note: "LENS ITERATION: context.selected_lenses contains comma-separated lens slugs (e.g. \"fair-comparison,estimand-clarity\"\
      ). context.lens_context_paths contains the corresponding comma-separated context file paths. For each lens slug, run:\n\
      \  /autoskillit:exp-lens-{slug} {matching_context_path} ${{ context.experiment_plan }}\nRun all selected lenses in parallel\
      \ (multiple run_skill calls in a single assistant message). Accumulate each diagram_path value into context.all_diagram_paths\
      \ using comma separation via capture_list. If a lens fails, continue with remaining lenses — partial diagrams are acceptable\
      \ (compose_research_pr handles empty lists).\n"
  stage_bundle:
    tool: run_cmd
    with:
      cmd: bash {{AUTOSKILLIT_SCRIPTS}}/stage_bundle.sh '${{ context.research_dir }}' '${{ context.worktree_path }}' '{{AUTOSKILLIT_TEMP}}'
      cwd: ${{ context.worktree_path }}
      step_name: stage_bundle
    on_success: route_pr_or_local
    on_failure: route_pr_or_local
    note: 'Idempotent file staging step. Copies phase-group, phase-plan, and exp-lens diagram artifacts from the worktree
      temp directory into research/{slug}/artifacts/. Creates images/ and scripts/ subdirectories. No compression, no rename,
      no commit. Safe to run multiple times — cp overwrites are idempotent. Runs after run_experiment_lenses to capture all
      exp-lens diagrams written to AUTOSKILLIT_TEMP/exp-lens-*/.

      '
  route_pr_or_local:
    action: route
    on_result:
    - when: ${{ inputs.output_mode }} == local
      route: finalize_bundle
    - route: compose_research_pr
    note: 'Branches on output_mode after bundle staging. local → bypass PR pipeline entirely, jump to finalize_bundle. pr
      (fall-through) → compose_research_pr to open PR and run the full review/archival flow. Uses predicate route because
      skip_when_false only accepts bare inputs.<name> with no expression evaluation.

      '
  compose_research_pr:
    tool: run_skill
    model: ''
    with:
      skill_command: /autoskillit:compose-research-pr
      skill_inputs:
        all_diagram_paths: ${{ context.all_diagram_paths }}
        base_branch: ${{ inputs.base_branch }}
        worktree_path: ${{ context.worktree_path }}
        prep_path: ${{ context.prep_path }}
      cwd: ${{ context.worktree_path }}
      step_name: compose_research_pr
      output_dir: .
    capture:
      pr_url:
        from: ${{ result.pr_url }}
        type: optional_string
    on_success: guard_pr_url
    on_failure: escalate_stop
  guard_pr_url:
    action: route
    on_result:
    - when: "${{ context.pr_url }}"
      route: extract_pr_number
    - route: patch_token_summary
    note: Guard — skip review if pr_url is empty (graceful degradation from open_research_pr).

  extract_pr_number:
    tool: run_cmd
    with:
      cmd: "gh pr view '${{ context.pr_url }}' --json number -q .number"
      cwd: "${{ context.worktree_path }}"
      step_name: extract_pr_number
    capture:
      pr_number: "${{ result.stdout | trim }}"
    on_success: capture_review_repository
    on_failure: escalate_stop

  capture_review_repository:
    tool: run_cmd
    with:
      cmd: gh repo view --json nameWithOwner -q '.nameWithOwner | ascii_downcase'
      cwd: "${{ context.worktree_path }}"
      step_name: capture_review_repository
    capture:
      review_repository: "${{ result.stdout | trim }}"
    on_success: annotate_pr_diff
    on_failure: escalate_stop

  annotate_pr_diff:
    tool: run_python
    with:
      callable: autoskillit.smoke_utils.annotate_pr_diff
      pr_number: "${{ context.pr_number }}"
      cwd: "${{ context.worktree_path }}"
      output_dir: "{{AUTOSKILLIT_TEMP}}/review-research-pr/research"
      base_branch: "${{ inputs.base_branch }}"
      local_review_rounds: '0'
      work_dir: "${{ context.worktree_path }}"
    capture:
      annotated_diff_path: "${{ result.annotated_diff_path }}"
      hunk_ranges_path: "${{ result.hunk_ranges_path }}"
      valid_lines_path: "${{ result.valid_lines_path }}"
      review_mode: "${{ result.review_mode }}"
      pr_head_sha: "${{ result.pr_head_sha }}"
    on_success: review_research_pr
    on_failure: escalate_stop

  review_research_pr:
    tool: run_skill
    model: ''
    with:
      skill_command: /autoskillit:review-research-pr
      skill_inputs:
        base_branch: "${{ inputs.base_branch }}"
        worktree_path: "${{ context.worktree_path }}"
        pr_url: "${{ context.pr_url }}"
        repository: "${{ context.review_repository }}"
        pr_number: "${{ context.pr_number }}"
        pr_head_sha: "${{ context.pr_head_sha }}"
        logical_iteration: "review-research-pr:research"
        receipt_path: "{{AUTOSKILLIT_TEMP}}/review-research-pr/research/batch_review_response_${{ context.pr_number }}.json"
        mode: "${{ context.review_mode }}"
        annotated_diff_path: "${{ context.annotated_diff_path }}"
        hunk_ranges_path: "${{ context.hunk_ranges_path }}"
        valid_lines_path: "${{ context.valid_lines_path }}"
      cwd: "${{ context.worktree_path }}"
      step_name: review_research_pr
      output_dir: "{{AUTOSKILLIT_TEMP}}/review-research-pr/research"
    capture:
      review_verdict: "${{ result.verdict }}"
      review_operation_key: "${{ result.review_operation_key }}"
      review_head_sha: "${{ result.review_head_sha }}"
      review_post_state: "${{ result.review_post_state }}"
      review_receipt_path: "${{ result.review_receipt_path }}"
    pass_through: [verdict, review_post_state]
    skip_when_false: inputs.review_research_pr
    on_skip: check_review_posted
    on_context_limit: escalate_stop
    on_failure: escalate_stop
    on_result:
    - route: check_review_posted
    note: >
      Optional research PR review step, gated by the review_research_pr ingredient.
      Verdict captured as review_verdict for deferred routing. All paths
      (skip, success, failure, context-limit) route to audit_claims so both
      gates complete before any resolution step begins. When on_context_limit
      or on_failure fires, the capture block does not execute and
      context.review_verdict remains absent; the recipe engine treats absent
      context variables as empty string in comparisons, so downstream
      route_review_resolve safely falls through to route_claims_resolve.

  check_review_posted:
    tool: run_python
    with:
      callable: autoskillit.smoke_utils.check_review_posted
      work_dir: "${{ context.worktree_path }}"
      args:
        cwd: "${{ context.worktree_path }}"
        receipt_path: "${{ context.review_receipt_path }}"
        mode: github
        repository: "${{ context.review_repository }}"
        pr_number: "${{ context.pr_number }}"
        head_sha: "${{ context.review_head_sha }}"
        logical_iteration: "review-research-pr:research"
        operation_key: "${{ context.review_operation_key }}"
        post_state: "${{ context.review_post_state }}"
    skip_when_false: inputs.review_research_pr
    on_skip: audit_claims
    on_result:
    - when: "${{ result.reviews_posted }} == 'false'"
      route: escalate_stop
    - when: "${{ result.reviews_posted }} == 'true'"
      route: audit_claims
    - route: escalate_stop
    on_failure: escalate_stop

  audit_claims:
    tool: run_skill
    model: ''
    with:
      skill_command: /autoskillit:audit-claims
      skill_inputs:
        base_branch: "${{ inputs.base_branch }}"
        worktree_path: "${{ context.worktree_path }}"
        pr_url: "${{ context.pr_url }}"
        repository: "${{ context.review_repository }}"
        pr_number: "${{ context.pr_number }}"
        pr_head_sha: "${{ context.pr_head_sha }}"
        logical_iteration: "audit-claims:research"
        receipt_path: "{{AUTOSKILLIT_TEMP}}/audit-claims/batch_review_response_${{ context.pr_number }}.json"
      cwd: "${{ context.worktree_path }}"
      step_name: audit_claims
      output_dir: '{{AUTOSKILLIT_TEMP}}/audit-claims'
    capture:
      audit_verdict: "${{ result.verdict }}"
      audit_review_operation_key: "${{ result.review_operation_key }}"
      audit_review_head_sha: "${{ result.review_head_sha }}"
      audit_review_post_state: "${{ result.review_post_state }}"
      audit_review_receipt_path: "${{ result.review_receipt_path }}"
    pass_through: [verdict, review_post_state]
    skip_when_false: inputs.audit_claims
    on_skip: check_audit_review_posted
    retries: 1
    on_exhausted: escalate_stop
    on_context_limit: escalate_stop
    on_failure: escalate_stop
    on_result:
    - route: check_audit_review_posted
    note: >
      Optional citation-integrity gate, gated by the audit_claims ingredient.
      Runs after review_research_pr regardless of that step's verdict.
      All paths (skip, success, failure) route to route_review_resolve so both
      gates complete before resolution.

  check_audit_review_posted:
    tool: run_python
    with:
      callable: autoskillit.smoke_utils.check_review_posted
      work_dir: "${{ context.worktree_path }}"
      args:
        cwd: "${{ context.worktree_path }}"
        receipt_path: "${{ context.audit_review_receipt_path }}"
        mode: github
        repository: "${{ context.review_repository }}"
        pr_number: "${{ context.pr_number }}"
        head_sha: "${{ context.audit_review_head_sha }}"
        logical_iteration: "audit-claims:research"
        operation_key: "${{ context.audit_review_operation_key }}"
        post_state: "${{ context.audit_review_post_state }}"
    skip_when_false: inputs.audit_claims
    on_skip: route_review_resolve
    on_result:
    - when: "${{ result.reviews_posted }} == 'false'"
      route: escalate_stop
    - when: "${{ result.reviews_posted }} == 'true'"
      route: route_review_resolve
    - route: escalate_stop
    on_failure: escalate_stop

  route_review_resolve:
    action: route
    on_result:
    - when: ${{ context.review_verdict }} == changes_requested
      route: resolve_research_review
    - route: route_claims_resolve
    note: 'Routes to resolve_research_review only when the PR review found changes_requested. All other verdicts (approved,
      needs_human, empty/skipped) proceed directly to route_claims_resolve.

      '
  resolve_research_review:
    tool: run_skill
    model: ''
    with:
      skill_command: /autoskillit:resolve-research-review
      skill_inputs:
        base_branch: ${{ inputs.base_branch }}
        worktree_path: ${{ context.worktree_path }}
      cwd: ${{ context.worktree_path }}
      step_name: resolve_research_review
      output_dir: .
    capture:
      review_needs_rerun: ${{ result.needs_rerun }}
    retries: 2
    on_exhausted: route_claims_resolve
    on_context_limit: route_claims_resolve
    on_success: route_claims_resolve
    on_failure: route_claims_resolve
  route_claims_resolve:
    action: route
    on_result:
    - when: ${{ context.audit_verdict }} == changes_requested
      route: resolve_claims_review
    - route: merge_escalations
    note: 'Routes to resolve_claims_review only when the claims audit found changes_requested. All other verdicts (approved,
      needs_human, empty/skipped) proceed directly to merge_escalations. When audit_claims is skipped (inputs.audit_claims=false),
      context.audit_verdict is absent; the recipe engine treats absent variables as empty string, so the condition evaluates
      false and the fallback route to merge_escalations fires safely.

      '
  resolve_claims_review:
    tool: run_skill
    model: ''
    with:
      skill_command: /autoskillit:resolve-claims-review
      skill_inputs:
        base_branch: ${{ inputs.base_branch }}
        worktree_path: ${{ context.worktree_path }}
      cwd: ${{ context.worktree_path }}
      step_name: resolve_claims_review
      output_dir: .
    capture:
      claims_needs_rerun: ${{ result.needs_rerun }}
    retries: 2
    on_exhausted: merge_escalations
    on_context_limit: merge_escalations
    on_success: merge_escalations
    on_failure: merge_escalations
  merge_escalations:
    action: route
    on_result:
    - when: ${{ context.review_needs_rerun }} == true
      route: re_run_experiment
    - when: ${{ context.claims_needs_rerun }} == true
      route: re_run_experiment
    - route: finalize_bundle
    note: 'Merged escalation consumer replacing check_escalations. Triggers a single re_run_experiment if either review resolution
      or claims resolution flagged a rerun. When only design_flaw escalations exist (or none), routes directly to finalize_bundle
      — design_flaw escalations are already posted as inline PR comments by the resolve skills. Both context.review_needs_rerun
      and context.claims_needs_rerun may be absent if their respective resolution steps were never reached (e.g., no changes_requested
      verdict on that gate); the recipe engine evaluates absent context variables as empty string, so absent == true is always
      false and routes safely fall through to finalize_bundle.

      '
  re_run_experiment:
    tool: run_skill
    model: ''
    stale_threshold: 2400
    idle_output_timeout: 0
    with:
      skill_command: /autoskillit:run-experiment
      skill_inputs:
        worktree_path: ${{ context.worktree_path }}
        adjust: true
      cwd: ${{ context.worktree_path }}
      step_name: re_run_experiment
      output_dir: .
    capture:
      experiment_results: ${{ result.results_path }}
      experiment_verdict: ${{ result.verdict }}
      blocked_hypotheses: ${{ result.blocked_hypotheses }}
    on_result:
    - when: ${{ result.verdict }} == CONCLUSIVE
      route: re_generate_report
    - when: ${{ result.verdict }} == BLOCKED
      route: escalate_stop
    - when: ${{ result.verdict }} == INCONCLUSIVE
      route: re_push_research
    on_failure: re_push_research
    on_context_limit: escalate_stop
    note: 'Targeted re-run of affected benchmarks after review resolution applied code fixes. Uses --adjust to read previous
      results and re-run only what changed. Captures the updated results_path so re_generate_report uses the new results.
      on_failure falls through to push as best-effort — the code fixes from resolve are already committed and should still
      be pushed.

      '
  re_generate_report:
    tool: run_skill
    model: ''
    optional_context_refs:
    - classification_timestamp
    - disambiguation_rule_applied
    - experiment_type
    - group_manifest
    - methodology_tradition
    - tier_c_lens
    with:
      skill_command: /autoskillit:generate-report
      skill_inputs:
        worktree_path: ${{ context.worktree_path }}
        results_path: ${{ context.experiment_results }}
        output_mode: ${{ inputs.output_mode }}
        issue_url: ${{ inputs.issue_url }}
        experiment_type: ${{ context.experiment_type }}
        methodology_traditions: ${{ context.methodology_tradition }}
        design_review_verdict: ${{ context.verdict }}
        disambiguation_rule_applied: ${{ context.disambiguation_rule_applied }}
        tier_c_lens: ${{ context.tier_c_lens }}
        classification_timestamp: ${{ context.classification_timestamp }}
        group_manifest: ${{ context.group_manifest }}
      cwd: ${{ context.worktree_path }}
      step_name: re_generate_report
      output_dir: '{{AUTOSKILLIT_TEMP}}/generate-report'
    capture:
      report_path: ${{ result.report_path }}
    on_success: re_stage_bundle
    on_failure: re_push_research
    on_context_limit: re_push_research
    note: 'Re-generate the research report with updated benchmark results from the re-validation run. Passes context.experiment_results
      which was updated by re_run_experiment to point to the new results file. Falls through to push on failure.

      '
  re_stage_bundle:
    tool: run_cmd
    with:
      cmd: bash {{AUTOSKILLIT_SCRIPTS}}/stage_bundle.sh '${{ context.research_dir }}' '${{ context.worktree_path }}' '{{AUTOSKILLIT_TEMP}}'
      cwd: ${{ context.worktree_path }}
      step_name: re_stage_bundle
    on_success: re_test
    on_failure: re_push_research
    note: 'Idempotent re-staging after report rewrite. Same body as stage_bundle — updates artifact directory with any newly
      written phase artifacts before re-testing. Falls through to re_push_research on failure (best-effort).

      '
  re_test:
    tool: test_check
    with:
      worktree_path: ${{ context.worktree_path }}
    on_success: re_push_research
    on_failure: re_push_research
    note: 'Post-revalidation test gate. Both pass and fail route to push — the re-validation results should be pushed regardless
      so the PR reflects the current state of the code and measurements.

      '
  re_push_research:
    tool: run_cmd
    with:
      cmd: cd '${{ context.worktree_path }}' && git push
      cwd: ${{ context.worktree_path }}
      step_name: re_push_research
    on_success: finalize_bundle
    on_failure: begin_archival
  finalize_bundle:
    tool: run_cmd
    with:
      cmd: bash {{AUTOSKILLIT_SCRIPTS}}/finalize_bundle.sh '${{ inputs.output_mode }}' '${{ context.research_dir }}' '${{
        context.worktree_path }}'
      cwd: ${{ context.worktree_path }}
      step_name: finalize_bundle
    capture:
      report_path_after_finalize: ${{ result.report_path_after_finalize }}
    on_success: push_finalized_bundle
    on_failure: begin_archival
    note: 'Single compression point. Runs exactly once per recipe run. In pr mode: renames report.md → README.md, archives
      supporting artifacts, appends Archive Manifest, commits. In local mode: keeps report.md, excludes report.html/mermaid.min.js/images
      from the tar (they stay for local browsing), skips git commit. finalize_bundle_render always runs after this step regardless
      of mode.

      '
  push_finalized_bundle:
    tool: run_cmd
    with:
      cmd: cd '${{ context.worktree_path }}' && git push
      cwd: ${{ context.worktree_path }}
      step_name: push_finalized_bundle
    on_success: finalize_bundle_render
    on_failure: begin_archival
  finalize_bundle_render:
    tool: run_skill
    model: ''
    optional_context_refs:
    - all_diagram_paths
    - visualization_plan_path
    with:
      skill_command: /autoskillit:bundle-local-report
      skill_inputs:
        research_dir: ${{ context.research_dir }}
        all_diagram_paths: ${{ context.all_diagram_paths }}
        report_path: ${{ context.report_path_after_finalize }}
        visualization_plan_path: ${{ context.visualization_plan_path }}
      cwd: ${{ context.worktree_path }}
      step_name: finalize_bundle_render
      output_dir: .
    capture:
      html_path: ${{ result.html_path }}
    on_success: route_archive_or_export
    on_failure: route_archive_or_export
    note: 'HTML report rendering. Always runs after finalize_bundle on_success. Non-fatal: routes to route_archive_or_export
      on both outcomes, which branches on output_mode to either export_local_bundle (local) or begin_archival (pr).

      '
  route_archive_or_export:
    action: route
    on_result:
    - when: ${{ inputs.output_mode }} == local
      route: export_local_bundle
    - route: begin_archival
    note: 'Branches after HTML bundle rendering. local → export_local_bundle (copy to {source_dir}/research-bundles/). pr
      (fall-through) → begin_archival to run the existing archival phase.

      '
  export_local_bundle:
    tool: run_python
    with:
      callable: autoskillit.recipe._cmd_rpc.export_local_bundle
      source_dir: ${{ inputs.source_dir }}
      research_dir: ${{ context.research_dir }}
    capture:
      local_bundle_path: ${{ result.local_bundle_path }}
    on_success: patch_token_summary
    on_failure: patch_token_summary
    note: 'Local mode terminal export. Copies the finalized research_dir (containing report.html, mermaid.min.js, images/,
      report.md, artifacts.tar.gz) to {source_dir}/research-bundles/{slug}/. Non-fatal — routes to patch_token_summary on
      both outcomes. The captured local_bundle_path is available to the orchestrator via research_complete.

      '
  begin_archival:
    action: route
    on_result:
    - when: ${{ context.pr_url }}
      route: capture_experiment_branch
    - route: archive_skipped
    note: 'Gate step for the archival phase. Routes to artifact extraction when a research PR exists, otherwise skips directly
      to archive_skipped. All paths from review/resolve/re-push converge here.

      '
  archive_skipped:
    action: stop
    message: 'Research archival skipped — no PR URL was provided. This is expected when running in local output mode or when
      the upstream review phase did not produce a PR. No archival work was performed. Emit the L3 result sentinel JSON block
      now. The sentinel must include: success=true, reason="no_pr_url". Example sentinel: {"success": true, "reason": "no_pr_url"}'
  capture_experiment_branch:
    tool: run_cmd
    with:
      cmd: git -C '${{ context.worktree_path }}' rev-parse --abbrev-ref HEAD
      cwd: ${{ context.worktree_path }}
      step_name: capture_experiment_branch
    capture:
      experiment_branch: ${{ result.stdout | trim }}
    on_success: create_artifact_branch
    on_failure: patch_token_summary
  create_artifact_branch:
    tool: run_cmd
    with:
      cmd: bash {{AUTOSKILLIT_SCRIPTS}}/create_artifact_branch.sh '${{ context.worktree_path }}' '${{ context.experiment_branch
        }}' '${{ inputs.base_branch }}' '${{ context.research_dir }}'
      cwd: ${{ context.worktree_path }}
      step_name: create_artifact_branch
    capture:
      artifact_branch: ${{ result.artifact_branch }}
    on_success: open_artifact_pr
    on_failure: patch_token_summary
    note: 'Creates a temporary worktree from the base branch, checks out only the research/ directory from the experiment
      branch, commits and pushes, then removes the temporary worktree. Produces a single clean commit with zero production
      code changes.

      '
  open_artifact_pr:
    tool: run_cmd
    with:
      cmd: bash {{AUTOSKILLIT_SCRIPTS}}/open_artifact_pr.sh '${{ context.worktree_path }}' '${{ context.experiment_branch
        }}' '${{ context.artifact_branch }}' '${{ context.pr_url }}' '${{ inputs.base_branch }}' '${{ context.research_dir
        }}'
      cwd: ${{ context.worktree_path }}
      step_name: open_artifact_pr
    capture:
      artifact_pr_url: ${{ result.artifact_pr_url }}
    on_success: tag_experiment_branch
    on_failure: patch_token_summary
    note: 'Opens a PR containing only the research/ directory. The PR body documents the two-file structure (README.md + artifacts.tar.gz)
      and provides the extraction command. This PR is safe to merge — no production code.

      '
  tag_experiment_branch:
    tool: run_cmd
    with:
      cmd: bash {{AUTOSKILLIT_SCRIPTS}}/tag_experiment_branch.sh '${{ context.worktree_path }}' '${{ context.experiment_branch
        }}' '${{ context.artifact_pr_url }}'
      cwd: ${{ context.worktree_path }}
      step_name: tag_experiment_branch
    capture:
      archive_tag: ${{ result.archive_tag }}
    on_success: close_experiment_pr
    on_failure: patch_token_summary
    note: 'Creates an annotated tag preserving the full experiment branch (including all variant code, benchmark scaffolding,
      etc.) under archive/research/. Pushed to remote before any branch cleanup can occur.

      '
  close_experiment_pr:
    tool: run_cmd
    with:
      cmd: 'ARTIFACT_PR="${{ context.artifact_pr_url }}" && ARCHIVE_TAG="${{ context.archive_tag }}" && CLOSE_BODY=$(printf
        ''## Archived\n\nThis PR contained both research artifacts and experimental code.\n\n**Research record merged via:**
        %s\n**Full experiment branch preserved at:** `%s`\n\nThe artifact PR contains only files under `research/` (reports,
        scripts, results). The archive tag preserves the full experiment branch including variant code for reference.\n\nTo
        restore the full experiment: `git checkout %s`'' "${ARTIFACT_PR}" "${ARCHIVE_TAG}" "${ARCHIVE_TAG}") && gh pr close
        ''${{ context.pr_url }}'' --comment "${CLOSE_BODY}"

        '
      cwd: ${{ context.worktree_path }}
      step_name: close_experiment_pr
    on_success: patch_token_summary
    on_failure: patch_token_summary
    note: 'Closes the original experiment PR with a structured comment linking to the artifact PR (where research/ was merged)
      and the archive tag (where the full experiment branch is preserved). Both success and failure route to patch_token_summary
      — closing the PR is best-effort.

      '
  patch_token_summary:
    tool: run_python
    with:
      callable: autoskillit.smoke_utils.patch_pr_token_summary
      timeout: 60
      pr_url: ${{ context.pr_url }}
      cwd: ${{ context.worktree_path }}
    on_success: research_complete
    on_failure: research_complete
    note: 'Patches PR body with complete token summary; failure never blocks pipeline completion.

      '
  research_complete:
    action: stop
    message: 'Research complete. pr mode: report added to research/ folder and PR opened for review. local mode: bundle exported
      to {source_dir}/research-bundles/{slug}/ (context.local_bundle_path). Emit the L3 result sentinel JSON block now with
      success=true. Example sentinel: {"success": true, "reason": "research complete"}'
  escalate_stop:
    action: stop
    message: 'Research pipeline failed — human intervention needed. Check the latest step output for details. Emit the L3
      result sentinel JSON block now with success=false. Example sentinel: {"success": false, "reason": "research pipeline
      failed"}'
