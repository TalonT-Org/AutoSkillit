vectors:
- id: missing-context-fields
  role: repository-impact-profiler
  relationship_classes:
  - declares
  - references
  - affects
  rationale: Repository impact evidence retrieves only IV/DV, hypothesis, control,
    and success-criterion fields absent from supplied context while the parent preserves
    estimand interpretation.
- id: stated-claims-hypotheses
  role: repository-impact-profiler
  relationship_classes:
  - declares
  - references
  - affects
  rationale: Repository impact evidence finds hypotheses, research questions, goals,
    and claims in repository documentation and pre-existing revision-scoped artifacts
    while the parent formalizes them.
- id: treatment-definition
  role: semantic-code-navigator
  relationship_classes:
  - defines
  - calls
  - references
  rationale: Semantic navigation traces intervention, method, condition, configuration,
    and ablation definitions and call paths while the parent determines the formal
    treatment.
- id: outcome-definition
  role: semantic-code-navigator
  relationship_classes:
  - defines
  - calls
  - references
  rationale: Semantic navigation traces outcome, metric, endpoint, target, response,
    and dependent-variable measurement paths while the parent determines the formal
    outcome.
- id: population-scope
  role: repository-impact-profiler
  relationship_classes:
  - declares
  - references
  - affects
  rationale: Repository impact evidence inventories datasets, populations, samples,
    domains, tasks, benchmarks, scenarios, and settings while the parent determines
    the estimand population.
- id: complication-handling
  role: semantic-code-navigator
  relationship_classes:
  - defines
  - calls
  - references
  rationale: Semantic navigation traces missing-data, failure, timeout, exclusion,
    dropping, imputation, and censoring control flow while the parent evaluates estimand
    implications.
