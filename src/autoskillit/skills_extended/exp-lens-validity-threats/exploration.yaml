vectors:
- id: missing-context-fields
  role: repository-impact-profiler
  relationship_classes:
  - declares
  - references
  - affects
  rationale: Repository impact evidence fills only experiment-context fields missing
    after parent-side argument parsing, leaving validity interpretation to the parent.
- id: temporal-changes-history
  role: repository-impact-profiler
  relationship_classes:
  - declares
  - references
  - affects
  rationale: Repository impact evidence identifies deployment, release, update, migration,
    incident, outage, and rollback artifacts and affected experiment surfaces.
- id: instrumentation-changes
  role: repository-impact-profiler
  relationship_classes:
  - declares
  - references
  - affects
  rationale: Repository impact evidence identifies logging, monitoring, metric, measurement,
    instrumentation, version, and schema declarations and consumers.
- id: selection-filtering
  role: semantic-code-navigator
  relationship_classes:
  - defines
  - calls
  - references
  - affects
  rationale: Semantic navigation traces subject, sample, and data selection, filtering,
    eligibility, inclusion, exclusion, and sampling control paths without judging
    selection bias.
- id: co-interventions
  role: repository-impact-profiler
  relationship_classes:
  - declares
  - references
  - affects
  rationale: Repository impact evidence identifies concurrent experiment, parallel
    treatment, co-running change, and overlap declarations, configuration, registrations,
    and affected consumers.
- id: treatment-diffusion
  role: semantic-code-navigator
  relationship_classes:
  - defines
  - calls
  - references
  - affects
  rationale: Semantic navigation traces contamination, diffusion, spillover, shared-path,
    cross-group, and control-exposure definitions and calls while the parent assesses
    validity.
