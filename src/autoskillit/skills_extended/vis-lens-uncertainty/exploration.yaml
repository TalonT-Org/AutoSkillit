    independent-run construction, and affected figures while the parent judges sufficiency.
- id: existing-uncertainty-representation
  role: semantic-code-navigator
  relationship_classes:
  - defines
  - calls
  - references
  - affects
  rationale: Semantic navigation traces uncertainty-overlay definitions, parameters,
    calls, and affected visualization paths while measure correctness remains a parent
    judgment.
- id: claims-about-variance
  role: repository-impact-profiler
  relationship_classes:
  - declares
  - references
  - affects
  rationale: Repository impact evidence inventories pre-existing robustness, stability,
