name: composed-projection-parent
description: Parent recipe used to verify composed effective projections.
kitchen_rules:
  - Follow the declared routes.
ingredients:
  include_child:
    description: Include the child projection fixture.
    default: "true"
    hidden: true
steps:
  parent_step:
    tool: run_python
    with:
      step_name: parent_step
    on_success: child_placeholder
    on_failure: escalate
  child_placeholder:
    sub_recipe: composed-projection-child
    gate: include_child
    on_success: parent_done
    on_failure: escalate
  parent_done:
    action: stop
    message: Emit the L3 sentinel block with success=true and reason=Completed.
